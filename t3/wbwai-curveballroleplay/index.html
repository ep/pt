<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tough Crowd: the WBWAI Train the Trainer breakout wheel</title>
<link href="https://fonts.googleapis.com/css2?family=Limelight&family=Shrikhand&family=Cinzel+Decorative:wght@700;900&family=Montserrat:wght@500;700;800;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{ font-family:Montserrat,system-ui,sans-serif; overflow-x:hidden; transition: background-color .4s }
.deco{ display:none }
.stage{ position:relative; z-index:1; max-width:1100px; margin:0 auto; padding:30px 16px 70px }

/* header */
.head{ text-align:center; position:relative; padding:0 10px }
h1{ margin:12px 0 0; line-height:1 }
h1 .sub{ display:block; margin-top:14px }
.lede{ max-width:580px; margin:22px auto 0; font-size:15px; line-height:1.55; text-wrap:balance }

/* layout */
.floor{ display:grid; grid-template-columns:1fr; gap:28px; align-items:start; margin-top:44px }
@media(min-width:900px){ .floor{ grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr) } }

/* wheel geometry */
.wheel-wrap{ position:relative; width:min(92vw,560px); aspect-ratio:1; margin:0 auto }
#fx{ position:absolute; inset:-30%; width:160%; height:160%; pointer-events:none; z-index:6 }
.ring{ position:absolute; inset:0; border-radius:50% }
.bulbs,.glyphs{ position:absolute; inset:0 }
#wheel{ position:absolute; inset:9%; border-radius:50%; will-change:transform; overflow:hidden; background:#000 }
#wheel svg{ width:100%; height:100%; display:block }
.seg.pass{ filter:brightness(1.3) }
.seg-icon{ fill:none; stroke-width:4.5; stroke-linecap:round; stroke-linejoin:round }
.seg-label text{ letter-spacing:.04em }
.hub{ font:inherit; border:0; padding:0; cursor:pointer; position:absolute; left:50%; top:50%; aspect-ratio:1; transform:translate(-50%,-50%); border-radius:50%; z-index:4; display:grid; place-items:center; transition:transform .12s, filter .3s }
.hub:hover:not(:disabled){ transform:translate(-50%,-50%) scale(1.06) }
.hub:active:not(:disabled){ transform:translate(-50%,-50%) scale(.96) }
.hub:disabled{ cursor:default; filter:saturate(.5) brightness(.8) }
#pointer{ position:absolute; left:50%; top:2%; width:10%; aspect-ratio:1/1.3; transform:translateX(-50%); z-index:5; transform-origin:50% 20% }
#pointer.flick{ animation: flick .18s cubic-bezier(.2,1.6,.4,1) }
@keyframes flick{ 0%{ transform:translateX(-50%) rotate(-32deg)} 100%{ transform:translateX(-50%) rotate(0)} }

/* status + controls */
.status{ text-align:center; margin:30px 0 0; min-height:1.4em; text-wrap:balance }
.status.bump{ animation: bump .5s cubic-bezier(.2,1.4,.4,1) }
@keyframes bump{ 0%{ transform:scale(.9); opacity:0 } 100%{ transform:none; opacity:1 } }
.controls{ display:flex; gap:12px; justify-content:center; align-items:center; margin-top:14px; flex-wrap:wrap }
.ghost{ font:700 11px/1 Montserrat; letter-spacing:.16em; text-transform:uppercase; cursor:pointer; min-height:40px; padding:10px 16px; border-radius:999px; background:transparent }
.ghost[hidden]{ display:none }
:focus-visible{ outline:3px solid #68BFBD; outline-offset:3px }

/* roles */
.side{ display:grid; gap:18px }
.roles{ display:grid; grid-template-columns:1fr auto 1fr; align-items:center; gap:10px; padding:14px 16px; border-radius:12px; position:relative }
.round-tag{ position:absolute; top:-12px; left:50%; transform:translateX(-50%); font:800 10px/1 Montserrat; letter-spacing:.24em; text-transform:uppercase; padding:6px 12px; border-radius:999px; white-space:nowrap }
.role{ display:grid; gap:4px; text-align:center }
.role .who{ font:800 12px/1 Montserrat; letter-spacing:.14em; text-transform:uppercase }
.role .what{ font-family:Georgia,serif; font-style:italic; font-size:14px; line-height:1.3 }
.swap{ font-size:22px; opacity:.6 }
.roles.swapped{ animation: bump .5s cubic-bezier(.2,1.4,.4,1) }

/* card */
.card{ position:relative; border-radius:14px; padding:24px 22px 20px; min-height:220px }
.card.filled{ animation: pop .5s cubic-bezier(.2,1.4,.4,1) }
@keyframes pop{ 0%{ transform:scale(.8); opacity:0 } 100%{ transform:none; opacity:1 } }
.card-empty{ font-family:Georgia,serif; font-style:italic; display:grid; place-items:center; min-height:170px; text-align:center; opacity:.7 }
.card-tag{ position:absolute; top:-13px; left:18px; font:800 10px/1 Montserrat; letter-spacing:.22em; text-transform:uppercase; padding:6px 12px; border-radius:999px }
.card-icon{ width:52px; height:52px; fill:none; stroke-width:3; stroke-linecap:round; stroke-linejoin:round; float:right; margin:-2px -2px 8px 12px }
.card-name{ font-size:24px; margin:6px 0 8px }
.card-quote{ font-family:Georgia,serif; font-style:italic; font-size:17px; line-height:1.4; margin:0 0 14px; clear:both }
.card-k{ font:700 10px/1 Montserrat; letter-spacing:.22em; text-transform:uppercase; margin-top:12px }
.card-tell,.card-part,.card-fac{ margin:5px 0 0; font-size:14px; line-height:1.5 }
.card-fac{ font-weight:700 }

/* clock */
.prep{ display:none; border-radius:14px; padding:20px; text-align:center }
.prep.show{ display:block; animation: pop .5s cubic-bezier(.2,1.4,.4,1) }
.prep h2{ margin:0 0 4px }
.prep p{ margin:0 0 10px; font-size:14px; line-height:1.5 }
.clock{ font:800 64px/1.1 Montserrat; letter-spacing:.06em; margin:6px 0 8px; font-variant-numeric:tabular-nums }
.clock.hurry{ animation:blink 1s steps(1) infinite }
.clock.done{ font-size:34px }
@keyframes blink{ 50%{ opacity:.4 } }
.note{ display:none; font-family:Georgia,serif; font-style:italic; font-size:16px; margin-top:6px }
.note.show{ display:block }
footer{ text-align:center; margin-top:44px; font-size:11px; letter-spacing:.04em; opacity:.75 }
footer .dot{ display:inline-block; width:8px; height:8px; border-radius:50%; background:#FFCC00; margin-left:6px; vertical-align:middle }

/* fixed chrome: theme swatches bottom left, mute bottom right */
.themes{ position:fixed; left:16px; bottom:16px; z-index:40; display:flex; gap:8px; padding:6px; border-radius:999px; background:rgba(0,0,0,.35); backdrop-filter:blur(6px) }
.swatch{ width:22px; height:22px; border-radius:50%; border:2px solid rgba(255,255,255,.35); cursor:pointer; padding:0; opacity:.75; transition:transform .15s, opacity .15s }
.swatch:hover{ opacity:1; transform:scale(1.1) }
.swatch[aria-checked="true"]{ opacity:1; border-color:#fff; box-shadow:0 0 0 2px rgba(0,0,0,.4) }
.swatch[data-theme="vegas"]{ background:linear-gradient(135deg,#7a1c2a,#d8b24a) }
.swatch[data-theme="retro"]{ background:linear-gradient(135deg,#cf7a3e,#7f9a5c) }
.swatch[data-theme="oracle"]{ background:linear-gradient(135deg,#3b2455,#c9a95e) }
#muteBtn{ position:fixed; right:16px; bottom:16px; z-index:40; width:44px; height:44px; border-radius:50%; display:grid; place-items:center; padding:0; cursor:pointer; opacity:.75; transition:opacity .15s, transform .15s }
#muteBtn:hover{ opacity:1; transform:scale(1.06) }
#muteBtn svg{ width:22px; height:22px; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round }
#muteBtn svg path:first-child{ fill:currentColor }

@media (prefers-reduced-motion: reduce){ *,*::before,*::after{ animation:none !important; transition:none !important } }
.role .what{ opacity:.8 }
.role.is-part .what{ opacity:1; font-weight:700; font-style:normal; font-family:Montserrat; font-size:13px }

body.t-vegas{ --red:#9E2A3A; --wine:#5C1B26; --black:#0f0b0d; --gold:#D8B24A; --gold2:#F0D98A; --cream:#F4EAD8; --ink:#293851; --pink:#E27A9A;
  color:var(--cream); background:radial-gradient(ellipse at 50% 0%, #2a1218 0%, #170c10 45%, var(--black) 100%) }
body.t-vegas::before{ content:""; position:fixed; inset:0; pointer-events:none; z-index:0; background:repeating-linear-gradient(180deg, rgba(255,255,255,.02) 0 2px, transparent 2px 4px) }
.t-vegas .eyebrow{ font-weight:800; letter-spacing:.32em; font-size:11px; color:var(--gold); text-transform:uppercase }
.t-vegas h1{ font-family:Limelight,cursive; font-weight:400; font-size:clamp(34px,7vw,70px); color:#fff;
  text-shadow:0 0 8px rgba(255,255,255,.6), 0 0 22px rgba(226,122,154,.7), 0 0 50px rgba(158,42,58,.6); animation:neonV 4s ease-in-out infinite }

@keyframes neonV{ 0%,100%{opacity:1} 92%{opacity:1} 93%{opacity:.6} 94%{opacity:1} 97%{opacity:.75} 98%{opacity:1} }

.t-vegas .ghost{ border:2px solid rgba(216,178,74,.45); color:var(--gold) }

.t-vegas .card-tag{ background:var(--red); color:#fff; box-shadow:0 0 0 2px var(--gold) }
.t-vegas .card-icon{ stroke:var(--ink) }

.t-vegas footer{ color:#a89885 }

body.t-retro{ --orange:#CF7A3E; --mustard:#D9A94A; --avocado:#7F9A5C; --brown:#4A3324; --cream:#F5EBD6; --teal:#4C8F8A; --ink:#293851; --pink:#C9607E;

body.t-oracle{ --velvet:#1a1024; --velvet2:#2e1a44; --brass:#C9A95E; --brass2:#EAD79F; --parchment:#F3EAD6; --ink:#2b1a3a; --ember:#C46A3A; --mist:#a998c4;

function fitLabels(maxLen){
  var ts=document.querySelectorAll('.seg-label text');
  for (var i=0;i<ts.length;i++){ try { if(!ts[i].getComputedTextLength) continue; var L=ts[i].getComputedTextLength(); if(L>maxLen){ var fs=parseFloat(window.getComputedStyle(ts[i]).fontSize)||14; ts[i].style.fontSize=(fs*maxLen/L).toFixed(1)+'px'; } } catch(e){} }
}
function markWon(){ var els=document.querySelectorAll('.seg, .seg-label'); for(var i=0;i<els.length;i++) els[i].classList.toggle('won', personas.indexOf(+els[i].getAttribute('data-i'))>=0); }
function landingIndex(rot){ var a=((360-(rot%360))+360)%360; return Math.floor(a/SEG)%N; }

function spin(){
  if (spinning || roundLive || round>=2) return;
  spinning=true; play('press');
  document.body.classList.add('is-spinning');
  setStatus(SKIN.copy.spinning); $('hubBtn').disabled=true;
  var choices=[]; for(var i=0;i<N;i++) if(personas.indexOf(i)<0) choices.push(i);
  var target=choices[Math.floor(Math.random()*choices.length)];
  var jitter=(Math.random()*0.7+0.15)*SEG, finalMod=360-(target*SEG+jitter);
  var turns=5+Math.floor(Math.random()*3), start=rotation;
  var end=Math.ceil((start+turns*360)/360)*360+finalMod;
  var dur=reduced?400:5200+Math.random()*800, t0=performance.now(), lastSeg=landingIndex(start);
  function ease(t){ return 1-Math.pow(1-t,4); }
  function frame(now){
    var t=Math.min(1,(now-t0)/dur); rotation=start+(end-start)*ease(t);
    $('wheel').style.transform='rotate('+rotation+'deg)';
    var seg=landingIndex(rotation);
    if(seg!==lastSeg){ lastSeg=seg; play('tick'); flickPointer(); flashSeg(seg); }
    if(t<1) requestAnimationFrame(frame); else finish(target);
  }
  requestAnimationFrame(frame);
}
function flashSeg(i){ if(reduced) return; var el=document.querySelector('.seg[data-i="'+i+'"]'); if(!el) return; el.classList.add('pass'); setTimeout(function(){ el.classList.remove('pass'); },140); }
function flickPointer(){ var p=$('pointer'); if(!p||reduced) return; p.classList.remove('flick'); void p.offsetWidth; p.classList.add('flick'); }

function finish(idx){
  spinning=false; document.body.classList.remove('is-spinning');
  round++; personas.push(idx); roundLive=true;
  play('land'); celebrate(); markWon();
  renderCard(idx); renderRoles();
  setStatus(SKIN.copy.live[round-1]);
  $('prepH').textContent=SKIN.copy.prepH[round-1];
  $('prepPanel').classList.add('show'); $('prepPanel').setAttribute('aria-hidden','false');
  $('presentNote').classList.remove('show'); $('clock').className='clock';
  $('endRound').hidden=false;
  setTimeout(startClock, reduced?300:1600);
}

function renderCard(idx){
  var p=PERSONAS[idx], el=$('card');
  el.innerHTML='<div class="card-tag">'+esc(SKIN.copy.cardTag)+'</div>'
   +'<svg class="card-icon" viewBox="0 0 64 64" aria-hidden="true">'+p.icon+'</svg>'
   +'<h3 class="card-name">'+esc(p.name)+'</h3>'
   +'<p class="card-quote">\u201C'+esc(p.quote)+'\u201D</p>'
   +'<div class="card-k">'+esc(SKIN.copy.tellLabel)+'</div><p class="card-tell">'+esc(p.tell)+'</p>'
   +'<div class="card-k">'+esc(SKIN.copy.partLabel)+'</div><p class="card-part">'+esc(PART)+'</p>'
   +'<div class="card-k">'+esc(SKIN.copy.facLabel)+'</div><p class="card-fac">'+esc(FAC)+'</p>';
  el.classList.remove('filled'); void el.offsetWidth; el.classList.add('filled');
}
function renderRoles(){
  /* Player A plays the participant in round one, Player B in round two */
  var r=Math.max(round,1), aIsPart=(r===1);
  $('roundTag').textContent='Round '+r+' of 2';
  $('whatA').textContent=aIsPart?SKIN.copy.partRole:SKIN.copy.facRole;
  $('whatB').textContent=aIsPart?SKIN.copy.facRole:SKIN.copy.partRole;
  $('roleA').classList.toggle('is-part',aIsPart); $('roleB').classList.toggle('is-part',!aIsPart);
  var roles=$('roles'); roles.classList.remove('swapped'); void roles.offsetWidth; roles.classList.add('swapped');
}

/* ---------- Clock ---------- */
var timer=null, remain=ROUND_SECONDS;
function fmt(s){ var m=Math.floor(s/60), r=s%60; return m+':'+(r<10?'0':'')+r; }
function startClock(){
  if(timer||!roundLive) return;
  remain=ROUND_SECONDS; $('clock').textContent=fmt(remain);
  timer=setInterval(function(){
    remain--; $('clock').textContent=fmt(remain);
    if(remain===ROUND_SECONDS-CHARACTER_SECONDS){ play('cue'); setStatus(SKIN.copy.scene); }
    if(remain===30) $('clock').classList.add('hurry');
    if(remain<=0) endRound(true);
  },1000);
}
function endRound(natural){
  if(!roundLive) return;
  if(timer){ clearInterval(timer); timer=null; }
  roundLive=false;
  $('clock').textContent=SKIN.copy.timeUp; $('clock').className='clock done';
  if(natural) play('timeup');
  $('presentNote').textContent=SKIN.copy.note[round-1]; $('presentNote').classList.add('show');
  $('endRound').hidden=true;
  if(round<2){ setStatus(SKIN.copy.between); $('hubBtn').disabled=false; renderRolesPreview(); }
  else { setStatus(SKIN.copy.done); $('hubBtn').disabled=true; }
}
function renderRolesPreview(){ /* show the swapped roles before round two is spun */
  $('roundTag').textContent='Round 2 of 2';
  $('whatA').textContent=SKIN.copy.facRole; $('whatB').textContent=SKIN.copy.partRole;
  $('roleA').classList.remove('is-part'); $('roleB').classList.add('is-part');
}
function reset(){
  if(timer){ clearInterval(timer); timer=null; }
  round=0; personas=[]; spinning=false; roundLive=false; remain=ROUND_SECONDS;
  markWon();
  $('card').innerHTML='<div class="card-empty">'+esc(SKIN.copy.empty[0])+'</div>'; $('card').classList.remove('filled');
  $('prepPanel').classList.remove('show'); $('prepPanel').setAttribute('aria-hidden','true');
  $('clock').textContent=fmt(ROUND_SECONDS); $('clock').className='clock';
  $('presentNote').classList.remove('show'); $('endRound').hidden=true;
  renderRoles(); setStatus(SKIN.copy.spin1); $('hubBtn').disabled=false;
}
function setStatus(t){ var s=$('status'); s.textContent=t; s.classList.remove('bump'); void s.offsetWidth; s.classList.add('bump'); }

/* ---------- Confetti ---------- */
function celebrate(){
  if(reduced) return; var c=$('fx'); if(!c||!c.getContext) return; var g=c.getContext('2d'); if(!g) return;
  c.width=c.offsetWidth; c.height=c.offsetHeight; var parts=[], cols=SKIN.confetti;
  for(var i=0;i<SKIN.confettiCount;i++) parts.push({x:c.width/2+(Math.random()-0.5)*c.width*0.4,y:c.height*0.45,vx:(Math.random()-0.5)*14,vy:-Math.random()*14-4,r:Math.random()*6+3,col:cols[i%cols.length],rot:Math.random()*6,vr:(Math.random()-0.5)*0.3});
  var t0=performance.now();
  (function loop(now){ var t=(now-t0)/1000; g.clearRect(0,0,c.width,c.height);
    for(var i=0;i<parts.length;i++){ var p=parts[i]; p.x+=p.vx; p.y+=p.vy; p.vy+=0.35; p.vx*=0.99; p.rot+=p.vr;
      g.save(); g.translate(p.x,p.y); g.rotate(p.rot); g.fillStyle=p.col; g.globalAlpha=Math.max(0,1-t/2.4);
      if(SKIN.confettiShape==='circle'){ g.beginPath(); g.arc(0,0,p.r*0.6,0,6.3); g.fill(); }
      else if(SKIN.confettiShape==='star'){ g.beginPath(); for(var k=0;k<10;k++){ var rr=k%2?p.r*0.45:p.r, a=k*Math.PI/5; g.lineTo(Math.cos(a)*rr,Math.sin(a)*rr);} g.closePath(); g.fill(); }
      else g.fillRect(-p.r/2,-p.r/2,p.r,p.r*0.6);
      g.restore(); }
    if(t<2.6) requestAnimationFrame(loop); else g.clearRect(0,0,c.width,c.height); })(t0);
}

/* ---------- Mute ---------- */
var ICON_ON='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/></svg>';
var ICON_OFF='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M16 9l5 6M21 9l-5 6"/></svg>';
function paintMute(){ var b=$('muteBtn'); b.innerHTML=muted?ICON_OFF:ICON_ON; b.setAttribute('aria-pressed',muted?'true':'false'); b.setAttribute('aria-label',muted?SKIN.copy.unmute:SKIN.copy.mute); b.title=b.getAttribute('aria-label'); }

/* ---------- Theme ---------- */
function decorate(){
  var b=$('bulbs'); b.innerHTML=''; var cls=['','b','c'];
  for(var i=0;i<36;i++){ var a=i/36*Math.PI*2, d=document.createElement('span'); d.className='bulb '+cls[i%3]; d.style.left=(50+Math.cos(a)*46.5)+'%'; d.style.top=(50+Math.sin(a)*46.5)+'%'; d.style.transform='translate(-50%,-50%)'; b.appendChild(d); }
  var s=$('stars'); s.innerHTML='';
  for(i=0;i<60;i++){ var e=document.createElement('i'); e.style.left=Math.random()*100+'%'; e.style.top=Math.random()*100+'%'; e.style.animationDelay=(Math.random()*3)+'s'; e.style.animationDuration=(2+Math.random()*3)+'s'; s.appendChild(e); }
  var g=$('glyphs'); g.innerHTML=''; var sym=['\u2609','\u263D','\u2640','\u2642','\u2643','\u2644','\u2646','\u2647','\u2648','\u2649','\u264A','\u264B','\u264C','\u264D','\u264E','\u264F','\u2650','\u2651','\u2652','\u2653','\u2727','\u2726','\u2606','\u2605'];
  for(var k=0;k<24;k++){ var ang=k/24*Math.PI*2-Math.PI/2, sp=document.createElement('span'); sp.textContent=sym[k]+'\uFE0E'; sp.style.left=(50+Math.cos(ang)*47)+'%'; sp.style.top=(50+Math.sin(ang)*47)+'%'; g.appendChild(sp); }
}
function applyCopy(){
  var c=SKIN.copy;
  $('eyebrow').textContent=c.eyebrow; $('titleMain').textContent=c.title; $('titleSub').textContent=c.sub; $('lede').textContent=c.lede;
  $('prepP').textContent=c.prepP; $('hubText').textContent=SKIN.hub;
  if(round>0){ $('prepH').textContent=c.prepH[round-1]; renderCard(personas[round-1]); $('card').classList.remove('filled'); }
  else $('card').innerHTML='<div class="card-empty">'+esc(c.empty[0])+'</div>';
  if(round>0 && !roundLive) $('presentNote').textContent=c.note[round-1];
  /* status: re-derive from state */
  if(spinning) setStatus(c.spinning); else if(roundLive) setStatus(c.live[round-1]); else if(round===0) setStatus(c.spin1); else if(round===1) setStatus(c.between); else setStatus(c.done);
  if(round>0 && !roundLive && round<2) renderRolesPreview(); else renderRoles();
  paintMute();
}
function setTheme(name){
  if(!SKINS[name]) return;
  themeName=name; SKIN=SKINS[name];
  document.body.className=document.body.className.replace(/\bt-\w+/g,'').trim()+' t-'+name;
  var sw=document.querySelectorAll('.swatch'); for(var i=0;i<sw.length;i++) sw[i].setAttribute('aria-checked', sw[i].getAttribute('data-theme')===name?'true':'false');
  buildWheel(); applyCopy();
  try{ localStorage.setItem('tc-theme',name); }catch(e){}
}

/* ---------- Boot ---------- */
decorate();
var saved=null; try{ saved=localStorage.getItem('tc-theme'); }catch(e){}
setTheme(saved&&SKINS[saved]?saved:'vegas'); reset();
$('hubBtn').addEventListener('click',spin);
$('endRound').addEventListener('click',function(){ endRound(false); });
$('resetBtn').addEventListener('click',reset);
$('muteBtn').addEventListener('click',function(){ muted=!muted; paintMute(); });
var sw=document.querySelectorAll('.swatch'); for(var i=0;i<sw.length;i++) sw[i].addEventListener('click',function(){ setTheme(this.getAttribute('data-theme')); });
document.addEventListener('keydown',function(e){ if(e.code==='Space'&&document.activeElement===document.body){ e.preventDefault(); spin(); } });
window.__wheel={ spin:spin, finish:finish, reset:reset, endRound:endRound, setTheme:setTheme, landingIndex:landingIndex, state:function(){ return { round:round, personas:personas.slice(), spinning:spinning, roundLive:roundLive, remain:remain, theme:themeName }; } };
})();

</script>
