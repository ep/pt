<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tough Crowd: the WBWAI Train the Trainer wheel</title>
<link href="https://fonts.googleapis.com/css2?family=Limelight&family=Shrikhand&family=Cinzel+Decorative:wght@700;900&family=Montserrat:wght@500;700;800;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{ font-family:Montserrat,system-ui,sans-serif; overflow-x:hidden }
.deco{ display:none }
.stage{ position:relative; z-index:1; max-width:1180px; margin:0 auto; padding:clamp(12px,2vh,24px) 18px clamp(6px,1.2vh,14px); display:flex; flex-direction:column; min-height:100vh; min-height:100svh }

/* header: compact, scales with viewport height */
.head{ text-align:center; position:relative; padding:0 10px; flex:0 0 auto }
h1{ margin:clamp(6px,1.2vh,12px) 0 0; line-height:1 }
h1 .sub{ display:block; margin-top:clamp(6px,1vh,12px) }
.lede{ max-width:640px; margin:clamp(10px,1.6vh,18px) auto 0; font-size:clamp(13px,1.7vh,15px); line-height:1.5; text-wrap:balance }

/* layout */
.floor{ flex:1 1 auto; display:grid; grid-template-columns:1fr; gap:clamp(18px,3vh,30px); align-items:center; margin-top:clamp(14px,2.4vh,30px) }
@media(min-width:900px){ .floor{ grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:34px } }

/* wheel sized by height so it never pushes the page past one screen */
.wheel-col{ display:grid; place-items:center }
.wheel-wrap{ position:relative; width:min(88vw, 60vh, 560px); aspect-ratio:1 }
#fx{ position:fixed; inset:0; width:100%; height:100%; pointer-events:none; z-index:6 }
.ring{ position:absolute; inset:0; border-radius:50% }
.bulbs,.glyphs{ position:absolute; inset:0 }
#wheel{ position:absolute; inset:9%; border-radius:50%; will-change:transform; overflow:hidden; background:#000 }
#wheel svg{ width:100%; height:100%; display:block }
.seg.pass{ filter:brightness(1.3) }
.seg-icon{ fill:none; stroke-width:4.5; stroke-linecap:round; stroke-linejoin:round }
.seg-label text{ letter-spacing:.04em }
.hub{ font:inherit; border:0; padding:0; cursor:pointer; position:absolute; left:50%; top:50%; aspect-ratio:1; transform:translate(-50%,-50%); border-radius:50%; z-index:4; display:grid; place-items:center; transition:transform .12s }
.hub:hover{ transform:translate(-50%,-50%) scale(1.06) }
.hub:active{ transform:translate(-50%,-50%) scale(.96) }
.hub:disabled{ cursor:default }
#pointer{ position:absolute; left:50%; top:2%; width:10%; aspect-ratio:1/1.3; transform:translateX(-50%); z-index:5; transform-origin:50% 20% }
#pointer.flick{ animation: flick .18s cubic-bezier(.2,1.6,.4,1) }
@keyframes flick{ 0%{ transform:translateX(-50%) rotate(-32deg)} 100%{ transform:translateX(-50%) rotate(0)} }

/* card */
.card{ position:relative; border-radius:14px; padding:clamp(16px,2.4vh,24px) 22px clamp(14px,2vh,20px) }
.card.filled{ animation: pop .5s cubic-bezier(.2,1.4,.4,1) }
@keyframes pop{ 0%{ transform:scale(.85); opacity:0 } 100%{ transform:none; opacity:1 } }
.card-empty{ font-family:Georgia,serif; font-style:italic; display:grid; place-items:center; min-height:clamp(150px,26vh,240px); text-align:center; opacity:.75; font-size:15px; line-height:1.5; padding:0 10px }
.card-tag{ position:absolute; top:-13px; left:18px; font:800 10px/1 Montserrat; letter-spacing:.22em; text-transform:uppercase; padding:6px 12px; border-radius:999px }
.card-icon{ width:clamp(40px,6vh,52px); height:clamp(40px,6vh,52px); fill:none; stroke-width:3; stroke-linecap:round; stroke-linejoin:round; float:right; margin:-2px -2px 8px 12px }
.card-name{ font-size:clamp(20px,3vh,26px); margin:2px 0 clamp(8px,1.4vh,12px) }
.line{ font-family:Georgia,serif; font-style:italic; font-size:clamp(15px,2.1vh,18px); line-height:1.4; margin:0; clear:both }
.line.follow{ margin-top:clamp(6px,1vh,10px); opacity:.85; font-size:clamp(14px,1.9vh,16px) }
.card-k{ font:700 10px/1 Montserrat; letter-spacing:.22em; text-transform:uppercase; margin:clamp(10px,1.8vh,16px) 0 6px }
.tell{ font-size:clamp(13px,1.8vh,14px); line-height:1.45; margin:0 }
footer{ flex:0 0 auto; text-align:center; margin-top:clamp(8px,1.4vh,16px); font-size:11px; letter-spacing:.04em; opacity:.7 }
footer .dot{ display:inline-block; width:8px; height:8px; border-radius:50%; background:#FFCC00; margin-left:6px; vertical-align:middle }

/* fixed chrome */
.themes{ position:fixed; left:16px; bottom:16px; z-index:40; display:flex; gap:8px; padding:6px; border-radius:999px; background:rgba(0,0,0,.35); backdrop-filter:blur(6px) }
.swatch{ width:22px; height:22px; border-radius:50%; border:2px solid rgba(255,255,255,.35); cursor:pointer; padding:0; opacity:.75; transition:transform .15s, opacity .15s }
.swatch:hover{ opacity:1; transform:scale(1.1) }
.swatch[aria-checked="true"]{ opacity:1; border-color:#fff; box-shadow:0 0 0 2px rgba(0,0,0,.4) }
.swatch[data-theme="vegas"]{ background:linear-gradient(135deg,#7a1c2a,#d8b24a) }
.swatch[data-theme="retro"]{ background:linear-gradient(135deg,#cf7a3e,#7f9a5c) }
.swatch[data-theme="oracle"]{ background:linear-gradient(135deg,#3b2455,#c9a95e) }
#muteBtn{ position:fixed; right:16px; bottom:16px; z-index:40; width:40px; height:40px; border-radius:50%; display:grid; place-items:center; padding:0; cursor:pointer; opacity:.7; transition:opacity .15s, transform .15s }
#muteBtn:hover{ opacity:1; transform:scale(1.06) }
#muteBtn svg{ width:20px; height:20px; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round }
#muteBtn svg path:first-child{ fill:currentColor }
:focus-visible{ outline:3px solid #68BFBD; outline-offset:3px }

/* narrow screens scroll normally */
@media(max-width:899px){ .stage{ min-height:0 } .wheel-wrap{ width:min(88vw,420px) } .card-empty{ min-height:150px } }
@media (prefers-reduced-motion: reduce){ *,*::before,*::after{ animation:none !important; transition:none !important } }

body.t-vegas{ --red:#9E2A3A; --wine:#5C1B26; --black:#0f0b0d; --gold:#D8B24A; --gold2:#F0D98A; --cream:#F4EAD8; --ink:#293851; --pink:#E27A9A;
  color:var(--cream); background:radial-gradient(ellipse at 50% 0%, #2a1218 0%, #170c10 45%, var(--black) 100%) }
body.t-vegas::before{ content:""; position:fixed; inset:0; pointer-events:none; z-index:0; background:repeating-linear-gradient(180deg, rgba(255,255,255,.02) 0 2px, transparent 2px 4px) }

.t-vegas #wheel{ box-shadow:0 0 0 4px #1a0c0f, inset 0 0 0 3px var(--gold), 0 18px 50px rgba(0,0,0,.7) }

.t-vegas .seg-label text{ font-family:Montserrat; font-weight:800; font-size:13px; fill:#fff; text-transform:uppercase }
.t-vegas .lbl-1 text{ fill:var(--gold2) }
.t-vegas .lbl-2 text{ fill:#1c1214 }

.t-vegas .hub{ width:16%; background:radial-gradient(circle at 35% 30%, #fff3cc, var(--gold) 45%, #8a6a1e 100%); box-shadow:0 0 0 5px #2a1015, 0 0 24px rgba(216,178,74,.55) }
.t-vegas .hub-text{ font-weight:900; font-size:clamp(10px,1.6vw,14px); color:#2a1015; letter-spacing:.15em }
.t-vegas #pointer{ filter:drop-shadow(0 4px 10px rgba(0,0,0,.6)) }
.t-vegas .pt-body{ fill:var(--gold); stroke:#2a1015; stroke-width:3 }
.t-vegas .pt-dot{ fill:var(--red) }
.t-vegas .card{ background:#fff; color:var(--ink); border:4px solid var(--gold); box-shadow:0 0 0 3px var(--red), 0 20px 50px rgba(0,0,0,.6) }
.t-vegas .card-tag{ background:var(--red); color:#fff; box-shadow:0 0 0 2px var(--gold) }
.t-vegas .card-icon{ stroke:var(--ink) }

.t-vegas .card-name{ font-family:Montserrat; font-weight:900 }

body.t-vegas.t-vegas .card-empty{ color:#6f7890 }
body.t-vegas.t-vegas .line{ color:#293851 }
body.t-vegas.t-vegas .line.follow{ color:#4a5670 }
body.t-vegas.t-vegas .tell{ color:#3c4761 }
body.t-retro{ --orange:#CF7A3E; --mustard:#D9A94A; --avocado:#7F9A5C; --brown:#4A3324; --cream:#F5EBD6; --teal:#4C8F8A; --ink:#293851; --pink:#C9607E;
  color:var(--brown); background-color:#6d4a33;

.t-retro .deco.burst{ display:block; position:absolute; left:50%; top:50%; width:min(120vw,900px); aspect-ratio:1; transform:translate(-50%,-52%); z-index:-1; opacity:.5;

body.t-oracle{ --velvet:#1a1024; --velvet2:#2e1a44; --brass:#C9A95E; --brass2:#EAD79F; --parchment:#F3EAD6; --ink:#2b1a3a; --ember:#C46A3A; --mist:#a998c4;
  font-family:Georgia,serif; color:var(--parchment); background:radial-gradient(ellipse at 50% 20%, #3b2455 0%, var(--velvet2) 30%, var(--velvet) 70%, #0f0916 100%) }

@keyframes twinkleO{ 0%,100%{ opacity:.1; transform:scale(.7) } 50%{ opacity:.7; transform:scale(1.2) } }

.t-oracle .hub::after{ content:""; position:absolute; left:50%; bottom:-22%; width:70%; height:22%; transform:translateX(-50%); background:linear-gradient(180deg,var(--brass2),#7d6230); border-radius:0 0 40% 40% / 0 0 100% 100%; z-index:-1 }

/* ---------- Wheel ---------- */
var $=function(id){ return document.getElementById(id); };

function buildWheel(){

function fitLabels(maxLen){

/* ---------- Confetti ---------- */

function setTheme(name){
  if(!LOOK[name]||!COPY.themes[name]) return;
  themeName=name; SKIN=LOOK[name]; TXT=COPY.themes[name];
  document.body.className=document.body.className.replace(/\bt-\w+/g,'').trim()+' t-'+name;
  var sw=document.querySelectorAll('.swatch');
  for(var i=0;i<sw.length;i++) sw[i].setAttribute('aria-checked', sw[i].getAttribute('data-theme')===name?'true':'false');
  $('eyebrow').textContent=TXT.eyebrow; $('titleMain').textContent=TXT.title; $('titleSub').textContent=TXT.sub; $('lede').textContent=TXT.lede;
  $('hubText').textContent=TXT.hub; $('hubBtn').setAttribute('aria-label', TXT.title);
  $('footerText').textContent=COPY.footer;
  document.title=TXT.title;
  buildWheel(); renderCard(); paintMute();
  try{ localStorage.setItem('tc-theme',name); }catch(e){}
}

/* ---------- Boot ---------- */
decorate();
var saved=null; try{ saved=localStorage.getItem('tc-theme'); }catch(e){}
setTheme(saved&&LOOK[saved]?saved:'vegas');
$('hubBtn').addEventListener('click',spin);
$('muteBtn').addEventListener('click',function(){ muted=!muted; paintMute(); });
var sw=document.querySelectorAll('.swatch');
for(var i=0;i<sw.length;i++) sw[i].addEventListener('click',function(){ setTheme(this.getAttribute('data-theme')); });
document.addEventListener('keydown',function(e){ if(e.code==='Space'&&document.activeElement===document.body){ e.preventDefault(); spin(); } });
window.__wheel={ spin:spin, finish:finish, setTheme:setTheme, landingIndex:landingIndex, state:function(){ return { current:current, spinning:spinning, theme:themeName }; } };
})();

</script>
