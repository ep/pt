function readPhoto(file,path){
  if(!/^image\//.test(file.type||"")){ toast("That file isn’t an image. Try a JPG or PNG."); return; }
  var fr=new FileReader();
  fr.onerror=function(){ toast("That photo didn’t open. Try another one."); };
  fr.onload=function(){
    var img=new Image();
    img.onerror=function(){ toast("That photo didn’t open. Try a JPG or PNG."); };
    img.onload=function(){
      try{
        var M=1300, w=img.naturalWidth||img.width, h=img.naturalHeight||img.height, k=Math.min(1,M/Math.max(w,h));
        var c=document.createElement("canvas"); c.width=Math.max(1,Math.round(w*k)); c.height=Math.max(1,Math.round(h*k));
        var x=c.getContext("2d"); x.fillStyle="#fff"; x.fillRect(0,0,c.width,c.height); x.drawImage(img,0,0,c.width,c.height);
        setP(path,c.toDataURL("image/jpeg",.72)); save(); sfx("pop"); refresh();
      }catch(err){ toast("That photo didn’t open. Try another one."); }
    };
    img.src=fr.result;
  };
  fr.readAsDataURL(file);
}

  H.push('<section><h2>4. Judge it</h2><ol>'+m.olds.map(function(f){ return '<li>'+e(f.t)+(f.r?' &nbsp; '+face[f.r]:'')+
    (has(f.why)?'<br><em>Why: '+e(f.why)+'</em>':'')+(f.nec?'<br><em>'+(f.nec==="inh"?"Inherited":"Necessary")+'</em>':'')+'</li>'; }).join("")+'</ol></section>');
  H.push('<section><h2>5. Reimagine it</h2>'+(S.story?'<p class="meta">'+T("We said our","I said my")+' workflow is more '+(S.story==="tesla"?"Tesla: something should disappear.":"MLB: something new should be added.")+'</p>':'')+
    (cc.list.length?'<ul>'+cc.list.map(function(c){ return '<li>'+e(c.t)+'</li>'; }).join("")+'</ul>':'')+
    '<p><strong>The reimagined workflow</strong> ('+plural(m.nCut,"step","steps")+' gone, '+m.nNew+' new):</p>'+(okPhoto(S.photoNew)?'<img src="'+S.photoNew+'" alt="">':'')+'<ol>'+m.news.map(function(f){ return '<li>'+e(f.t)+'</li>'; }).join("")+'</ol></section>');
  H.push('<section><h2>6. Share it</h2>'+askNames().map(function(nm,i){ return '<p><strong>'+(i+1)+'. '+(has(nm)?e(nm):"________________")+'</strong></p><p>What do you like?</p><div class="blank"></div><p>What do you wish?</p><div class="blank"></div><p>What do you wonder?</p><div class="blank"></div>'; }).join("")+
    line("First test",S.test)+(has(S.owner)?line("Owner",S.owner):'')+(has(S.when)?line("By when",S.when):'')+'</section>');
  H.push('<p style="margin-top:18px"><strong>Take it further:</strong> ExperiencePoint’s AI workshops build on what you made today. experiencepoint.com/ai-training</p>');
  H.push('<p class="meta" style="margin-top:20px">ExperiencePoint&reg; Reimagination Lab. This is a proprietary ExperiencePoint tool. Please don’t copy or redistribute it. Copyright &copy; ExperiencePoint Inc. 2026, all rights reserved.</p>');
  $("#printout").innerHTML=H.join("");
  setTimeout(function(){ try{ window.print(); }catch(x){ toast("Printing isn’t available here. Try opening the file in a browser."); } },80);
}
/* the people to ask, as three headings for the printout: a list split at its commas, and at a last "and" */
function askNames(){
  var n=str(S.ask).split(/[,;]/).map(function(x){ return x.trim(); }).filter(has);
  if(n.length>=2&&/\sand\s/i.test(n[n.length-1])){ var last=n.pop(), cut=last.search(/\sand\s(?!.*\sand\s)/i); n.push(last.slice(0,cut).trim(), last.slice(cut).replace(/^\s*and\s+/i,"").trim()); }
  n=n.filter(has).slice(0,3); while(n.length<3) n.push(""); return n;
}
function fontsReady(){
  return new Promise(function(res){
    if(!(document.fonts&&document.fonts.load)) return res();
    var t=setTimeout(res,1800);
    Promise.all(['600 60px "Caveat"','600 40px "Fraunces"','500 30px "Fraunces"','600 20px "Inter"','500 18px "Inter"'].map(function(f){ return document.fonts.load(f).catch(function(){}); }))
      .then(function(){ clearTimeout(t); res(); });
  });
}
function doPng(){
  fontsReady().then(function(){ try{ drawCard(); }catch(err){ toast("Couldn’t make the image here. Try Print instead."); } });
}
function emailBody(){
  var m=matchSets(), ci=cardChanges(), keep=ci.list.slice(0,6), L=[];
  L.push(T("Here’s what we worked out","Here’s what I worked out")+" in the Reimagination Lab on "+dateStr()+".");
  L.push("");
  L.push("The workflow: "+(has(S.eyeroll)?S.eyeroll:"not named yet"));
  if(has(S.purpose)) L.push("Real purpose: "+S.purpose);
  if(m.olds.length||m.news.length) L.push("Today it takes "+plural(m.olds.length,"step","steps")+". Reimagined, it takes "+plural(m.news.length,"step","steps")+": "+m.nCut+" cut, "+m.nCh+" changed and "+m.nNew+" new.");
  if(m.news.length){ L.push(""); L.push("The reimagined workflow:"); m.news.forEach(function(f,i){ L.push((i+1)+". "+f.t); }); }
  if(keep.length){ L.push(""); L.push(ci.label+":"); keep.forEach(function(k){ L.push("- "+k.t); }); }
  if(has(S.test)){ L.push(""); L.push("First test: "+S.test+([S.owner,S.when].filter(has).length?" ("+[S.owner?("owner "+S.owner):"",S.when?("by "+S.when):""].filter(has).join(", ")+")":"")); }
  if(has(S.ask)){ L.push(""); L.push("Who "+T("we’ll","I’ll")+" ask: "+S.ask); }
  L.push(""); L.push("The card is attached.");
  L.push(""); L.push("Take it further: ExperiencePoint’s AI workshops build on what "+T("we","I")+" made today. "+LINKS.ai);

function doEmail(){
  if(!hasMail()){ toast("Email isn’t available here. Try Save as image."); return; }
  var night=document.body.classList.contains("is-night");
  window.EPKit.email({
    subject:T("Our","My")+" reimagined workflow"+(has(S.eyeroll)?": "+str(S.eyeroll).replace(/\s+/g," ").trim().slice(0,70):""),
    body:emailBody(),
    files:function(){ return fontsReady().then(function(){ return new Promise(function(res,rej){ try{ cardCanvas().toBlob(function(b){ b?res([{name:"reimagination-lab.png",blob:b}]):rej(new Error("png")); },"image/png"); }catch(e){ rej(e); } }); }); },
    theme:night?"dark":(document.documentElement.getAttribute("data-theme")||"auto"),
    accent:night?"#FFCC00":"#22304A", accentInk:night?"#141C2C":"#FFFFFF"
  });
}
function drawCard(){
  var out=cardCanvas(), url=out.toDataURL("image/png"), a=document.createElement("a"); a.download="reimagination-lab.png"; a.href=url; document.body.appendChild(a); a.click(); a.remove();
  sfx("little"); toast("Card saved as an image.");
}
function cardCanvas(){
  var W=1200, c=document.createElement("canvas"), x=c.getContext("2d"); c.width=W; c.height=3200;
  var m=matchSets(), ci=cardChanges(), keep=ci.list.slice(0,4), PAD=72, y=0;
  /* words wrapped to a width; text that runs past the last allowed line ends with an ellipsis */
  var wrap=function(t,X,Y,maxW,lh,font,color,maxLines){
    x.font=font; x.fillStyle=color; var paras=str(t).split(/\n/), lines=0;
    var cut=function(s){ while(s.length>1&&x.measureText(s+"…").width>maxW) s=s.slice(0,-1); return s.replace(/[\s,;:.]+$/,"")+"…"; };
    for(var p=0;p<paras.length;p++){
      var ws=paras[p].split(/\s+/), ln="";
      for(var i=0;i<ws.length;i++){
        var test=ln?ln+" "+ws[i]:ws[i];
        if(x.measureText(test).width>maxW&&ln){
          if(maxLines&&lines>=maxLines-1){ x.fillText(cut(ln),X,Y); return Y+lh; }
          x.fillText(ln,X,Y); Y+=lh; ln=ws[i]; lines++;
        } else ln=test;
      }
      if(ln){
        if(maxLines&&lines>=maxLines-1&&p<paras.length-1){ x.fillText(cut(ln),X,Y); return Y+lh; }
        x.fillText(ln,X,Y); Y+=lh; lines++; if(maxLines&&lines>=maxLines) return Y;
      }
    }
    return Y;
  };
  var measure=function(t,maxW,font,maxLines){ x.font=font; var ws=str(t).split(/\s+/), ln="", n=1; for(var i=0;i<ws.length;i++){ var test=ln?ln+" "+ws[i]:ws[i]; if(x.measureText(test).width>maxW&&ln){ n++; ln=ws[i]; } else ln=test; } return Math.min(n,maxLines||99); };
  var title=has(S.eyeroll)?S.eyeroll:T("Our workflow","My workflow");
  /* header */
  var titleLines=measure(title,W-PAD*2,'600 64px "Caveat", "Segoe Print", cursive',4);
  var HH=170+titleLines*70+40;
  var g=x.createRadialGradient(0,0,10,0,0,900); g.addColorStop(0,"#2C3C62"); g.addColorStop(1,"#16213A");
  x.fillStyle="#16213A"; x.fillRect(0,0,W,HH); x.fillStyle=g; x.fillRect(0,0,W,HH);
  x.font='600 18px "Inter", sans-serif'; x.fillStyle="#A8B2C7"; x.fillText("ExperiencePoint®",PAD,78);
  x.font='600 34px "Fraunces", Georgia, serif'; x.fillStyle="#F2F4F8";
  var wx=PAD, wy=128; x.fillText("Re",wx,wy); var w1=x.measureText("Re").width; x.fillText("ı",wx+w1,wy); var wi=x.measureText("ı").width; x.fillText("magination Lab",wx+w1+wi,wy);
  x.fillStyle="#FFCC00"; x.beginPath(); x.arc(wx+w1+wi/2,wy-25,4.6,0,Math.PI*2); x.fill();
  x.font='500 18px "Inter", sans-serif'; x.fillStyle="#A8B2C7"; var ds=dateStr(); x.fillText(ds,W-PAD-x.measureText(ds).width,78);
  y=wrap(title,PAD,212,W-PAD*2,70,'600 64px "Caveat", "Segoe Print", cursive',"#F2F4F8",4);
  /* body */
  var BY=HH; x.fillStyle="#FFFFFF"; x.fillRect(0,BY,W,c.height-BY); y=BY+70;
  var label=function(t){ x.font='600 19px "Inter", sans-serif'; x.fillStyle="#586A90"; x.fillText(t,PAD,y); y+=40; };
  var val=function(t){ y=wrap(has(t)?t:"Not filled in",PAD,y,W-PAD*2,42,(has(t)?'500':'italic 400')+' 30px "Fraunces", Georgia, serif',has(t)?"#293851":"#8A94AA",5); y+=26; };
  var frames=function(list,marks,cutMarks,chMarks){
    if(!list.length){ val(""); return; }
    var fw=170, fh=104, gap=12, perRow=Math.floor((W-PAD*2+gap)/(fw+gap)), X=PAD;
    list.forEach(function(f,i){
      if(i&&i%perRow===0){ X=PAD; y+=fh+gap; }
      x.fillStyle="#0B1120"; roundRect(x,X,y-28,fw,fh,6); x.fill();
      x.fillStyle=(cutMarks&&cutMarks[f.id])?"#D3D8E1":"#E9EDF4"; roundRect(x,X+7,y-21,fw-14,fh-14,4); x.fill();
      x.font='600 15px "Fraunces", serif'; x.fillStyle="#5E6A84"; x.fillText(String(i+1),X+18,y);
      wrap(f.t,X+18,y+24,fw-40,20,'600 16px "Inter", sans-serif',(cutMarks&&cutMarks[f.id])?"#4A5570":"#1A2234",3);
      if(cutMarks&&cutMarks[f.id]){ x.strokeStyle="#D86527"; x.lineWidth=4; x.lineCap="round"; x.beginPath(); x.moveTo(X+16,y+44); x.lineTo(X+fw-16,y+8); x.stroke(); }
      if(marks&&marks[f.id]){ x.fillStyle="#FFCC00"; x.beginPath(); x.arc(X+fw-22,y-8,8,0,Math.PI*2); x.fill(); }
      else if(chMarks&&chMarks[f.id]){ x.strokeStyle="#3E8E8C"; x.lineWidth=3; x.beginPath(); x.arc(X+fw-22,y-8,7,0,Math.PI*2); x.stroke(); }
      X+=fw+gap;
    });
    y+=fh+30;
  };
  label("Real purpose"); val(S.purpose);
  label("Today"+(m.olds.length?", "+plural(m.olds.length,"step","steps"):"")); frames(m.olds,null,m.cut);
  label("Reimagined"+(m.news.length?", "+plural(m.news.length,"step","steps"):"")); frames(m.news,m.nw,null,m.ch);
  label(ci.label);
  if(keep.length){ keep.forEach(function(k){ var y0=y; x.fillStyle="#FFCC00"; x.beginPath(); x.arc(PAD+8,y0-11,6,0,Math.PI*2); x.fill(); y=wrap(k.t,PAD+28,y0,W-PAD*2-28,40,'600 34px "Caveat", cursive',"#293851",2)+4; }); y+=20; }
  else val("");
  label("First test"); val(has(S.test)?S.test+([S.owner,S.when].filter(has).length?" ("+[S.owner,S.when].filter(has).join(", ")+")":""):"");
  /* footer */
  y+=10; x.fillStyle="rgba(41,56,81,.12)"; x.fillRect(PAD,y,W-PAD*2,2); y+=48;
  for(var cI=1;cI<=6;cI++){ x.beginPath(); x.arc(PAD+10+(cI-1)*32,y-6,10,0,Math.PI*2); if(has(railVal(cI))){ x.fillStyle="#FFCC00"; x.fill(); } else { x.strokeStyle="rgba(41,56,81,.3)"; x.lineWidth=2.5; x.stroke(); } }
  x.font='500 17px "Inter", sans-serif'; x.fillStyle="#586A90"; var cp="© ExperiencePoint Inc. 2026"; x.fillText(cp,W-PAD-x.measureText(cp).width,y);
  var H=Math.min(c.height,y+56);
  var out=document.createElement("canvas"); out.width=W; out.height=H; out.getContext("2d").drawImage(c,0,0);
  return out;
}
function roundRect(x,X,Y,w,h,r){ x.beginPath(); x.moveTo(X+r,Y); x.lineTo(X+w-r,Y); x.quadraticCurveTo(X+w,Y,X+w,Y+r); x.lineTo(X+w,Y+h-r); x.quadraticCurveTo(X+w,Y+h,X+w-r,Y+h); x.lineTo(X+r,Y+h); x.quadraticCurveTo(X,Y+h,X,Y+h-r); x.lineTo(X,Y+r); x.quadraticCurveTo(X,Y,X+r,Y); x.closePath(); }

   GO
   ========================================================= */
applyTheme(); buildRail(); fixAt(); syncPurpose(); render(0);

})();
