{id:"stories", ch:5, night:true, center:true, cls:"storycard",
  pre:function(){ return '<div class="twin" aria-hidden="true"><div style="background-image:var(--poster-tesla)"></div><div style="background-image:var(--poster-mlb)"></div></div>'; },
  html:function(){ return '<h1 class="hero">Two stories with opposite endings.</h1><p class="lede">One took something away. One added something new.</p>'; }
},
{id:"tesla", ch:5, night:true, center:true, cls:"filmscreen",
  html:function(){
    return '<h2 class="ask">Sometimes the best automation is subtraction.</h2><div class="filmwrap" data-film="tesla"></div>'+
      more("Read the story","<p>During the Model 3 ramp, Tesla pushed hard to automate manufacturing. One bottleneck involved fiberglass mats glued on top of the battery pack. Tesla built an elaborate vision-guided robot to place the soft material, and robots are terrible at handling fluff.</p><p>Eventually leadership asked a different question: <strong>what are these mats actually for?</strong> The noise-and-vibration team believed they were for fire safety. The battery-safety team believed they reduced noise. Tesla tested two cars, one with mats and one without, and found no discernible difference.</p><p>Delete the mats. Delete the process. Delete the robot. Tesla later said this let them bypass roughly $2 million of robotics while removing a bottleneck.</p><p><strong>Before asking how to automate something, ask why you’re doing it at all.</strong></p>");
  },
  notes:["Press play and let it run, about 40 seconds. Don’t narrate over it.","Virtual: check people can hear it. Share sound needs to be on."]
},
{id:"mlb", ch:5, night:true, center:true, cls:"filmscreen",
  html:function(){
    return '<h2 class="ask">Sometimes the best use of technology is addition.</h2><div class="filmwrap" data-film="mlb"></div>'+
      more("Read the story","<p>MLB tested fully automated ball-and-strike calls in the minor leagues. Greater accuracy didn’t necessarily make for a better game. So MLB asked a different question: <strong>what could technology add to the umpire’s call?</strong></p><p>The ABS Challenge System keeps the umpire’s call. A batter, pitcher or catcher can tap their cap to challenge it, and within about 15 seconds a graphic shows whether the pitch clipped the zone. Teams get only two unsuccessful challenges, so strategy matters too.</p><p>In a 2023 survey, 60% of Triple-A players and coaches preferred the challenge format, against 16% for fully automated calls. MLB adopted it for the 2026 season.</p><p><strong>Ask what technology can make possible that wasn’t there before.</strong></p>");
  },
  notes:["Same again: play it and let it breathe.","Ask: which story sounds more like us?"]
},
{id:"poll", ch:5,
  html:function(){
    var v=S.votes.story||{}, L=v.tesla||0, R=v.mlb||0, tot=L+R, rev=team()&&!!S.revealed.story, pick=S.picks.story;
    var side=function(k,cls,name,desc){
      var n=v[k]||0, c='side '+cls;
      if(team()){ if(rev&&tot&&L!==R) c+= ((k==="tesla")===(L>R))?' win':' lose'; }
      else { c+=' pickable'; if(pick===k) c+=' sel'; }
      return '<div class="'+c+'" data-fid="'+k+'"'+(team()?'':' role="button" tabindex="0" data-act="spick" data-id="'+k+'" aria-pressed="'+(pick===k)+'"')+'>'+GLYPH[k]+'<h3>'+name+'</h3><p>'+desc+'</p>'+
        (team()&&!rev?'<div class="ctr"><button type="button" data-act="pminus" data-id="'+k+'" aria-label="Remove a vote for '+name+'">&minus;</button><span class="v">'+n+'</span><button type="button" data-act="pplus" data-id="'+k+'" aria-label="Add a vote for '+name+'">+</button></div>':'')+'</div>';
    };
    var h='<div class="single wide"><h2 class="ask">Is your workflow more Tesla or more MLB?</h2><p class="sub">'+T("One vote each. Go with your gut. Most flows need a bit of both.","Go with your gut. Most flows need a bit of both.")+'</p>'+
      '<div class="duo" data-vgroup="story">'+side("tesla","L","More Tesla","Something should disappear.")+side("mlb","R","More MLB","Something new should be added.")+'</div>';
    if(team()){
      if(rev){
        var lw=L>R?' win':(L<R?' lose':''), rw=R>L?' win':(R<L?' lose':'');
        h+='<div class="dv" aria-hidden="true"><div class="wing L'+lw+'"><i></i></div><div class="mid"></div><div class="wing R'+rw+'"><i></i></div></div>'+
          '<div class="dvn"><div class="n nl'+(L<R?' lose':'')+'">0%</div><div class="n nr'+(R<L?' lose':'')+'">0%</div></div>'+
          (L===R?'<p class="split-msg">Split down the middle. Most flows need a bit of both.</p>':'')+
          '<div class="vact"><button class="btn ghost sm" type="button" data-act="precount">Count again</button></div>';
      } else {
        h+='<div class="vact">'+(tot?'<button class="btn ghost sm" type="button" data-act="pclear">Clear votes</button>':'')+'<button class="btn" type="button" data-act="reveal" data-group="story">Reveal the split</button></div>';
      }
    }
    return h+promo("Two stories here. A room full of them in the workshop.","Finding AI Use Cases works through a much wider set of real examples, because the fastest way to see the move in your own workflow is to watch other people make it first.","Finding AI Use Cases")+'</div>';
  },
  mount:function(el){
    if(revealing==="story") return;
    if(team()&&S.revealed.story){ var v=S.votes.story||{}, L=v.tesla||0, R=v.mlb||0, tot=L+R, pl=tot?Math.round(100*L/tot):0;
      var wl=$(".dv .wing.L i",el), wr=$(".dv .wing.R i",el); if(wl) wl.style.width=pl+"%"; if(wr) wr.style.width=(tot?100-pl:0)+"%";

{id:"ideas", ch:5,

function mountDial(root){
  $$("[data-dial]",root).forEach(function(d){
    if(d._on) return; d._on=1;
    var id=d.getAttribute("data-dial"), ex=DIALS[id], r=$("input",d), blob=$(".dial-blob",d), exEl=$(".dial-ex",d), ends=$$(".dial-ends button",d), last=-1, fitDone=false;
    var zone=function(v){ return v<34?0:(v<67?1:2); };
    var scale=function(v){ if(v<34) return 1.6-(v/33)*.36; if(v<67) return 1; return .6-((v-67)/33)*.44; };
    var up=function(user){
      var v=+r.value, z=zone(v);
      blob.style.transform="scale("+scale(v).toFixed(3)+")";
      blob.style.fill=z===0?"var(--clayM)":(z===1?"var(--gold)":"var(--tealM)");
      d.classList.toggle("fit",z===1);
      ends.forEach(function(b,k){ b.classList.toggle("on",k===z); b.setAttribute("aria-pressed",k===z?"true":"false"); });
      r.setAttribute("aria-valuetext",["Too big","Just right","Too small"][z]+": "+ex[z]);
      if(z!==last){
        exEl.textContent=ex[z];
        if(user&&last!==-1){
          if(z===1){ sfx("snap"); d.classList.remove("snap"); void d.offsetWidth; d.classList.add("snap"); if(!fitDone){ fitDone=true; burstAt(blob,30,.55); } }
          else sfx("tick");
        }
        last=z;
      }
      if(user){ S.dial[id]=v; save(); }
    };
    r.addEventListener("input",function(){ up(true); });
    ends.forEach(function(b,k){ b.addEventListener("click",function(){ r.value=[8,50,92][k]; up(true); }); });
    up(false);

  var fid=firstOfCh(7); if(fid) h+='<button class="mch'+(s.ch===7?' on':'')+'" type="button" data-m="jump" data-id="'+fid+'"><i aria-hidden="true"></i><span>Finish</span></button>';
  var seg=function(m,v,l,on){ return '<button type="button" data-m="'+m+'" data-v="'+v+'" aria-pressed="'+on+'">'+l+'</button>'; };
  h+='<div class="mgroup"><p class="mlab">Who’s here</p><div class="seg">'+seg("who","team-room","Team, in one room",team()&&S.place==="room")+seg("who","team-virtual","Team, on a call",team()&&S.place==="virtual")+seg("who","solo","Just me",!team())+'</div>'+
    '<p class="mlab">Theme</p><div class="seg">'+seg("theme","auto","Match my device",S.theme==="auto")+seg("theme","light","Light",S.theme==="light")+seg("theme","dark","Dark",S.theme==="dark")+'</div></div>'+
    '<div class="mgroup"><button class="sw" type="button" data-m="sfx" aria-pressed="'+S.sfx+'"><span>Sound effects and chimes</span><i aria-hidden="true"></i></button>'+
    '<button class="sw" type="button" data-m="music" aria-pressed="'+S.music+'"><span>Calm music during quiet work and breaks</span><i aria-hidden="true"></i></button></div>'+
    '<div class="mgroup"><div class="macts"><button class="btn sec sm" type="button" data-m="print">Print my answers</button><button class="btn ghost sm" type="button" data-m="clear">Clear my answers</button></div>'+
    '<p class="mnote">Your answers stay in this browser. Nothing is sent anywhere. On a shared computer, clear them when you’re done.</p>'+
    '<p class="mnote">This is a proprietary ExperiencePoint tool. Please don’t copy or redistribute it.</p></div>';
  $("#mpanel").innerHTML=h;
  if(!menuOpen){ lastFocus=document.activeElement; }
  menuOpen=true; $("#menu").classList.add("open"); $("#menu").setAttribute("aria-hidden","false");
  setTimeout(function(){ var x=$('#mpanel [data-m="close"]'); if(x) try{ x.focus({preventScroll:true}); }catch(e){} },40);
}
function closeMenu(){ if(!menuOpen) return; menuOpen=false; $("#menu").classList.remove("open"); $("#menu").setAttribute("aria-hidden","true"); if(lastFocus&&lastFocus.focus&&document.body.contains(lastFocus)) try{ lastFocus.focus({preventScroll:true}); }catch(e){} }
$("#menuBtn").addEventListener("click",function(){ ac(); if(menuOpen) closeMenu(); else openMenu(); });
$("#menu").addEventListener("click",function(e){
  if(e.target.id==="menu"){ closeMenu(); return; }
  var b=e.target.closest("[data-m]"); if(!b) return; var m=b.getAttribute("data-m"), v=b.getAttribute("data-v");
  if(m==="close") closeMenu();
  else if(m==="jump") jumpTo(b.getAttribute("data-id"));
  else if(m==="who"){ S.mode=v==="solo"?"solo":"team"; if(v!=="solo") S.place=v==="team-room"?"room":"virtual"; fixAt(); save(); render(0); openMenu(); }
  else if(m==="theme"){ S.theme=v; save(); applyTheme(); openMenu(); }
  else if(m==="sfx"){ toggleSound(); openMenu(); }
  else if(m==="music"){ S.music=!S.music; if(!S.music) musicStop(); else if(TM&&TM.running&&(TM.kind==="think"||TM.kind==="break")) musicStart(); save(); openMenu(); }
  else if(m==="print"){ closeMenu(); doPrint(); }
  else if(m==="clear"){
    var snap=JSON.stringify(S), prefs={sfx:S.sfx,music:S.music,theme:S.theme};
    tKill(); S=fresh(); S.sfx=prefs.sfx; S.music=prefs.music; S.theme=prefs.theme; seen={}; celebrated={}; lsDel(OLDKEY); saveNow(); closeMenu(); render(-1);
    toast("Answers cleared.","Undo",function(){ lsSet(KEY,snap); S=load(); applyTheme(); render(0); },6000);
  }
});

/* trap focus inside the menu and the focus timer */
document.addEventListener("keydown",function(e){
  if(e.key!=="Tab") return;
  var box = menuOpen ? $("#mpanel") : (focusOpen ? $("#focus") : null); if(!box) return;
  var f=$$("button:not([hidden]),a[href],input,[tabindex='0']",box).filter(function(x){ return x.offsetParent!==null; }); if(!f.length) return;
  var first=f[0], last=f[f.length-1];
  if(e.shiftKey&&document.activeElement===first){ e.preventDefault(); last.focus(); }
  else if(!e.shiftKey&&document.activeElement===last){ e.preventDefault(); first.focus(); }
  else if(!box.contains(document.activeElement)){ e.preventDefault(); first.focus(); }
});

/* =========================================================
   PRINT AND IMAGE EXPORT
   ========================================================= */
function doPrint(){
  var e=esc, H=[], m=matchSets(), v=S.votes.ideas||{};
  var line=function(l,val){ return '<p><strong>'+l+':</strong> '+(has(val)?escBr(val):'<span class="meta">not filled in</span>')+'</p>'; };
  H.push('<h1>Reimagination Lab</h1><p class="meta">'+(team()?(S.place==="room"?"Team session, in one room":"Team session, on a call"):"Solo session")+'. '+e(dateStr())+'.</p>');
  H.push('<section><h2>1. Isn’t there a better way?</h2>'+line("Our eye-roller",S.eyeroll)+(S.cands.length>1?'<p class="meta">Also suggested: '+S.cands.map(function(c){ return e(c.t); }).join("; ")+'</p>':'')+'</section>');
  H.push('<section><h2>2. Why does this exist?</h2>'+S.ladder.filter(has).map(function(x,i){ return '<p>'+(i?"In order to ":"We do this in order to ")+e(x)+'</p>'; }).join("")+line("The real purpose",S.purpose)+'</section>');
  H.push('<section><h2>3. Draw it: the flow today</h2>'+line("Starts when",S.start)+line("Ends when",S.end)+line("Who’s in it",S.cast)+line("Where it happens",S.where)+
    (okPhoto(S.photoOld)?'<img src="'+S.photoOld+'" alt="">':'')+'<ol>'+m.olds.map(function(f){ return '<li>'+e(f.t)+'</li>'; }).join("")+'</ol></section>');
  H.push('<section><h2>4. Judge it</h2><ol>'+m.olds.map(function(f){ var r=[]; if(f.d) r.push("😍"+(team()?" "+f.d:"")); if(f.f) r.push("😤"+(team()?" "+f.f:"")); if(f.c) r.push("🤔"+(team()?" "+f.c:"")); return '<li>'+e(f.t)+(r.length?' &nbsp; '+r.join("  "):'')+(has(f.why)?'<br><em>Why: '+e(f.why)+'</em>':'')+'</li>'; }).join("")+'</ol></section>');
  H.push('<section><h2>5. Reimagine it</h2>'+MOVES.map(function(mv){ var l=S.ideas[mv.k]; return l.length?'<p><strong>'+mv.name+':</strong> '+l.map(function(i){ return e(i.t)+(v[i.id]?' ('+(team()?plural(v[i.id],"vote","votes"):"kept")+')':''); }).join("; ")+'</p>':''; }).join("")+
    '<p><strong>The reimagined flow</strong> ('+plural(m.nCut,"step","steps")+' gone, '+m.nNew+' new):</p>'+(okPhoto(S.photoNew)?'<img src="'+S.photoNew+'" alt="">':'')+'<ol>'+m.news.map(function(f){ return '<li>'+e(f.t)+'</li>'; }).join("")+'</ol></section>');
  H.push('<section><h2>6. Share it</h2>'+S.people.map(function(p,i){ return '<p><strong>'+(i+1)+'. '+(has(p.who)?e(p.who):"________________")+'</strong>'+(has(p.asker)?', asked by '+e(p.asker):'')+(has(p.when)?', by '+e(p.when):'')+'</p><p>I like…</p><div class="blank"></div><p>I wish…</p><div class="blank"></div><p>I wonder…</p><div class="blank"></div>'; }).join("")+
    line("First test",S.test)+(has(S.owner)?line("Owner",S.owner):'')+(has(S.when)?line("By when",S.when):'')+'</section>');
  H.push('<p class="meta" style="margin-top:20px">ExperiencePoint&reg; Reimagination Lab. This is a proprietary ExperiencePoint tool. Please don’t copy or redistribute it. Copyright &copy; ExperiencePoint Inc. 2026, all rights reserved.</p>');
  $("#printout").innerHTML=H.join("");
  setTimeout(function(){ try{ window.print(); }catch(x){ toast("Printing isn’t available here. Try opening the file in a browser."); } },80);
}
function fontsReady(){
  return new Promise(function(res){
    if(!(document.fonts&&document.fonts.load)) return res();
    var t=setTimeout(res,1800);
    Promise.all(['600 60px "Caveat"','600 40px "Fraunces"','500 30px "Fraunces"','600 20px "Inter"','500 18px "Inter"'].map(function(f){ return document.fonts.load(f).catch(function(){}); }))
      .then(function(){ clearTimeout(t); res(); });
  });
}
function doPng(){
  fontsReady().then(function(){ try{ drawCard(); }catch(err){ toast("Couldn’t make the image here. Try Print instead."); } });
}
function emailBody(){
  var m=matchSets(), keep=keptIdeas().slice(0,4), L=[], we=T("we","I");
  L.push(T("Here’s what we worked out","Here’s what I worked out")+" in the Reimagination Lab on "+dateStr()+".");
  L.push("");
  L.push("The workflow: "+(has(S.eyeroll)?S.eyeroll:"not named yet"));
  if(has(S.purpose)) L.push("Why it exists: "+S.purpose);
  if(m.olds.length||m.news.length) L.push("Today it takes "+plural(m.olds.length,"step","steps")+". Reimagined, it takes "+plural(m.news.length,"step","steps")+": "+m.nCut+" gone and "+m.nNew+" new.");
  if(m.news.length){ L.push(""); L.push("The reimagined flow:"); m.news.forEach(function(f,i){ L.push((i+1)+". "+f.t); }); }
  if(keep.length){ L.push(""); L.push("Ideas "+we+" kept:"); keep.forEach(function(k){ L.push("- "+k.t); }); }
  if(has(S.test)){ L.push(""); L.push("First test: "+S.test+([S.owner,S.when].filter(has).length?" ("+[S.owner?("owner "+S.owner):"",S.when?("by "+S.when):""].filter(has).join(", ")+")":"")); }
  L.push(""); L.push("The card is attached.");
  return L.join("\n");
}
function doEmail(){
  if(!hasMail()){ toast("Email isn’t available here. Try Save as image."); return; }
  var night=document.body.classList.contains("is-night");
  window.EPKit.email({
    subject:T("Our","My")+" reimagined workflow"+(has(S.eyeroll)?": "+str(S.eyeroll).replace(/\s+/g," ").trim().slice(0,70):""),
    body:emailBody(),
    files:function(){ return fontsReady().then(function(){ return new Promise(function(res,rej){ try{ cardCanvas().toBlob(function(b){ b?res([{name:"reimagination-lab.png",blob:b}]):rej(new Error("png")); },"image/png"); }catch(e){ rej(e); } }); }); },
    theme:night?"dark":(document.documentElement.getAttribute("data-theme")||"auto"),
    accent:night?"#FFCC00":"#22304A", accentInk:night?"#141C2C":"#FFFFFF"
  });
}
function drawCard(){
  var out=cardCanvas(), url=out.toDataURL("image/png"), a=document.createElement("a"); a.download="reimagination-lab.png"; a.href=url; document.body.appendChild(a); a.click(); a.remove();
  sfx("little"); toast("Card saved as an image.");
}
function cardCanvas(){
  var W=1200, c=document.createElement("canvas"), x=c.getContext("2d"); c.width=W; c.height=3200;
  var m=matchSets(), keep=keptIdeas().slice(0,4), PAD=72, y=0;
  var wrap=function(t,X,Y,maxW,lh,font,color,maxLines){
    x.font=font; x.fillStyle=color; var paras=str(t).split(/\n/), lines=0;
    for(var p=0;p<paras.length;p++){
      var ws=paras[p].split(/\s+/), ln="";
      for(var i=0;i<ws.length;i++){ var test=ln?ln+" "+ws[i]:ws[i]; if(x.measureText(test).width>maxW&&ln){ x.fillText(ln,X,Y); Y+=lh; ln=ws[i]; lines++; if(maxLines&&lines>=maxLines){ return Y; } } else ln=test; }
      if(ln){ x.fillText(ln,X,Y); Y+=lh; lines++; if(maxLines&&lines>=maxLines) return Y; }
    }
    return Y;
  };
  var measure=function(t,maxW,font,maxLines){ x.font=font; var ws=str(t).split(/\s+/), ln="", n=1; for(var i=0;i<ws.length;i++){ var test=ln?ln+" "+ws[i]:ws[i]; if(x.measureText(test).width>maxW&&ln){ n++; ln=ws[i]; } else ln=test; } return Math.min(n,maxLines||99); };
  /* header */
  var titleLines=measure(has(S.eyeroll)?S.eyeroll:"Our workflow",W-PAD*2,'600 64px "Caveat", "Segoe Print", cursive',4);
  var HH=170+titleLines*70+40;
  var g=x.createRadialGradient(0,0,10,0,0,900); g.addColorStop(0,"#2C3C62"); g.addColorStop(1,"#16213A");
  x.fillStyle="#16213A"; x.fillRect(0,0,W,HH); x.fillStyle=g; x.fillRect(0,0,W,HH);
  x.font='600 18px "Inter", sans-serif'; x.fillStyle="#A8B2C7"; x.fillText("ExperiencePoint®",PAD,78);
  x.font='600 34px "Fraunces", Georgia, serif'; x.fillStyle="#F2F4F8";
  var wx=PAD, wy=128; x.fillText("Re",wx,wy); var w1=x.measureText("Re").width; x.fillText("ı",wx+w1,wy); var wi=x.measureText("ı").width; x.fillText("magination Lab",wx+w1+wi,wy);
  x.fillStyle="#FFCC00"; x.beginPath(); x.arc(wx+w1+wi/2,wy-25,4.6,0,Math.PI*2); x.fill();
  x.font='500 18px "Inter", sans-serif'; x.fillStyle="#A8B2C7"; var ds=dateStr(); x.fillText(ds,W-PAD-x.measureText(ds).width,78);
  y=wrap(has(S.eyeroll)?S.eyeroll:"Our workflow",PAD,212,W-PAD*2,70,'600 64px "Caveat", "Segoe Print", cursive',"#F2F4F8",4);
  /* body */
  var BY=HH; x.fillStyle="#FFFFFF"; x.fillRect(0,BY,W,c.height-BY); y=BY+70;
  var label=function(t){ x.font='600 19px "Inter", sans-serif'; x.fillStyle="#586A90"; x.fillText(t,PAD,y); y+=40; };
  var val=function(t){ y=wrap(has(t)?t:"Not filled in",PAD,y,W-PAD*2,42,(has(t)?'500':'italic 400')+' 30px "Fraunces", Georgia, serif',has(t)?"#293851":"#8A94AA",5); y+=26; };
  var frames=function(list,marks,cutMarks){
    if(!list.length){ val(""); return; }
    var fw=170, fh=104, gap=12, perRow=Math.floor((W-PAD*2+gap)/(fw+gap)), X=PAD;
    list.forEach(function(f,i){
      if(i&&i%perRow===0){ X=PAD; y+=fh+gap; }
      x.fillStyle="#0B1120"; roundRect(x,X,y-28,fw,fh,6); x.fill();
      x.fillStyle=(cutMarks&&cutMarks[f.id])?"#C9CED8":"#E9EDF4"; roundRect(x,X+7,y-21,fw-14,fh-14,4); x.fill();
      x.font='600 15px "Fraunces", serif'; x.fillStyle="#7D89A3"; x.fillText(String(i+1),X+18,y);
      wrap(f.t,X+18,y+24,fw-40,20,'600 16px "Inter", sans-serif',(cutMarks&&cutMarks[f.id])?"#8A94AA":"#1A2234",3);
      if(cutMarks&&cutMarks[f.id]){ x.strokeStyle="#D86527"; x.lineWidth=4; x.lineCap="round"; x.beginPath(); x.moveTo(X+16,y+44); x.lineTo(X+fw-16,y+8); x.stroke(); }
      if(marks&&marks[f.id]){ x.fillStyle="#FFCC00"; x.beginPath(); x.arc(X+fw-22,y-8,8,0,Math.PI*2); x.fill(); }
      X+=fw+gap;
    });
    y+=fh+30;
  };
  label("Why it exists"); val(S.purpose);
  label("Today"+(m.olds.length?", "+plural(m.olds.length,"step","steps"):"")); frames(m.olds,null,m.cut);
  label("Reimagined"+(m.news.length?", "+plural(m.news.length,"step","steps"):"")); frames(m.news,m.nw,null);
  label("Ideas we kept");
  if(keep.length){ keep.forEach(function(k){ var y0=y; x.fillStyle="#FFCC00"; x.beginPath(); x.arc(PAD+8,y0-11,6,0,Math.PI*2); x.fill(); y=wrap(k.t,PAD+28,y0,W-PAD*2-28,40,'600 34px "Caveat", cursive',"#293851",2)+4; }); y+=20; }
  else val("");
  label("First test"); val(has(S.test)?S.test+([S.owner,S.when].filter(has).length?" ("+[S.owner,S.when].filter(has).join(", ")+")":""):"");
  /* footer */
  y+=10; x.fillStyle="rgba(41,56,81,.12)"; x.fillRect(PAD,y,W-PAD*2,2); y+=48;
  for(var cI=1;cI<=6;cI++){ x.beginPath(); x.arc(PAD+10+(cI-1)*32,y-6,10,0,Math.PI*2); if(S.done[cI]){ x.fillStyle="#FFCC00"; x.fill(); } else { x.strokeStyle="rgba(41,56,81,.3)"; x.lineWidth=2.5; x.stroke(); } }
  x.font='500 17px "Inter", sans-serif'; x.fillStyle="#586A90"; var cp="© ExperiencePoint Inc. 2026"; x.fillText(cp,W-PAD-x.measureText(cp).width,y);
  var H=Math.min(c.height,y+56);
  var out=document.createElement("canvas"); out.width=W; out.height=H; out.getContext("2d").drawImage(c,0,0);
  return out;
}
function roundRect(x,X,Y,w,h,r){ x.beginPath(); x.moveTo(X+r,Y); x.lineTo(X+w-r,Y); x.quadraticCurveTo(X+w,Y,X+w,Y+r); x.lineTo(X+w,Y+h-r); x.quadraticCurveTo(X+w,Y+h,X+w-r,Y+h); x.lineTo(X+r,Y+h); x.quadraticCurveTo(X,Y+h,X,Y+h-r); x.lineTo(X,Y+r); x.quadraticCurveTo(X,Y,X+r,Y); x.closePath(); }

/* =========================================================
   GO
   ========================================================= */
applyTheme(); buildDots(); fixAt(); render(0);
})();
