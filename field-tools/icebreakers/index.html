<!DOCTYPE html>
<html lang="en" data-theme="show">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#293851">
<title>Play</title>
<!-- Icebox: party games to kick off a meeting.
     One file. The stage, the controllers, the practice room and every game are all here.
     To add a pack of games, a theme or a seasonal edition, search this file for "HOW TO ADD". -->
<link rel="icon" type="image/svg+xml" href="/pt/assets/favicon/favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="/pt/assets/favicon/favicon-32.png">
<link rel="shortcut icon" href="/pt/assets/favicon/favicon.ico">
<link rel="apple-touch-icon" sizes="180x180" href="/pt/assets/favicon/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Two font requests on purpose. The first asks for plain weights and always works. The second asks
     for the faces that stretch and wobble (Big Type's width, Sketchbook's bounce); if a browser or a
     network refuses it, the page still has every face it needs. -->
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800;900&family=Caprasimo&family=Schibsted+Grotesk:wght@500;600;700;800&family=Shantell+Sans:wght@600;700;800&family=Anybody:wght@500;600;800;900&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Shantell+Sans:wght,BNCE,INFM@300..800,-100..100,0..100&family=Anybody:wdth,wght@50..150,100..900&display=swap" rel="stylesheet">
<script src="/pt/assets/kit/feedback.js" defer></script>
<style>
/* ==========================================================================
   LAYOUT AND PARTS. Nothing here has a look of its own: every colour, face,
   corner and shadow comes from the theme tokens further down.
   The stage is sized in em, and one em is about a hundredth of the stage's width,
   so a scene composes the same on a projector, a laptop and a shared window.
   ========================================================================== */
*{box-sizing:border-box;margin:0;padding:0}
html{height:100%;-webkit-text-size-adjust:100%}
body{min-height:100%;font-family:var(--font-b);font-weight:var(--b-w);color:var(--ink);background:var(--bg);line-height:1.35;overflow-x:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:disabled{cursor:default}
input,textarea{font:inherit;color:inherit}
ol,ul{list-style:none}
:focus-visible{outline:3px solid var(--focus);outline-offset:3px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);clip-path:inset(50%);white-space:nowrap}
.view{display:none}
.view.on{display:block}
svg.ic{width:1.25em;height:1.25em;display:block;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* ---------- buttons: one filled button per screen, the rest outlined or plain ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5em;min-height:48px;padding:0 1.5em;border-radius:var(--r-btn);background:var(--btn);color:var(--btn-ink);font-family:var(--font-b);font-weight:800;font-size:16px;letter-spacing:.01em;white-space:nowrap;border:var(--btn-bd);box-shadow:var(--btn-sh);transition:transform .12s,box-shadow .12s,filter .12s}
.btn:hover{filter:brightness(1.04)}
.btn:active{transform:translateY(2px);box-shadow:none}
.btn:disabled{opacity:.4;filter:none;transform:none}
.btn.sec{background:var(--paper);color:var(--paper-ink);border:var(--sec-bd);box-shadow:none}
.btn.ghost{background:transparent;color:inherit;border:0;box-shadow:none;padding:0 .8em;font-weight:700;opacity:.82}
.btn.ghost:hover{opacity:1}
.btn.sm{min-height:40px;font-size:14px;padding:0 1.1em}
.btn.full{width:100%}

/* ---------- characters: ten shapes, eight colours, two eyes ---------- */
.av{display:block;width:100%;height:100%;overflow:visible}
.av .body{fill:var(--pc);stroke:var(--pc);stroke-width:8;stroke-linejoin:round}
.av .eye{fill:#fff}
.av .pup{fill:#1c2538}
.av .mouth{fill:none;stroke:#1c2538;stroke-width:4;stroke-linecap:round}
.av .lid{transform-box:fill-box;transform-origin:center;animation:blink 5.2s infinite}
.c0{--pc:var(--p0)}.c1{--pc:var(--p1)}.c2{--pc:var(--p2)}.c3{--pc:var(--p3)}.c4{--pc:var(--p4)}.c5{--pc:var(--p5)}.c6{--pc:var(--p6)}.c7{--pc:var(--p7)}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}96.5%{transform:scaleY(.08)}}

/* ---------- the stage ---------- */
#stageWrap{position:fixed;inset:0;flex-direction:column;background:var(--bg)}
#stageWrap.on{display:flex}
#stageWrap.drive{flex-direction:row}
.stagecol{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;min-height:0}
.stage{position:relative;flex:1 1 auto;min-height:0;overflow:hidden;container-type:size;background:var(--field,var(--bg));color:var(--ink);transition:background-color .35s}
.sc{position:absolute;inset:0;font-size:min(1.04vw,1.74vh);font-size:min(1.04cqw,1.85cqh);display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) auto;padding:3.4em 4.4em 2.2em;gap:1.2em;z-index:2}
.bg{position:absolute;inset:0;overflow:hidden;z-index:1;pointer-events:none;font-size:min(1.04vw,1.74vh);font-size:min(1.04cqw,1.85cqh)}
.fx{position:absolute;inset:0;width:100%;height:100%;z-index:6;pointer-events:none}
.top{display:flex;align-items:flex-start;justify-content:space-between;gap:2em;min-height:6.2em}
.ctx{display:flex;align-items:center;gap:1em;font-family:var(--font-d);font-weight:var(--d-w);font-size:1.5em;letter-spacing:var(--d-ls);color:var(--ink-2)}
.pips{display:flex;gap:.4em}
.pips i{width:.62em;height:.62em;border-radius:50%;border:.12em solid currentColor;opacity:.55}
.pips i.on{background:currentColor;opacity:1}
.mid{min-height:0;display:flex;flex-direction:column;align-items:var(--ax,center);justify-content:center;text-align:var(--tx,center);gap:1.6em}
.mid>*{flex-shrink:0}
.say{position:absolute;left:0;right:0;bottom:3.4%;z-index:5;text-align:center;font-family:var(--font-d);font-weight:var(--d-w);font-size:min(3.5vw,6vh);font-size:min(3.5cqw,6.2cqh);line-height:1.02;letter-spacing:var(--d-ls);pointer-events:none;opacity:0;padding:0 6%}
.say span{display:inline-block}
.say.on{opacity:1;animation:say 2.6s var(--ease) both}
@keyframes say{0%{opacity:0;transform:translateY(.4em) scale(.96)}10%,78%{opacity:1;transform:none}100%{opacity:0;transform:translateY(-.2em)}}

h1,h2,h3{font-family:var(--font-d);font-weight:var(--d-w);letter-spacing:var(--d-ls);line-height:var(--d-lh);text-transform:var(--d-tt);text-wrap:balance}
.big{font-size:6.4em;max-width:13em;overflow-wrap:anywhere}
.big.long{font-size:4.9em;max-width:17em}
.big.xl{font-size:8.4em}
.lead{font-family:var(--font-d);font-weight:var(--d-w);font-size:2.6em;letter-spacing:var(--d-ls);color:var(--ink-2);text-transform:var(--d-tt)}
.sub{font-size:2.2em;font-weight:600;color:var(--ink-2);max-width:30em;text-wrap:balance}
.ask{font-size:3.9em;max-width:22em}
.q{font-size:1.8em;font-weight:600;color:var(--ink-2);max-width:36em;overflow-wrap:anywhere;text-wrap:balance}

/* the clock: a number every theme shows, plus bulbs, a ring and a bar that each theme may use */
.clock{position:relative;flex:0 0 auto;width:6.2em;height:6.2em;display:grid;place-items:center}
.clock b{font-family:var(--font-d);font-weight:var(--d-w);font-size:2.9em;line-height:1;font-variant-numeric:tabular-nums}
.clock .ring{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg);display:none}
.clock .ring circle{fill:none;stroke-width:7}
.clock .bulbs{position:absolute;inset:0;display:none}
.clock .bulbs i{position:absolute;left:50%;top:50%;width:.62em;height:.62em;margin:-.31em;border-radius:50%;transform:rotate(calc(var(--i)*15deg)) translateY(-2.85em)}
.clock.low b{animation:tickpulse 1s infinite}
.clock.paused b{opacity:.45}
.clock.off{visibility:hidden}
.clockbar{position:absolute;left:0;top:0;height:.7em;width:100%;transform-origin:left;display:none;z-index:3}
@keyframes tickpulse{0%{transform:scale(1.18)}35%{transform:scale(1)}100%{transform:scale(1)}}

/* the crowd along the bottom of the stage */
.crowd{display:flex;flex-wrap:wrap;justify-content:center;align-items:flex-end;gap:.5em 1.2em;min-height:8.2em;--sz:5.8em}
.crowd.n20{--sz:4.1em;gap:.3em .7em}
.crowd.n32{--sz:3.1em;gap:.2em .45em}
.crowd.n48{--sz:2.5em;gap:.15em .3em}
.who{position:relative;width:var(--sz);display:flex;flex-direction:column;align-items:center;gap:.3em;transition:transform .35s var(--pop),opacity .3s,filter .3s}
.who .face{width:var(--sz);height:var(--sz);display:block}
.who .nm{max-width:calc(var(--sz) + 1.6em);font-size:1.02em;font-weight:700;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crowd.n32 .nm,.crowd.n48 .nm{display:none}
.who.wait{opacity:.5;filter:saturate(.35)}
.who.in{transform:translateY(-.5em)}
.who.away{opacity:.28}
.who.hop .face{animation:hop .55s var(--pop)}
.who.new .face{animation:arrive .7s var(--pop) both}
@keyframes hop{0%{transform:none}35%{transform:translateY(-1.5em) rotate(-8deg) scale(1.08)}70%{transform:translateY(0) rotate(4deg)}100%{transform:none}}
@keyframes arrive{0%{transform:translateY(4em) scale(.3);opacity:0}60%{transform:translateY(-.8em) scale(1.12);opacity:1}100%{transform:none}}

/* lobby: the door on one side, the room filling up on the other */
.s-lobby .mid{display:grid;grid-template-columns:minmax(0,38em) minmax(0,1fr);gap:4em;align-items:center;text-align:left}
.door{display:flex;flex-direction:column;gap:1.2em;align-items:flex-start}
.door h1{font-size:5.2em}
.qr{width:21em;height:21em;padding:1.1em;background:#fff;border-radius:var(--r-card)}
.qr svg{display:block;width:100%;height:100%}
.door .or{font-size:1.55em;font-weight:600;color:var(--ink-2)}
.door .or b{color:var(--ink);font-weight:800}
.code{display:flex;gap:.5em;font-family:var(--font-d);font-weight:var(--d-w);font-size:4.2em;letter-spacing:.06em;line-height:1}
.room{align-self:stretch;display:flex;flex-direction:column;justify-content:center;gap:2em;min-width:0}
.room .crowd{--sz:7.4em;justify-content:flex-start;gap:1.6em 1.8em}
.room .crowd.n12{--sz:6em}
.room .crowd.n20{--sz:4.8em;gap:1em 1.2em}
.room .crowd.n32{--sz:3.8em;gap:.7em .8em}
.room .crowd.n48{--sz:3em;gap:.5em .6em}
.room .crowd .nm{display:block;font-size:1.25em}
.room .crowd.n32 .nm{font-size:.95em}
.room .crowd.n48 .nm{display:none}
.room .empty{font-family:var(--font-d);font-weight:var(--d-w);font-size:3.4em;letter-spacing:var(--d-ls);color:var(--ink-2);line-height:1.05;text-transform:var(--d-tt)}
.room .heads{font-size:1.6em;font-weight:700;color:var(--ink-2)}

/* the shelf: sets across the top, every game below */
.shelf{position:absolute;inset:0;z-index:8;overflow:auto;background:var(--bg);color:var(--ink);font-size:min(1.04vw,1.74vh);font-size:min(1.04cqw,1.85cqh);padding:3em 4.4em 3em;display:none}
.shelf.on{display:block}
.shelf h2{font-size:3.6em;margin-bottom:.5em}
.shelf h3{font-size:1.9em;margin:1.3em 0 .5em;color:var(--ink-2)}
.sets{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1.4em}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1.1em}
.tile{position:relative;display:flex;flex-direction:column;gap:.5em;align-items:flex-start;text-align:left;padding:1.2em 1.3em 1.1em;border-radius:var(--r-card);background:var(--paper);color:var(--paper-ink);box-shadow:var(--sh-card);border:var(--card-bd);transition:transform .15s var(--pop);min-height:8.6em}
.tile:hover{transform:translateY(-.3em) rotate(-.6deg)}
.tile b{font-family:var(--font-d);font-weight:var(--d-w);font-size:1.9em;line-height:1.04;letter-spacing:var(--d-ls);text-transform:var(--d-tt)}
.tile span{font-size:1.18em;font-weight:600;color:var(--paper-ink-2);line-height:1.25}
.tile small{font-size:1.02em;font-weight:700;color:var(--paper-ink-2);margin-top:auto}
.tile.set{min-height:11em}
.tile.set b{font-size:2.5em}
.tile[aria-pressed="true"]{outline:.35em solid var(--gold);outline-offset:.15em}
.shelf .foot{display:flex;justify-content:space-between;align-items:center;gap:1em;margin-top:1.6em;font-size:1.3em;font-weight:600;color:var(--ink-2)}

/* a game's title card */
.s-intro .mid{gap:2.4em}
.steps{display:grid;grid-template-columns:repeat(3,minmax(0,19em));gap:1.8em;justify-content:var(--ax,center)}
.step{display:flex;flex-direction:column;align-items:var(--ax,center);gap:.8em;padding:1.5em 1.3em;border-radius:var(--r-card);background:var(--paper);color:var(--paper-ink);box-shadow:var(--sh-card);border:var(--card-bd);font-size:1em}
.step svg.ic{width:4.2em;height:4.2em;stroke-width:1.7;color:var(--c2)}
.step span{font-size:1.85em;font-weight:700;line-height:1.2}
.step:nth-child(1){transform:rotate(calc(var(--tilt)*-1))}.step:nth-child(3){transform:rotate(var(--tilt))}

/* writing: the prompt, and who has sent something */
.cue{max-width:56em;padding:1.9em 2.6em;border-radius:var(--r-card);background:var(--paper);color:var(--paper-ink);box-shadow:var(--sh-card);border:var(--card-bd);font-size:1em}
.cue .big{font-size:5.6em;max-width:none}
.cue .big.long{font-size:4.3em}
.cue .ai{font-size:2.9em;font-weight:700;line-height:1.25;font-family:var(--font-u);overflow-wrap:anywhere}
.meter{font-size:1.7em;font-weight:800;color:var(--ink-2);font-variant-numeric:tabular-nums;min-height:1.35em;text-align:center}

/* choosing: text answers, statements or names */
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1.2em 1.6em;width:100%;max-width:88em}
.opts.one{grid-template-columns:minmax(0,1fr);max-width:64em}
.opt{position:relative;display:flex;align-items:flex-start;gap:.9em;text-align:left;padding:1.1em 4em 1.1em 1.2em;border-radius:var(--r-card);background:var(--paper);color:var(--paper-ink);box-shadow:var(--sh-card);border:var(--card-bd);min-height:6em;transition:transform .5s var(--pop),opacity .4s,filter .4s,background-color .3s;font-size:1em}
.opt .ix{flex:0 0 auto;width:1.7em;height:1.7em;border-radius:50%;display:grid;place-items:center;font-family:var(--font-d);font-weight:var(--d-w);font-size:1.5em;background:var(--ix-bg);color:var(--ix-ink);line-height:1}
.opt .t{flex:1;min-width:0;font-family:var(--font-u);font-weight:var(--u-w);font-size:1.85em;line-height:1.24;overflow-wrap:anywhere}
.opts.stmts .opt .t{font-size:2.5em}
.opts.few .opt .t{font-size:2.2em}
.opt .by{display:none;margin-top:.5em;font-family:var(--font-b);font-size:.62em;font-weight:800;color:var(--paper-ink-2)}
.opt .fixline{display:none;margin-top:.45em;font-family:var(--font-b);font-size:.6em;font-weight:700;color:var(--paper-ink-2)}
.opt .votes{position:absolute;right:.8em;bottom:-1.3em;display:flex;flex-direction:row-reverse;z-index:2}
.opt .votes .vv{width:3em;height:3em;margin-left:-.8em;animation:arrive .5s var(--pop) both}
.opt .n{position:absolute;right:.8em;top:.6em;font-family:var(--font-d);font-weight:var(--d-w);font-size:2.1em;line-height:1;display:none;font-variant-numeric:tabular-nums}
.opt.gone .t{opacity:.45;font-style:italic}
.opt.dim{opacity:.38;filter:saturate(.4)}
.opt.lift{transform:scale(1.035) rotate(-.6deg);z-index:3}
.opt.shown .by,.opt.shown .fixline{display:block}
.opt.shown .n{display:block}
.opt.real{background:var(--hit-bg);color:var(--hit-ink)}
.opt.real .by,.opt.real .fixline{color:inherit}
.opt.real .ix{background:var(--hit-ink);color:var(--hit-bg)}
.stamp{position:absolute;right:-1.1em;top:-1.9em;z-index:4;font-family:var(--font-d);font-weight:var(--d-w);font-size:1.75em;line-height:1;letter-spacing:var(--d-ls);padding:.55em .8em;transform:rotate(-7deg);animation:stamp .5s var(--pop) both;white-space:nowrap}
@keyframes stamp{0%{transform:rotate(-7deg) scale(2.6);opacity:0}60%{transform:rotate(-7deg) scale(.92);opacity:1}100%{transform:rotate(-7deg) scale(1)}}
.quote{position:relative;max-width:58em;padding:1.6em 2.4em;border-radius:var(--r-card);background:var(--paper);color:var(--paper-ink);box-shadow:var(--sh-card);border:var(--card-bd);font-family:var(--font-u);font-weight:var(--u-w);font-size:1em;text-align:left}
.quote p{font-size:3em;line-height:1.25;overflow-wrap:anywhere}
.quote p.long{font-size:2.3em}
.suspects{display:flex;flex-wrap:wrap;justify-content:var(--ax,center);gap:1.4em 2.6em}
.sus{position:relative;display:flex;flex-direction:column;align-items:center;gap:.4em;width:12.6em;transition:transform .5s var(--pop),opacity .4s,filter .4s}
.sus .face{width:8em;height:8em}
.sus .nm{font-size:1.7em;font-weight:800;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sus .n{font-family:var(--font-d);font-weight:var(--d-w);font-size:1.9em;line-height:1;display:none}
.sus.dim{opacity:.3;filter:saturate(.3)}
.sus.real{transform:scale(1.22) translateY(-.6em)}
.sus.shown .n{display:block}
.byline{display:flex;align-items:center;gap:.8em;font-family:var(--font-d);font-weight:var(--d-w);font-size:3em;letter-spacing:var(--d-ls);text-transform:var(--d-tt)}
.byline .face{width:1.7em;height:1.7em}
.verdict{font-family:var(--font-d);font-weight:var(--d-w);font-size:2.6em;letter-spacing:var(--d-ls);min-height:1.2em;text-transform:var(--d-tt)}

/* Just Me?: one hand per answer. A hand that is down is a short one standing on the same line, and
   a hand that goes up grows to full height, so no hand ever leaves its own box to sit on the words below. */
.hands{display:flex;flex-wrap:wrap;justify-content:center;align-items:flex-end;gap:.4em .5em;max-width:66em;--hs:5.6em}
.hand{width:var(--hs);height:calc(var(--hs)*1.5);transform-origin:50% 100%;transform:scale(.62);opacity:.28;transition:transform .5s var(--pop),opacity .3s}
.hand svg{width:100%;height:100%;display:block}
.hand.up{transform:none;opacity:1}
.tallynum{font-family:var(--font-d);font-weight:var(--d-w);font-size:9em;line-height:.9;letter-spacing:var(--d-ls);font-variant-numeric:tabular-nums}
.tallynum small{font-size:.36em;margin-left:.3em;color:var(--ink-2);text-shadow:none}
.mid.rev{gap:1.1em}
.mid.rev .lead{font-size:2em}
.mid.rev .big{font-size:3.4em}

/* Same Brain: matching words stack into towers */
.towers{display:flex;align-items:flex-end;justify-content:var(--ax,center);gap:2em;min-height:20em;width:100%}
.tower{display:flex;flex-direction:column-reverse;align-items:center;gap:.4em;flex:0 1 19em;min-width:0}
.brick{width:100%;padding:.5em .9em;border-radius:calc(var(--r-card)*.6);background:var(--paper);color:var(--paper-ink);box-shadow:var(--sh-card);border:var(--card-bd);font-family:var(--font-u);font-weight:800;font-size:1.6em;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;animation:drop .5s var(--pop) both}
.tower .word{font-family:var(--font-d);font-weight:var(--d-w);font-size:calc(var(--ws,2.5)*var(--word-k,1)*1em);line-height:1;max-width:100%;letter-spacing:var(--d-ls);text-transform:uppercase;margin-bottom:.25em;overflow-wrap:anywhere;text-align:center;order:-1}
.tower .cnt{font-family:var(--font-d);font-weight:var(--d-w);font-size:2em;line-height:1;color:var(--ink-2)}
.tower.top .brick{background:var(--hit-bg);color:var(--hit-ink)}
.loners{display:flex;flex-wrap:wrap;justify-content:var(--ax,center);gap:.5em .9em;max-width:70em;font-family:var(--font-u);font-weight:700;font-size:1.8em;color:var(--ink-2);text-transform:lowercase}
@keyframes drop{0%{transform:translateY(-9em) rotate(6deg);opacity:0}70%{transform:translateY(.3em);opacity:1}100%{transform:none}}

/* Only You */
.secretcard{position:relative;width:22em;height:14em;border-radius:var(--r-card);background:var(--paper);color:var(--paper-ink);box-shadow:var(--sh-card);border:var(--card-bd);display:grid;place-items:center;transform:rotate(-3deg);font-size:1em}
.secretcard svg.ic{width:5em;height:5em;stroke-width:1.5}
.bigclock{font-family:var(--font-d);font-weight:var(--d-w);font-size:15em;line-height:.9;letter-spacing:var(--d-ls);font-variant-numeric:tabular-nums}
.deck{display:grid;grid-template-columns:repeat(var(--cols,8),minmax(0,1fr));gap:.8em;width:100%;max-width:var(--deck-w,62em);perspective:60em}
.mini{position:relative;aspect-ratio:4/3;transform-style:preserve-3d;transition:transform .7s var(--ease)}
.mini i,.mini b{position:absolute;inset:0;border-radius:.5em;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:grid;place-items:center}
.mini i{background:var(--c3);border:var(--card-bd)}
.mini b{background:var(--paper);color:var(--paper-ink);border:var(--card-bd);transform:rotateY(180deg);font-family:var(--font-d);font-weight:var(--d-w);font-size:var(--mini-f,1.2em);line-height:1.05;padding:.3em;text-align:center}
.mini.flip{transform:rotateY(180deg)}

/* scores and the podium */
.board{width:100%;max-width:62em;display:flex;flex-direction:column;gap:.6em}
.row{position:relative;display:grid;grid-template-columns:2.4em 3.8em minmax(0,1fr) auto minmax(7em,auto);align-items:center;gap:1.1em;padding:.5em 1.4em .5em 1em;text-align:left;border-radius:var(--r-card);background:var(--paper);color:var(--paper-ink);box-shadow:var(--sh-card);border:var(--card-bd);transition:transform .7s var(--ease);font-size:1em}
.row .rk{font-family:var(--font-d);font-weight:var(--d-w);font-size:1.9em;text-align:center}
.row .face{width:3.8em;height:3.8em}
.row .nm{font-size:2.05em;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .pt{grid-column:5;font-family:var(--font-d);font-weight:var(--d-w);font-size:2.3em;font-variant-numeric:tabular-nums;text-align:right}
.row .up{grid-column:4;grid-row:1;font-family:var(--font-d);font-weight:var(--d-w);font-size:1.35em;line-height:1;padding:.3em .6em;border-radius:99em;background:var(--c2);color:#fff;animation:pip .5s var(--pop) both}
.row.first .up{background:var(--hit-ink);color:var(--hit-bg)}
@keyframes pip{0%{transform:scale(0)}100%{transform:none}}
.row.first{background:var(--hit-bg);color:var(--hit-ink)}
.more{font-size:1.4em;font-weight:700;color:var(--ink-2)}
.podium{display:flex;align-items:flex-end;justify-content:center;gap:1.6em;height:31em}
.plinth{display:flex;flex-direction:column;align-items:center;gap:.6em;width:18em}
.plinth .face{width:11em;height:11em;animation:arrive .8s var(--pop) both}
.plinth .nm{font-size:2.1em;font-weight:800;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.plinth .blk{width:100%;border-radius:var(--r-card) var(--r-card) 0 0;background:var(--paper);color:var(--paper-ink);border:var(--card-bd);display:grid;place-items:start center;padding-top:.5em;font-family:var(--font-d);font-weight:var(--d-w);font-size:3.2em;transform-origin:bottom;animation:grow .8s var(--ease) both}
.plinth.p1 .blk{height:3.6em;background:var(--hit-bg);color:var(--hit-ink)}.plinth.p2 .blk{height:2.6em}.plinth.p3 .blk{height:1.9em}
.plinth.p1{order:2}.plinth.p2{order:1}.plinth.p3{order:3}
.plinth.p1 .face{width:14em;height:14em}
@keyframes grow{0%{transform:scaleY(0)}100%{transform:none}}
.applause{display:flex;align-items:center;gap:1em;font-size:1.7em;font-weight:800;color:var(--ink-2)}
.applause .bar{width:16em;height:.9em;border-radius:99em;background:var(--line);overflow:hidden}
.applause .bar i{display:block;height:100%;width:0;background:var(--gold);border-radius:99em;transition:width .3s}
.closing{font-family:var(--font-d);font-weight:var(--d-w);font-size:5.2em;line-height:1.06;letter-spacing:var(--d-ls);max-width:16em;text-wrap:balance;text-transform:var(--d-tt)}

/* between moments: each theme draws its own */
.curtain{position:absolute;inset:0;z-index:7;pointer-events:none;display:none}
.curtain.go{display:block}

/* the host's bar: quiet, always there, the one filled button at the right end */
.hostbar{flex:0 0 auto;display:flex;align-items:center;gap:12px;padding:8px 14px;min-height:60px;background:var(--bar);color:var(--bar-ink);border-top:var(--bar-bd);font-family:var(--font-b);z-index:9;position:relative}
.hostbar .grp{display:flex;align-items:center;gap:6px}
.hostbar .status{flex:1;min-width:0;text-align:center;font-size:14px;font-weight:700;opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hostbar .btn{min-height:44px;font-size:15px}
.hostbar .btn.sec{background:transparent;color:inherit;border:1.5px solid currentColor;opacity:.9}
.ibtn{width:44px;height:44px;border-radius:50%;display:inline-grid;place-items:center;color:inherit;opacity:.85}
.ibtn:hover{opacity:1;background:var(--bar-hover)}
.ibtn svg{width:22px;height:22px}
.vol{width:84px;accent-color:var(--gold)}
.vol:disabled{opacity:.3}
.netbad{display:none;font-size:13px;font-weight:800;padding:4px 10px;border-radius:99px;background:var(--bad);color:#fff}
.netbad.on{display:inline-block}
.menu{position:absolute;left:10px;bottom:66px;z-index:20;width:290px;padding:10px;border-radius:16px;background:var(--paper);color:var(--paper-ink);box-shadow:0 18px 50px rgba(0,0,0,.35);display:none;flex-direction:column;gap:2px}
.menu.on{display:flex}
.menu button{display:flex;justify-content:space-between;align-items:center;gap:10px;min-height:44px;padding:0 12px;border-radius:10px;font-weight:700;font-size:15px;text-align:left}
.menu button:hover{background:var(--line)}
.menu button em{font-style:normal;font-weight:600;opacity:.65}
.menu hr{border:0;border-top:1.5px solid var(--line);margin:6px 4px}
.sheet{position:absolute;inset:0;z-index:15;display:none;place-items:center;background:rgba(10,16,30,.62);padding:20px}
.sheet.on{display:grid}
.sheet .box{width:min(520px,100%);max-height:100%;overflow:auto;padding:26px;border-radius:22px;background:var(--paper);color:var(--paper-ink);display:flex;flex-direction:column;gap:14px;align-items:center;text-align:center}
.sheet .box h2{font-size:30px}
.sheet .box .qr{width:260px;height:260px;padding:12px;border:1.5px solid var(--line)}
.sheet .box .code{font-size:40px}
.sheet .box p{font-size:15px;font-weight:600;color:var(--paper-ink-2)}
.sheet .box.notes{text-align:left;align-items:stretch}
.sheet .box.notes h3{font-size:19px;margin-top:6px}
.sheet .box.notes p{font-size:15px;line-height:1.45}
.hidebtn{position:absolute;left:.6em;bottom:.5em;font-size:.95em;font-weight:800;padding:.25em .7em;border-radius:99em;background:var(--paper-ink);color:var(--paper);opacity:0;pointer-events:none;transition:opacity .15s}
.opt:hover .hidebtn,.quote:hover .hidebtn,.hidebtn:focus-visible{opacity:.85;pointer-events:auto}
.quote .hidebtn{left:auto;right:.8em;font-size:1.15em}
.quote.gone p{opacity:.45;font-style:italic}
.kick{position:absolute;right:-.5em;top:-.5em;width:2em;height:2em;border-radius:50%;background:var(--paper-ink);color:var(--paper);font-weight:900;font-size:1em;line-height:1;opacity:0;pointer-events:none;transition:opacity .15s;display:grid;place-items:center}
.room .who:hover .kick,.kick:focus-visible{opacity:.9;pointer-events:auto}
.toast{position:absolute;left:50%;bottom:76px;transform:translateX(-50%);z-index:30;display:none;align-items:center;gap:14px;padding:10px 12px 10px 20px;border-radius:99px;background:var(--paper);color:var(--paper-ink);box-shadow:0 12px 40px rgba(0,0,0,.35);font-weight:700;font-size:15px}
.toast.on{display:flex}

/* the practice room: the stage, and one controller beside it */
.padframe{flex:0 0 auto;width:min(360px,34vw);display:none;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:14px;background:var(--bar);color:var(--bar-ink)}
#stageWrap.drive .padframe{display:flex}
.padframe .shell{width:100%;max-width:330px;height:min(660px,calc(100vh - 90px));border-radius:36px;overflow:hidden;border:8px solid #10131c;background:var(--bg);position:relative}
.padframe .shell .pad{--pad-h:100%;height:100%;overflow:auto}
.padframe p{font-size:13px;font-weight:700;opacity:.8;text-align:center}

/* ---------- the controller: one thing to do, as big as the thumb ---------- */
#padWrap.on{display:block}
.pad{position:relative;min-height:var(--pad-h,100dvh);display:flex;flex-direction:column;max-width:560px;margin:0 auto;padding:max(12px,env(safe-area-inset-top)) 18px max(12px,env(safe-area-inset-bottom));color:var(--ink);background:var(--field,var(--bg));font-size:16px;transition:background-color .3s}
.pad .me{display:flex;align-items:center;gap:10px;min-height:48px;font-weight:800;font-size:16px;position:relative;z-index:2}
.pad .me .face{width:40px;height:40px;flex:0 0 auto}
.pad .me .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pad .me .pts{font-family:var(--font-d);font-weight:var(--d-w);font-size:20px;font-variant-numeric:tabular-nums}
.pm{flex:1;display:flex;flex-direction:column;justify-content:center;gap:16px;padding:14px 0;position:relative;z-index:2;min-width:0}
.pf{display:flex;justify-content:center;align-items:center;min-height:44px;position:relative;z-index:2}
.pf button{font-size:13px;font-weight:700;opacity:.7;min-height:44px;padding:0 14px;display:inline-flex;align-items:center;gap:6px}
.pf button svg{width:16px;height:16px}
.ph{font-family:var(--font-d);font-weight:var(--d-w);font-size:clamp(30px,9vw,44px);line-height:var(--d-lh);letter-spacing:var(--d-ls);text-transform:var(--d-tt);text-wrap:balance;overflow-wrap:anywhere}
.ph.sm{font-size:clamp(22px,6.4vw,30px)}
.pp{font-size:17px;font-weight:600;color:var(--ink-2);line-height:1.4;text-wrap:pretty}
.pcard{padding:16px;border-radius:var(--r-pad);background:var(--paper);color:var(--paper-ink);border:var(--card-bd);box-shadow:var(--sh-pad);display:flex;flex-direction:column;gap:10px}
.pcard .pp{color:var(--paper-ink-2)}
.field{width:100%;min-height:52px;padding:14px;border-radius:var(--r-pad);border:2px solid var(--field-bd);background:var(--paper);color:var(--paper-ink);font-family:var(--font-u);font-weight:600;font-size:18px;line-height:1.35;resize:none}
textarea.field{min-height:132px}
.field::placeholder{color:var(--paper-ink-2);opacity:.7}
.pm .count{font-size:13px;font-weight:700;color:var(--ink-2);text-align:right;min-height:18px}
.pm .count.near{color:var(--bad)}
.lbl{font-size:14px;font-weight:800;margin-bottom:-8px}
.aibox{font-family:var(--font-u);font-size:16px;font-weight:600;line-height:1.4;overflow-wrap:anywhere}
.choices{display:flex;flex-direction:column;gap:10px}
.choice{position:relative;display:flex;align-items:center;gap:12px;width:100%;min-height:60px;padding:12px 14px;border-radius:var(--r-pad);background:var(--paper);color:var(--paper-ink);border:2px solid var(--field-bd);text-align:left;font-family:var(--font-u);font-weight:var(--u-w);font-size:17px;line-height:1.3;overflow-wrap:anywhere;transition:transform .15s var(--pop),border-color .15s,background-color .15s}
.choice .ix{flex:0 0 auto;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-family:var(--font-d);font-weight:var(--d-w);font-size:16px;background:var(--ix-bg);color:var(--ix-ink)}
.choice .face{width:44px;height:44px;flex:0 0 auto}
.choice[aria-pressed="true"]{border-color:var(--pick);background:var(--pick-bg);transform:scale(1.02)}
.choice:disabled{opacity:.45}
.choice .mine{margin-left:auto;font-family:var(--font-b);font-size:13px;font-weight:800;opacity:.75;white-space:nowrap}
.choices.names{display:grid;grid-template-columns:1fr 1fr}
.choices.names .choice{flex-direction:column;text-align:center;font-family:var(--font-b);font-weight:800;gap:6px;min-height:104px}
.yn{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.yn .choice{justify-content:center;min-height:120px;font-family:var(--font-d);font-weight:var(--d-w);font-size:24px;text-align:center;letter-spacing:var(--d-ls)}
.dial{display:flex;align-items:center;justify-content:center;gap:16px}
.dial b{font-family:var(--font-d);font-weight:var(--d-w);font-size:88px;line-height:1;min-width:1.5em;text-align:center;font-variant-numeric:tabular-nums}
.dial button{width:64px;height:64px;border-radius:50%;background:var(--paper);color:var(--paper-ink);border:2px solid var(--field-bd);font-size:30px;font-weight:800;line-height:1}
.dial button:disabled{opacity:.35}
.range{width:100%;height:44px;accent-color:var(--pick)}
.pad .big-face{width:150px;height:150px;margin:0 auto}
.pad .tapzone{display:flex;flex-direction:column;align-items:center;gap:14px;padding:18px;border-radius:var(--r-pad);width:100%}
.pad .tapzone:active .big-face{transform:scale(.92) rotate(-6deg)}
.pad .big-face{transition:transform .15s var(--pop)}
.codeboxes{display:flex;justify-content:center;gap:6px}
.codeboxes input{width:36px;height:52px;border-radius:10px;border:2px solid var(--field-bd);background:var(--paper);color:var(--paper-ink);text-align:center;font-family:var(--font-d);font-weight:var(--d-w);font-size:24px;text-transform:uppercase;padding:0}
.codeboxes input:nth-child(4){margin-right:10px}
.codeboxes.shake{animation:shake .4s}
@keyframes shake{20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
.result{display:flex;flex-direction:column;gap:10px;align-items:flex-start}
.delta{font-family:var(--font-d);font-weight:var(--d-w);font-size:56px;line-height:1;letter-spacing:var(--d-ls)}
.scard{position:relative;width:100%;min-height:300px;perspective:900px}
.scard .in{position:relative;display:block;width:100%;min-height:300px;transition:transform .7s var(--ease);transform-style:preserve-3d}
.scard.open .in{transform:rotateY(180deg)}
.scard .f,.scard .b{position:absolute;inset:0;border-radius:var(--r-pad);display:flex;flex-direction:column;justify-content:center;gap:12px;padding:22px;backface-visibility:hidden;-webkit-backface-visibility:hidden;border:var(--card-bd)}
.scard .f{background:var(--c3);color:#fff;align-items:center;text-align:center;font-family:var(--font-d);font-weight:var(--d-w);font-size:26px;letter-spacing:var(--d-ls)}
.scard .b{background:var(--paper);color:var(--paper-ink);transform:rotateY(180deg);text-align:left}
.scard .b strong{font-family:var(--font-d);font-weight:var(--d-w);font-size:24px;line-height:1.12;letter-spacing:var(--d-ls)}
.scard .b span{font-size:16px;font-weight:700;color:var(--paper-ink-2)}
.marks{display:flex;justify-content:center;gap:14px}
.marks button{width:76px;height:76px;border-radius:50%;border:3px dashed var(--ink-2);font-family:var(--font-d);font-weight:var(--d-w);font-size:28px;color:var(--ink-2);transition:transform .2s var(--pop)}
.marks button[aria-pressed="true"]{border:3px solid var(--pick);background:var(--pick-bg);color:var(--paper-ink);transform:scale(1.08)}
.clapbtn{width:190px;height:190px;border-radius:50%;margin:0 auto;background:var(--gold);color:var(--gold-ink);font-family:var(--font-d);font-weight:var(--d-w);font-size:34px;letter-spacing:var(--d-ls);box-shadow:0 10px 0 rgba(0,0,0,.22);transition:transform .08s,box-shadow .08s;display:grid;place-items:center}
.clapbtn:active{transform:translateY(8px) scale(.97);box-shadow:0 2px 0 rgba(0,0,0,.22)}
.toy{position:absolute;inset:0;width:100%;height:100%;z-index:1;pointer-events:none}
.pad.idle .toy{pointer-events:auto}
.pad.idle .pm{pointer-events:none}
.pad.idle .pm :is(button,input,textarea,a){pointer-events:auto}
.field.need{border-color:var(--bad);animation:shake .4s}
.pad .hint{font-size:14px;font-weight:700;color:var(--ink-2);text-align:center}
.padbar{position:relative;z-index:2;height:6px;border-radius:99px;background:var(--line);overflow:hidden}
.padbar i{display:block;height:100%;background:var(--pick);transform-origin:left;border-radius:99px}

/* ---------- the front page and the dead ends ---------- */
#studio{min-height:100dvh;color:var(--ink);background:var(--bg)}
.marquee{position:relative;overflow:hidden;background:var(--field,var(--bg));color:var(--ink);padding:clamp(52px,7vw,92px) clamp(20px,5vw,64px) clamp(46px,6vw,76px)}
.marquee .bg{font-size:min(1.25vw,2vh)}
.hero{position:relative;z-index:2;max-width:1060px;margin:0 auto;display:flex;flex-direction:column;align-items:flex-start;gap:20px}
.hero h1{font-size:clamp(64px,13vw,150px)}
.hero .tag{font-size:clamp(18px,2.4vw,27px);font-weight:600;color:var(--ink-2);max-width:27em;text-wrap:balance}
.cast{display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:8px}
.castm{width:clamp(42px,6vw,72px);height:clamp(42px,6vw,72px);padding:0;border-radius:12px}
.castm .av{transition:transform .2s var(--pop)}
.castm:hover .av{transform:translateY(-6px) rotate(-5deg)}
.castm.hop .av{animation:hop .55s var(--pop)}
.setup{max-width:1188px;margin:0 auto;padding:clamp(26px,4vw,44px) clamp(20px,5vw,64px) 0;display:flex;flex-direction:column;gap:16px}
.setup h2{font-size:clamp(26px,3.6vw,40px)}
.themes{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.themecard{display:flex;flex-direction:column;gap:10px;padding:10px 10px 12px;border-radius:18px;background:transparent;border:2.5px solid var(--line);text-align:left;font-weight:800;font-size:16px;color:var(--ink);transition:transform .15s var(--pop)}
.themecard:hover{transform:translateY(-3px)}
.themecard[aria-pressed="true"]{border-color:var(--gold);box-shadow:0 0 0 3px var(--gold)}
.themecard .mini-stage{aspect-ratio:16/9;border-radius:10px;overflow:hidden;position:relative;display:grid;place-items:center}
.themecard .mini-stage span{font-size:clamp(15px,2.2vw,26px);line-height:1;text-align:center;padding:0 8px}
.setrow{display:flex;flex-wrap:wrap;gap:10px 22px;align-items:center}
.seg{display:inline-flex;align-items:center;gap:8px;font-size:14px;font-weight:700;color:var(--ink-2)}
.seg div{display:inline-flex;border-radius:99px;border:2px solid var(--line);overflow:hidden}
.seg button{min-height:40px;padding:0 14px;font-size:14px;font-weight:800;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.go{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-top:4px}
.go .btn{min-height:56px;font-size:18px;padding:0 1.7em}
.hero .err{font-size:15px;font-weight:700;color:var(--ink);min-height:1.3em;max-width:34em}
.hero .err:empty{display:none}
.backbar{display:none;align-items:center;justify-content:space-between;gap:12px;padding:10px 12px 10px 18px;border-radius:99px;background:var(--paper);color:var(--paper-ink);border:var(--card-bd);font-weight:700;font-size:15px}
.backbar.on{display:flex}
.inside{max-width:1188px;margin:0 auto;padding:clamp(30px,5vw,54px) clamp(20px,5vw,64px) clamp(40px,6vw,72px);display:flex;flex-direction:column;gap:6px}
.inside ul{display:flex;flex-direction:column;gap:6px;padding:4px;font-size:15px;font-weight:600;line-height:1.5;color:var(--ink-2);max-width:60em}
.inside li{padding-left:1.1em;position:relative}
.inside li::before{content:'';position:absolute;left:0;top:.62em;width:.4em;height:.4em;border-radius:50%;background:var(--c1)}
.inside h2{font-size:clamp(26px,3.6vw,40px);margin-bottom:8px}
.inside h3{font-size:19px;margin:18px 0 4px;color:var(--ink-2)}
.inside details{border-bottom:1.5px solid var(--line)}
.inside summary{display:grid;grid-template-columns:minmax(0,13em) minmax(0,1fr) auto;gap:14px;align-items:baseline;padding:12px 4px;cursor:pointer;list-style:none;font-size:16px}
.inside summary::-webkit-details-marker{display:none}
.inside summary b{font-weight:800;font-size:17px}
.inside summary span{font-weight:600;color:var(--ink-2)}
.inside summary em{font-style:normal;font-weight:700;font-size:14px;color:var(--ink-2);white-space:nowrap}
.inside details p{padding:0 4px 8px;font-size:15px;font-weight:600;line-height:1.5;color:var(--ink-2);max-width:60em}
.inside details p b{color:var(--ink)}
#gate{min-height:100dvh;padding:28px;place-items:center;text-align:center;background:var(--bg);color:var(--ink)}
#gate.on{display:grid}
#gate .inner{display:flex;flex-direction:column;gap:16px;align-items:center;max-width:26em}
#gate h1{font-size:clamp(34px,7vw,60px)}

/* ==========================================================================
   THEMES. A theme is a block of tokens, a few rules for its signature parts
   (backdrop, clock, stamp, the move between moments), and an entry in THEMES in
   the script with its name, its confetti and its band.

   HOW TO ADD A THEME OR A SEASONAL EDITION
   1. Copy one token block below and change the values: [data-theme="yours"]{...}
   2. Add yours to THEMES in the script (name, backdrop, confetti, band).
   3. A seasonal edition can sit on a theme it resembles. Give it base:"show" in
      THEMES and write only what changes under [data-edition="yours"]{...}.
      "Snow Day" at the end of this block is the worked example: about thirty lines.
   Mechanics never read a theme, so nothing else needs to change.

   Tones: the stage and the controller both carry data-tone (plain, loud, dark,
   warm, cool) for the kind of moment they are in. A theme may colour by tone
   (Big Type does) or ignore it.
   ========================================================================== */

/* ---------- Game Show: a 1970s set cut from paper, in the house palette ---------- */
:root,[data-theme="show"]{
  --bg:#293851;--ink:#FFF8E6;--ink-2:#C4CCDE;--line:rgba(255,248,230,.2);
  --paper:#FFF8E6;--paper-ink:#253049;--paper-ink-2:#55627F;
  --gold:#FFCC00;--gold-ink:#253049;--c1:#D86527;--c2:#3E8E8C;--c3:#D86527;--good:#3E8E8C;--bad:#C2491A;--focus:#FFCC00;
  --font-d:'Caprasimo','Cooper Black',Georgia,serif;--d-w:400;--d-ls:.005em;--d-lh:1.02;--d-tt:none;--d-wd:100%;
  --font-b:'Montserrat',Arial,sans-serif;--b-w:600;--font-u:'Montserrat',Arial,sans-serif;--u-w:700;
  --r-card:1.1em;--r-btn:999px;--r-pad:18px;
  --sh-card:0 .42em 0 rgba(12,18,34,.42);--sh-pad:0 5px 0 rgba(12,18,34,.32);--card-bd:0 solid transparent;
  --btn:#FFCC00;--btn-ink:#253049;--btn-bd:0;--btn-sh:0 4px 0 #B78600;--sec-bd:0;
  --ix-bg:#FFCC00;--ix-ink:#253049;--hit-bg:#FFCC00;--hit-ink:#253049;--pick:#D86527;--pick-bg:#FFE7B0;--field-bd:rgba(37,48,73,.28);
  --bar:#1D2740;--bar-ink:#E9EDF6;--bar-bd:0;--bar-hover:rgba(255,255,255,.1);
  --tilt:1.6deg;--ease:cubic-bezier(.22,1,.36,1);--pop:cubic-bezier(.34,1.56,.64,1);
  --p0:#FFCC00;--p1:#F08A4B;--p2:#68BFBD;--p3:#F6A6B8;--p4:#A9CE5B;--p5:#8FB8F0;--p6:#BBA6E8;--p7:#FFF1C2;
}

<script>
"use strict";
/* ==========================================================================
   ICEBOX: party games to kick off a meeting.
   One shared screen is the stage. Each person's own device is their controller.

   HOW A SESSION WORKS
   An open session on the pt worker (tool id "ice"), with an eight-letter code.
   Eight letters from 23 is about 78 billion codes, too many to find by guessing in
   any useful time; that is why this tool may carry nicknames and typed answers in a
   session people join by code. The host holds the key. With the code alone a device can read the
   session and write only under four paths:
     p/<id>            a player: nickname and look
     a/<round>/<id>    an answer
     v/<case>/<id>     a vote      (v/<case>h/<ballot> for a secret show of hands,
                                    keyed by an id that maps to nobody)
     here/<id>         presence, and the taps that wave, clap and throw planes
   Everything the room is shown lives under pub/ and is written by the host, so
   controllers read a couple of dozen small rows (?prefix=pub) however big the room.
   What the stage needs to remember between reloads lives under h/.

var CODE_ABC = "ABCDEFGHJKMNPQRSTUVWXYZ";          /* no I, L or O: nobody squints at a projector */

var App = {
