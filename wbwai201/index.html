<style>
:root{
  --gold:#FFCC00; --sun:#F2C94C;
  --cobalt:#293851; --aegean:#586A90;
  --paper:#FFFFFF; --warm:#FBF8F3; --editorial:#F9F6F6; --line:rgba(41,56,81,.16); --hair:rgba(41,56,81,.10);
  --tealT:#E4F4F4; --tealM:#68BFBD; --teal:#3E8E8C;
  --clayM:#D86527; --clay:#B14E1C; --fern:#90B210;
  --sans:'Montserrat',Arial,sans-serif; --serif:Georgia,'Gelasio','Times New Roman',serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--warm);color:var(--cobalt);font-family:var(--sans);font-size:16px;line-height:1.55;font-weight:500}
button,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:46px;padding:0 24px;border-radius:999px;border:1.5px solid var(--cobalt);background:var(--cobalt);color:#fff;font-weight:700;font-size:15px;cursor:pointer;white-space:nowrap}
.btn:hover{background:#1e2a3e}
.btn.out{background:var(--paper);color:var(--cobalt)}
.btn.out:hover{background:var(--editorial)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--cobalt);padding:0 14px}
.btn.ghost:hover{background:rgba(41,56,81,.06)}

/* ---------- setup ---------- */
.setup{max-width:720px;margin:0 auto;padding:48px 20px 96px}
.setup .brand{width:150px;height:auto;display:block;margin:0 0 56px}
.setup h1{font-family:var(--serif);font-weight:400;font-size:clamp(32px,4.6vw,44px);line-height:1.12;margin:0 0 12px;text-wrap:balance}
.setup .safe{color:var(--aegean);margin:0 0 36px}
.drop{border:2px dashed rgba(41,56,81,.24);border-radius:18px;background:var(--paper);padding:48px 22px;text-align:center;transition:border-color .2s,background .2s}
.drop.over{border-color:var(--teal);background:var(--tealT)}
.drop .big{font-family:var(--serif);font-size:24px;margin:0 0 20px}
.drop.loaded{border-style:solid;border-color:var(--line);padding:22px 22px 22px 26px;text-align:left;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.drop .grow{flex:1 1 240px;min-width:0}
.drop .fname{font-weight:700;overflow-wrap:anywhere}
.drop .fsum{color:var(--aegean)}
.err{color:var(--clay);font-weight:600;margin:14px 0 0}
.opts{margin-top:56px;display:grid;gap:52px}
.opts h2{font-family:var(--serif);font-weight:400;font-size:26px;margin:0 0 16px}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.choice{text-align:left;border:1.5px solid var(--line);background:var(--paper);border-radius:16px;padding:20px 20px 20px 56px;cursor:pointer;position:relative;font-family:var(--serif);font-size:20px}
.choice::before{content:'';box-sizing:border-box;position:absolute;left:20px;top:50%;margin-top:-10px;width:20px;height:20px;border-radius:50%;border:1.5px solid rgba(41,56,81,.4);background:var(--paper)}
.choice[aria-pressed="true"]{border-color:var(--cobalt);box-shadow:0 6px 20px rgba(41,56,81,.10)}
.choice[aria-pressed="true"]::before{border:6px solid var(--cobalt)}
.choice:disabled{opacity:.45;cursor:default}
.choices.need .choice{border-color:var(--clayM)}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.fields .wide{grid-column:1/-1}
.fld label{display:block;font-weight:600;margin:0 0 8px}
.fld input{width:100%;min-height:50px;border:1.5px solid var(--line);border-radius:12px;background:var(--paper);padding:10px 14px}
.fld input:focus{border-color:var(--cobalt);outline:none}
.acts{list-style:none;margin:0;padding:0;border-top:1.5px solid var(--hair)}
.acts li{border-bottom:1.5px solid var(--hair)}
.acts label{display:flex;align-items:center;gap:16px;padding:14px 4px;cursor:pointer;min-height:52px}
.acts input{width:20px;height:20px;accent-color:var(--cobalt);flex:0 0 auto;margin:0}
.acts .an{flex:1;min-width:0;overflow-wrap:anywhere}
.acts .ct{color:var(--aegean);white-space:nowrap}
.go{display:flex;align-items:center;gap:18px;flex-wrap:wrap}

/* ---------- viewer ---------- */
.viewer{min-height:100vh;background:#EFEBE4}
.bar{position:sticky;top:0;z-index:5;background:rgba(251,248,243,.94);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1.5px solid var(--line)}
.bar .in{max-width:1100px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.bar .sp{flex:1 1 20px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--cobalt);color:#fff;padding:12px 22px;border-radius:999px;font-weight:600;z-index:10;box-shadow:0 10px 30px rgba(41,56,81,.25);max-width:calc(100% - 32px);text-align:center}

/* ---------- the report ---------- */
.doc{width:8.5in;max-width:calc(100% - 24px);margin:32px auto 80px;background:var(--paper);padding:.9in .85in .7in;box-shadow:0 1px 2px rgba(41,56,81,.08),0 14px 40px rgba(41,56,81,.10);border-radius:4px;font-size:16px;line-height:1.55}
.cover{min-height:7.4in;display:flex;flex-direction:column}
.cover .logo{width:170px;height:auto;display:block;margin:0 0 1.3in}
.cover h1{font-family:var(--serif);font-weight:400;font-size:54px;line-height:1.08;margin:0;text-wrap:balance;overflow-wrap:anywhere}
.cover .sub{font-family:var(--serif);font-style:italic;font-size:26px;color:var(--aegean);margin:14px 0 0}
.cover .rule{width:60px;height:4px;border-radius:2px;background:var(--gold);margin:40px 0 28px}
.cover .meta{font-size:18px;line-height:1.7;margin:0;overflow-wrap:anywhere}
.clusterrow{position:relative;height:170px;margin-top:auto}
.cluster{position:absolute;right:0;bottom:0;width:230px;height:170px}
.cluster i{position:absolute;border-radius:50%}
.cluster i:nth-child(1){width:104px;height:104px;right:0;bottom:0;background:var(--sun)}
.cluster i:nth-child(2){width:74px;height:74px;right:88px;bottom:22px;background:var(--tealM)}
.cluster i:nth-child(3){width:52px;height:52px;right:56px;bottom:86px;background:var(--clayM)}
.cluster i:nth-child(4){width:16px;height:16px;right:150px;bottom:112px;background:var(--sun)}
.cluster i:nth-child(5){width:10px;height:10px;right:24px;bottom:132px;background:var(--tealM)}

.rsec{margin-top:96px}
.sechead{margin:0 0 40px;break-after:avoid;break-inside:avoid}
.sechead h2{font-family:var(--serif);font-weight:400;font-size:34px;line-height:1.18;margin:0;text-wrap:balance;overflow-wrap:anywhere}
.sechead p{margin:10px 0 0;color:var(--aegean)}
.nothing{font-family:var(--serif);font-style:italic;font-size:18px;color:var(--aegean);margin:0}

/* the AI curve */
.crow{display:grid;grid-template-columns:minmax(0,230px) minmax(0,1fr) auto;column-gap:24px;row-gap:8px;align-items:center;break-inside:avoid}
.crow + .crow{margin-top:34px}
.crow .nm{font-weight:600;font-size:17px;overflow-wrap:anywhere}
.crow .track{height:14px;background:#F1EEE8;border-radius:4px;overflow:hidden}
.crow .fill{height:100%;background:var(--cobalt);border-radius:4px}
.crow .num{display:flex;align-items:baseline;justify-content:flex-end;gap:10px;min-width:96px}
.crow .num b{font-family:var(--serif);font-weight:400;font-size:34px;line-height:1.05}
.crow .num span{color:var(--aegean)}
.crow .who{grid-column:1/-1;color:var(--aegean);font-size:14.5px;overflow-wrap:anywhere}

/* lists */
.pair{display:grid;grid-template-columns:1fr 1fr;column-gap:48px}
.pair.stack{grid-template-columns:1fr;row-gap:56px}
.pair:not(.stack){break-inside:avoid}
.list{min-width:0}
.list h3{font-family:var(--serif);font-weight:400;font-size:23px;line-height:1.25;margin:0 0 14px;break-after:avoid}
.items{margin:0;padding:0}
.row{display:flex;column-gap:48px;break-inside:avoid}
.row.big{break-inside:auto}
.row > .cell{flex:1 1 0;min-width:0;overflow-wrap:anywhere}
.items .cell{position:relative;padding:14px 0 14px 26px;border-top:1px solid var(--hair)}
.items .cell::before{content:'';position:absolute;left:3px;top:23px;width:8px;height:8px;border-radius:50%;background:var(--aegean)}
.L .items .cell::before{background:var(--tealM)}
.R .items .cell::before{background:var(--clayM)}
.X .items .cell::before{background:var(--fern)}
.row > .cell.gap{border-top:0}
.row > .cell.gap::before{display:none}
.items.long .cell{white-space:pre-line}
.who{display:block;font-size:14.5px;color:var(--aegean);margin-top:4px;white-space:normal}

/* statements */
.quotes .cell{padding:22px 0 24px;border-top:1px solid var(--hair)}
.quotes .q{font-family:var(--serif);font-size:20px;line-height:1.55;margin:0;white-space:pre-line}
.quotes .q .tp{color:var(--aegean)}

/* compact layout for big sessions: answers flow down columns, no rules between them */
.doc.compact{font-size:13.5px;line-height:1.4}
.flow{column-gap:30px}
.flow.c2{column-count:2}
.flow.c3{column-count:3}
.flow > .cell{display:block;break-inside:avoid}
.flow > .cell.big{break-inside:auto}
.compact .rsec{margin-top:60px}
.compact .sechead{margin-bottom:22px}
.compact .sechead h2{font-size:27px}
.compact .sechead p{margin-top:6px;font-size:14px}
.compact .crow + .crow{margin-top:16px}
.compact .crow .nm{font-size:15px}
.compact .crow .num b{font-size:26px}
.compact .crow .who{font-size:13px}
.compact .pair{column-gap:32px}
.compact .pair.stack{row-gap:32px}
.compact .list h3{font-size:19px;margin-bottom:8px}
.compact .row{column-gap:28px}
.compact .items .cell{padding:3px 0 4px 16px;border-top:0}
.compact .items .cell::before{left:2px;top:10px;width:6px;height:6px}
.compact .items .who{display:inline;font-size:12.5px;margin:0 0 0 4px}
.compact .items .who::before{content:'\00B7\00A0'}
.compact .quotes .cell{padding:5px 0 9px;border-top:0}
.compact .quotes .q{font-size:14.5px;line-height:1.45}
.compact .quotes .who{font-size:12.5px;margin-top:2px}
.compact .end{margin-top:60px}

.end{margin-top:96px;display:flex;align-items:center;gap:14px;font-size:13px;color:var(--aegean);break-inside:avoid}
.end .dot{width:12px;height:12px;border-radius:50%;background:var(--gold);flex:0 0 auto}

@media (max-width:640px){
  .choices,.fields{grid-template-columns:1fr}
  .doc{padding:32px 22px 28px;font-size:15.5px}
  .cover{min-height:0}
  .cover .logo{margin-bottom:56px}
  .cover h1{font-size:38px}
  .clusterrow{height:130px;margin-top:48px}
  .rsec{margin-top:72px}
  .sechead h2{font-size:28px}
  .crow{grid-template-columns:minmax(0,1fr) auto}
  .crow .track{grid-column:1/-1;grid-row:2}
  .pair{grid-template-columns:1fr;row-gap:48px}
  .row{flex-direction:column}
  .row > .cell.gap{display:none}
  .flow.c2,.flow.c3{column-count:1}
  .quotes .q{font-size:18px}
}
@media print{
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  body,.viewer{background:#fff}
  .setup,.bar,.toast{display:none!important}
  .doc{width:auto;max-width:none;margin:0;padding:0;box-shadow:none;border-radius:0}
  .cover{min-height:6.4in;break-after:page}
  .rsec{margin-top:80px}
  .compact .rsec{margin-top:48px}
  .end{display:none}
  .cover + .rsec{margin-top:0}
}
</style>
<style id="pagebox"></style>
</head>

  <h1>Turn a WBWAI 201 CSV into a report</h1>
  <p class="safe">Works in your browser. The file never leaves this computer.</p>

  <section id="drop" class="drop" aria-label="Workshop CSV">
    <div id="dropEmpty">
      <p class="big">Drop the CSV here</p>
      <button type="button" class="btn out" id="pick">Choose file</button>
    </div>
    <div id="dropLoaded" class="grow" hidden>
      <div class="fname" id="fname"></div>
      <div class="fsum" id="fsum"></div>
    </div>
    <button type="button" class="btn out" id="repick" hidden>Change file</button>
    <input type="file" id="file" accept=".csv,text/csv" hidden>
  </section>
  <p class="err" id="fileErr" role="alert" hidden></p>

  <div class="opts" id="opts" hidden>
    <section>
      <h2>Names</h2>
      <div class="choices" id="names">
        <button type="button" class="choice" data-v="anon" aria-pressed="false">Anonymous</button>
        <button type="button" class="choice" data-v="show" aria-pressed="false">Show names</button>
      </div>
    </section>

    <section>
      <h2>Layout</h2>
      <div class="choices" id="layout">
        <button type="button" class="choice" data-v="comfortable" aria-pressed="false">Comfortable</button>
        <button type="button" class="choice" data-v="compact" aria-pressed="false">Compact</button>
      </div>
    </section>

    <section>
      <h2>Cover</h2>
      <div class="fields">
        <div class="fld wide"><label for="fTitle">Title</label><input id="fTitle" maxlength="120" autocomplete="off"></div>
        <div class="fld"><label for="fOrg">Prepared for</label><input id="fOrg" maxlength="120" autocomplete="off"></div>
        <div class="fld"><label for="fDate">Date</label><input id="fDate" type="date"></div>
      </div>
    </section>

    <section>
      <h2>Include</h2>
      <ul class="acts" id="acts"></ul>
    </section>

    <div class="go">
      <button type="button" class="btn" id="build">Build report</button>
      <p class="err" id="buildErr" role="alert" hidden></p>
    </div>
  </div>
</main>

<div id="viewer" class="viewer" hidden>
  <div class="bar"><div class="in">
    <button type="button" class="btn ghost" id="restart">Start over</button>
    <button type="button" class="btn ghost" id="edit">Edit</button>
    <span class="sp"></span>
    <button type="button" class="btn out" id="copy">Copy for Google Docs</button>
    <button type="button" class="btn" id="print">Save as PDF</button>
  </div></div>
  <div id="stage"></div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<script>
(function () {
  'use strict';

  var LABELS = JSON.parse(document.getElementById('labels').textContent);
  var NOSUB = /^\s*\[?\s*no\s+submission\s*\]?\s*$/i;
  var ID_COL = /^(e-?mail( address)?|name|full name|first name|last name|participant|participant name|user ?id|user ?name)$/i;
  var DOT = ' · ';
  var state = { model: null, fileName: '', names: null, compact: false, include: new Set() };
  var BIG_SESSION = 40; // more people than this starts in the compact layout

  function $(id) { return document.getElementById(id); }

  // Builds DOM nodes. Strings always become text nodes, never HTML.
  function h(tag, props) {
    var el = document.createElement(tag);
    if (props) {
      Object.keys(props).forEach(function (k) {
        var v = props[k];
        if (v === null || v === undefined || v === false) return;
        if (k === 'class') el.className = v;
        else if (k === 'text') el.textContent = v;
        else el.setAttribute(k, v);
      });
    }
    for (var i = 2; i < arguments.length; i++) add(el, arguments[i]);
    return el;
  }
  function add(el, kid) {
    if (kid === null || kid === undefined || kid === false) return;
    if (Array.isArray(kid)) { kid.forEach(function (k) { add(el, k); }); return; }
    el.append(kid instanceof Node ? kid : document.createTextNode(String(kid)));
  }
  // Escapes text for the Google Docs clipboard copy.
  function esc(s) {
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }

  // ---------------------------------------------------------------- CSV
  function parseCSV(text) {
    if (text.charCodeAt(0) === 0xFEFF) text = text.slice(1);
    var first = text.split(/\r?\n/, 1)[0] || '';
    var count = function (ch) { return first.split(ch).length; };
    var d = ',';
    if (count(';') > count(d)) d = ';';
    if (count('\t') > count(d)) d = '\t';
    var rows = [], row = [], field = '', q = false, i = 0, n = text.length;
    while (i < n) {
      var c = text[i];
      if (q) {
        if (c === '"') {
          if (text[i + 1] === '"') { field += '"'; i += 2; continue; }
          q = false; i++; continue;
        }
        field += c; i++; continue;
      }
      if (c === '"') { q = true; i++; continue; }
      if (c === d) { row.push(field); field = ''; i++; continue; }
      if (c === '\r') { i++; continue; }
      if (c === '\n') { row.push(field); rows.push(row); row = []; field = ''; i++; continue; }
      field += c; i++;
    }
    if (field !== '' || row.length) { row.push(field); rows.push(row); }
    return rows;
  }

  // One cell becomes numbered blocks: "1. a,b\n\n2. c" -> [{n:1,text:'a,b'},{n:2,text:'c'}]
  function toBlocks(v) {
    v = String(v || '').replace(/\r\n?/g, '\n').trim();
    if (!v || NOSUB.test(v)) return [];
    var re = /(^|\n[ \t]*\n)[ \t]*(\d{1,2})[.)](?:[ \t]+|(?=\n)|$)/g;
    var marks = [], m, last = 0;
    while ((m = re.exec(v))) {
      var num = +m[2];
      if (num > last) { marks.push({ at: m.index, body: re.lastIndex, n: num }); last = num; }
      if (m[0].length === 0) re.lastIndex++;
    }
    var out = [];
    if (!marks.length) out.push({ n: 1, text: v });
    else {
      if (marks[0].at > 0) out.push({ n: 1, text: v.slice(0, marks[0].at) });
      marks.forEach(function (mk, i) {
        out.push({ n: mk.n, text: v.slice(mk.body, i + 1 < marks.length ? marks[i + 1].at : v.length) });
      });
    }
    return out.map(function (b) { return { n: b.n, text: b.text.trim() }; })
      .filter(function (b) { return b.text && !NOSUB.test(b.text); });
  }

  // A block becomes list items. New lines split items. A comma with no space
  // after it splits items (how the export joins picks); a typed ", " does not.
  function toItems(text) {
    var out = [];
    text.split('\n').forEach(function (line) {
      line = line.replace(/^[ \t]*[-•*·‣▪][ \t]+/, '').trim();
      if (!line) return;
      var merged = [];
      line.split(/,(?=\S)/).forEach(function (p) {
        var prev = merged[merged.length - 1];
        if (prev !== undefined && /\d$/.test(prev) && /^\d{3}(\D|$)/.test(p)) merged[merged.length - 1] = prev + ',' + p;
        else merged.push(p);
      });
      merged.forEach(function (p) { p = p.trim(); if (p && !NOSUB.test(p)) out.push(p); });
    });
    return out;
  }

  function norm(s) { return String(s || '').toLowerCase().replace(/&/g, ' and ').replace(/[^a-z0-9]+/g, ''); }
  function findConf(head) {
    var k = norm(head);
    for (var i = 0; i < LABELS.activities.length; i++) {
      var a = LABELS.activities[i];
      if (a.match.some(function (m) { return norm(m) === k; })) return a;
    }
    return null;
  }

  function buildModel(rows) {
    var header = rows[0] || [];
    var body = rows.slice(1).filter(function (r) { return r.some(function (c) { return String(c).trim(); }); });
    if (header.length < 2 || !body.length) throw new Error('shape');
    var people = body.map(function (r) { return { name: String(r[0] || '').trim(), row: r }; });
    var hasNames = people.some(function (p) { return p.name; });
    people.forEach(function (p) { if (!p.name) p.name = 'No name given'; });
    var acts = [];
    for (var c = 1; c < header.length; c++) {
      var head = String(header[c] || '').trim();
      if (ID_COL.test(head)) continue;
      var col = c;
      if (!head && body.every(function (r) { return !String(r[col] || '').trim(); })) continue;
      acts.push(buildActivity(head || 'Column ' + (c + 1), c, people));
    }
    if (!acts.length) throw new Error('shape');
    return { people: people, acts: acts, hasNames: hasNames };
  }

  function buildActivity(head, c, people) {
    var conf = findConf(head);
    var parsed = people.map(function (p) { return { p: p, blocks: toBlocks(p.row[c]) }; });
    var type = conf ? conf.type : null, style = conf ? conf.style : 'plain';
    if (!type) {
      var multi = parsed.some(function (x) { return x.blocks.some(function (b) { return b.n >= 2; }); });
      var texts = [];
      parsed.forEach(function (x) { x.blocks.forEach(function (b) { texts.push(b.text); }); });
      var avg = texts.length ? texts.reduce(function (s, t) { return s + t.length; }, 0) / texts.length : 0;
      type = multi ? 'lists' : (avg > 70 ? 'entries' : 'items');
      style = 'plain';
    }
    var a = { head: head, col: c, conf: conf, type: type, style: style, headline: conf ? conf.headline : head, total: people.length, answered: 0 };
    if (type === 'choice') buildChoice(a, parsed);
    else if (type === 'entries') buildEntries(a, parsed);
    else buildLists(a, parsed, type === 'items');
    return a;
  }

  function buildChoice(a, parsed) {
    var opts = (a.conf.options || []).map(function (o) {
      return { name: o.name, re: new RegExp(o.match, 'i'), count: 0, names: [] };
    });
    var other = new Map();
    parsed.forEach(function (x) {
      if (!x.blocks.length) return;
      var t = x.blocks[0].text.split('\n')[0].trim();
      if (!t) return;
      a.answered++;
      var o = opts.find(function (o) { return o.re.test(t); });
      if (!o) {
        var k = t.toLowerCase();
        o = other.get(k);
        if (!o) { o = { name: t, count: 0, names: [] }; other.set(k, o); }
      }
      o.count++; o.names.push(x.p.name);
    });
    a.options = opts.concat(Array.from(other.values()));
  }

  // Every entry stays its own line, in the order people wrote them.
  function buildLists(a, parsed, single) {
    var conf = (a.conf && a.conf.lists) || [];
    var lists = [];
    function get(n) {
      var i = single ? 0 : Math.max(0, n - 1);
      if (!lists[i]) lists[i] = { name: single ? '' : (conf[i] || (conf.length ? 'More' : 'Part ' + (i + 1))), items: [] };
      return lists[i];
    }
    if (!single) conf.forEach(function (_, i) { get(i + 1); });
    parsed.forEach(function (x) {
      var any = false;
      x.blocks.forEach(function (b) {
        var list = get(b.n);
        toItems(b.text).forEach(function (t) { any = true; list.items.push({ text: t, name: x.p.name }); });
      });
      if (any) a.answered++;
    });
    a.lists = lists.filter(Boolean);
  }

  function buildEntries(a, parsed) {
    a.entries = [];
    parsed.forEach(function (x) {
      var t = x.blocks.map(function (b) { return b.text; }).join('\n\n').trim();
      if (!t) return;
      a.answered++;
      a.entries.push({ text: t, name: x.p.name });
    });
  }

  // ---------------------------------------------------------------- setup screen
  function answeredText(a) { return a.answered + ' of ' + a.total + ' answered'; }
  function plural(n, one, many) { return n + ' ' + (n === 1 ? one : many); }

  function showError(msg) {
    var e = $('fileErr');
    e.textContent = msg; e.hidden = !msg;
  }

  async function readFile(file) {
    var buf = await file.arrayBuffer();
    var b = new Uint8Array(buf.slice(0, 4));
    if (b[0] === 0x50 && b[1] === 0x4B) throw new Error('xlsx');
    var text = new TextDecoder('utf-8').decode(buf);
    if (text.indexOf('�') !== -1) {
      try { text = new TextDecoder('windows-1252').decode(buf); } catch (e) { /* keep utf-8 */ }
    }
    return text;
  }

  async function loadFile(file) {
    if (!file) return;
    showError('');
    try {
      var text = await readFile(file);
      state.model = buildModel(parseCSV(text));
    } catch (e) {
      state.model = null;
      paintSetup();
      showError(e.message === 'xlsx'
        ? 'This is an Excel file. Export it as CSV and try again.'
        : 'This doesn\'t look like a WBWAI 201 report CSV.');
      return;
    }
    state.fileName = file.name;
    state.names = null;
    state.compact = state.model.people.length > BIG_SESSION;
    state.include = new Set(state.model.acts.filter(function (a) { return a.answered > 0; }).map(function (a) { return a.col; }));
    paintSetup();
  }

  function paintSetup() {
    var m = state.model;
    var loaded = !!m;
    $('drop').classList.toggle('loaded', loaded);
    $('dropEmpty').hidden = loaded;
    $('dropLoaded').hidden = !loaded;
    $('repick').hidden = !loaded;
    $('opts').hidden = !loaded;
    if (!loaded) return;
    $('fname').textContent = state.fileName;
    $('fsum').textContent = plural(m.people.length, 'person', 'people') + DOT + plural(m.acts.length, 'activity', 'activities');

    if (!m.hasNames) state.names = 'anon';
    Array.prototype.forEach.call($('names').children, function (b) {
      b.setAttribute('aria-pressed', String(b.getAttribute('data-v') === state.names));
      b.disabled = !m.hasNames && b.getAttribute('data-v') === 'show';
    });
    $('names').classList.remove('need');
    Array.prototype.forEach.call($('layout').children, function (b) {
      b.setAttribute('aria-pressed', String((b.getAttribute('data-v') === 'compact') === state.compact));
    });
    if (!$('fTitle').value) $('fTitle').value = LABELS.report.defaultTitle;

    var ul = $('acts');
    ul.textContent = '';
    m.acts.forEach(function (a) {
      var box = h('input', { type: 'checkbox' });
      box.checked = state.include.has(a.col);
      box.addEventListener('change', function () {
        if (box.checked) state.include.add(a.col); else state.include.delete(a.col);
      });
      ul.append(h('li', null, h('label', null, box,
        h('span', { class: 'an', text: a.headline }),
        h('span', { class: 'ct', text: a.answered ? a.answered + ' of ' + a.total : 'No answers' }))));
    });
    $('buildErr').hidden = true;
  }

  // ---------------------------------------------------------------- report
  function copyright() { return 'Copyright © ExperiencePoint Inc. ' + new Date().getFullYear() + ', all rights reserved.'; }

  function coverInfo() {
    var title = $('fTitle').value.trim() || LABELS.report.defaultTitle;
    var org = $('fOrg').value.trim();
    var dv = $('fDate').value, dateText = '';
    if (/^\d{4}-\d{2}-\d{2}$/.test(dv)) {
      var p = dv.split('-');
      dateText = new Date(+p[0], +p[1] - 1, +p[2]).toLocaleDateString('en-CA', { year: 'numeric', month: 'long', day: 'numeric' });
    }
    var n = state.model.people.length;
    var meta = [org ? 'Prepared for ' + org : '', dateText, plural(n, 'participant', 'participants')].filter(Boolean);
    return { title: title, org: org, dateText: dateText, meta: meta };
  }

  function selected() {
    return state.model.acts.filter(function (a) { return state.include.has(a.col); });
  }

  function pct(n, d) { return d ? Math.round(n / d * 100) + '%' : '0%'; }

  function median(list) {
    var v = list.map(function (e) { return e.text.length; }).sort(function (a, b) { return a - b; });
    return v.length ? v[Math.floor(v.length / 2)] : 0;
  }

  function renderReport() {
    var show = state.names === 'show';
    var info = coverInfo();
    var doc = h('article', { class: 'doc' + (state.compact ? ' compact' : ''), id: 'report' },
      h('section', { class: 'cover' },
        h('img', { class: 'logo', alt: 'ExperiencePoint', src: $('logo').getAttribute('src') }),
        h('h1', { text: info.title }),
        h('p', { class: 'sub', text: LABELS.report.subtitle }),
        h('div', { class: 'rule' }),
        h('p', { class: 'meta' }, info.meta.map(function (line, i) { return [i ? h('br') : null, line]; })),
        h('div', { class: 'clusterrow', 'aria-hidden': 'true' }, h('div', { class: 'cluster' }, h('i'), h('i'), h('i'), h('i'), h('i')))
      )
    );
    selected().forEach(function (a) { doc.append(renderActivity(a, show)); });
    doc.append(h('footer', { class: 'end' }, h('span', { class: 'dot' }), h('span', { text: copyright() })));
    document.title = ['WBWAI 201 responses', info.org, info.dateText].filter(Boolean).join(' - ');
    return doc;
  }

  function renderActivity(a, show) {
    var sec = h('section', { class: 'rsec' },
      h('header', { class: 'sechead' }, h('h2', { text: a.headline }), h('p', { text: answeredText(a) })));
    if (!a.answered) { sec.append(h('p', { class: 'nothing', text: LABELS.report.nothing })); return sec; }
    if (a.type === 'choice') sec.append(renderChoice(a, show));
    else if (a.type === 'entries') sec.append(renderEntries(a, show));
    else sec.append(renderLists(a, show));
    return sec;
  }

  function renderChoice(a, show) {
    return h('div', { class: 'curve' }, a.options.map(function (o) {
      var fill = h('div', { class: 'fill' });
      fill.style.width = (a.answered ? o.count / a.answered * 100 : 0) + '%';
      return h('div', { class: 'crow' },
        h('div', { class: 'nm', text: o.name }),
        h('div', { class: 'track', role: 'img', 'aria-label': o.name + ': ' + o.count + ' (' + pct(o.count, a.answered) + ')' }, fill),
        h('div', { class: 'num' }, h('b', { text: String(o.count) }), h('span', { text: pct(o.count, a.answered) })),
        show && o.names.length ? h('div', { class: 'who', text: o.names.join(', ') }) : null);
    }));
  }

  // Lays cells out in rows of `per`, as plain blocks, so pages break cleanly between rows.
  function rows(cls, cells, per) {
    if (state.compact) return h('div', { class: cls + ' flow' + (per > 1 ? ' c' + per : ''), role: 'list' }, cells);
    var box = h('div', { class: cls, role: 'list' });
    for (var i = 0; i < cells.length; i += per) {
      var chunk = cells.slice(i, i + per);
      var big = chunk.some(function (c) { return c.classList.contains('big'); });
      var row = h('div', { class: 'row' + (big ? ' big' : '') }, chunk);
      while (row.children.length < per) row.append(h('div', { class: 'cell gap', 'aria-hidden': 'true' }));
      box.append(row);
    }
    return box;
  }

  function itemCell(e, show) {
    return h('div', { class: 'cell' + (e.text.length > 420 ? ' big' : ''), role: 'listitem' }, e.text,
      show ? h('span', { class: 'who', text: e.name }) : null);
  }

  function renderLists(a, show) {
    var sides = ['L', 'R', 'X'];
    var chars = 0, maxN = 0;
    a.lists.forEach(function (l) {
      maxN = Math.max(maxN, l.items.length);
      l.items.forEach(function (e) { chars += e.text.length + 30 + (show ? e.name.length : 0); });
    });
    var single = a.type === 'items';
    var side = !single && a.lists.length === 2 && (state.compact ? maxN <= 10 && chars <= 1100 : maxN <= 6 && chars <= 640);
    var wrap = h('div', { class: 'pair' + (side ? '' : ' stack') });
    a.lists.forEach(function (l, i) {
      var body = l.items.length
        ? rows('items', l.items.map(function (e) { return itemCell(e, show); }), side ? 1 : perRow(l.items, show))
        : h('p', { class: 'nothing', text: 'No answers' });
      wrap.append(h('div', { class: 'list ' + (single ? '' : (sides[i] || 'X')) },
        single ? null : h('h3', { text: l.name }), body));
    });
    return wrap;
  }

  // How many answers sit side by side, based on how long they typically are.
  function perRow(list, show) {
    var m = median(list) + (show && state.compact ? 14 : 0);
    if (state.compact) return list.length >= 9 && m <= 48 ? 3 : list.length >= 4 && m <= 120 ? 2 : 1;
    return list.length >= 6 && m <= 60 ? 2 : 1;
  }

  function templateRe(a) {
    var t = (a.conf && a.conf.template) || [];
    if (!t.length) return null;
    return new RegExp('(' + t.map(function (s) { return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }).join('|') + ')', 'gi');
  }

  function renderEntries(a, show) {
    if (a.style === 'quote') {
      var re = templateRe(a);
      return rows('quotes', a.entries.map(function (e) {
        var q = h('p', { class: 'q' });
        (re ? e.text.split(re) : [e.text]).forEach(function (part, i) {
          if (!part) return;
          q.append(i % 2 ? h('span', { class: 'tp', text: part }) : document.createTextNode(part));
        });
        return h('div', { class: 'cell' + (e.text.length > 420 ? ' big' : ''), role: 'listitem' }, q, show ? h('span', { class: 'who', text: e.name }) : null);
      }), state.compact && a.entries.length >= 4 && median(a.entries) <= 220 ? 2 : 1);
    }
    return h('div', { class: 'list' }, rows('items long', a.entries.map(function (e) { return itemCell(e, show); }), perRow(a.entries, show)));
  }

  // ---------------------------------------------------------------- Google Docs copy
  function docsHTML() {
    var show = state.names === 'show', info = coverInfo();
    var F = 'font-family:Montserrat,Arial,sans-serif;', S = 'font-family:Georgia,serif;', C = 'color:#293851;', A = 'color:#586A90;';
    var o = '<div style="' + F + C + 'font-size:12pt;line-height:1.5">';
    o += '<h1 style="' + S + C + 'font-weight:normal;font-size:30pt;margin:0 0 6pt">' + esc(info.title) + '</h1>';
    o += '<p style="' + S + A + 'font-style:italic;font-size:16pt;margin:0 0 14pt">' + esc(LABELS.report.subtitle) + '</p>';
    o += '<p style="' + F + C + 'font-size:12pt;margin:0 0 20pt">' + info.meta.map(esc).join('<br>') + '</p>';
    function who(name) { return show ? '<br><span style="' + A + 'font-size:10pt">' + esc(name) + '</span>' : ''; }
    selected().forEach(function (a) {
      o += '<h2 style="' + S + C + 'font-weight:normal;font-size:22pt;margin:30pt 0 4pt">' + esc(a.headline) + '</h2>';
      o += '<p style="' + F + A + 'font-size:11pt;margin:0 0 14pt">' + esc(answeredText(a)) + '</p>';
      if (!a.answered) { o += '<p style="' + S + A + 'font-style:italic">' + esc(LABELS.report.nothing) + '</p>'; return; }
      if (a.type === 'choice') {
        o += '<table style="border-collapse:collapse;width:100%;' + F + C + 'font-size:12pt">';
        a.options.forEach(function (x) {
          o += '<tr><td style="padding:8pt 10pt 8pt 0;border-bottom:1px solid #D5D9E3;vertical-align:top">' + esc(x.name) +
            (show && x.names.length ? '<br><span style="' + A + 'font-size:10pt">' + esc(x.names.join(', ')) + '</span>' : '') + '</td>' +
            '<td style="padding:8pt 10pt;border-bottom:1px solid #D5D9E3;text-align:right;vertical-align:top;' + S + 'font-size:16pt">' + x.count + '</td>' +
            '<td style="padding:8pt 0 8pt 10pt;border-bottom:1px solid #D5D9E3;text-align:right;vertical-align:top;' + A + '">' + pct(x.count, a.answered) + '</td></tr>';
        });
        o += '</table>';
      } else if (a.type === 'entries') {
        a.entries.forEach(function (e) {
          var body = esc(e.text).replace(/\n/g, '<br>');
          if (a.style === 'quote') o += '<p style="' + S + C + 'font-size:14pt;line-height:1.5;margin:0 0 12pt">' + body + who(e.name) + '</p>';
          else o += '<p style="' + F + C + 'margin:0 0 8pt">• ' + body + who(e.name) + '</p>';
        });
      } else {
        a.lists.forEach(function (l) {
          if (l.name) o += '<h3 style="' + S + C + 'font-weight:normal;font-size:16pt;margin:18pt 0 6pt">' + esc(l.name) + '</h3>';
          if (!l.items.length) { o += '<p style="' + A + '">No answers</p>'; return; }
          o += '<ul style="margin:0 0 8pt;padding-left:18pt">';
          l.items.forEach(function (e) { o += '<li style="margin:0 0 6pt">' + esc(e.text) + who(e.name) + '</li>'; });
          o += '</ul>';
        });
      }
    });
    o += '<p style="' + F + A + 'font-size:9pt;margin:36pt 0 0">' + esc(copyright()) + '</p></div>';
    return o;
  }

  function docsText() {
    var show = state.names === 'show', info = coverInfo(), t = [];
    t.push(info.title, LABELS.report.subtitle, '');
    info.meta.forEach(function (m) { t.push(m); });
    selected().forEach(function (a) {
      t.push('', '', a.headline, answeredText(a), '');
      var who = function (n) { return show ? ' (' + n + ')' : ''; };
      if (!a.answered) t.push(LABELS.report.nothing);
      else if (a.type === 'choice') a.options.forEach(function (o) { t.push(o.name + ': ' + o.count + ' (' + pct(o.count, a.answered) + ')' + (show && o.names.length ? ' ' + o.names.join(', ') : '')); });
      else if (a.type === 'entries') a.entries.forEach(function (e) { t.push('- ' + e.text + who(e.name)); });
      else a.lists.forEach(function (l) {
        if (l.name) t.push(l.name);
        l.items.forEach(function (e) { t.push('- ' + e.text + who(e.name)); });
        t.push('');
      });
    });
    t.push('', copyright());
    return t.join('\n');
  }

  var toastTimer;
  function toast(msg) {
    var el = $('toast');
    el.textContent = msg; el.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { el.hidden = true; }, 3200);
  }

  async function copyDocs() {
    var html = docsHTML(), text = docsText();
    try {
      await navigator.clipboard.write([new ClipboardItem({
        'text/html': new Blob([html], { type: 'text/html' }),
        'text/plain': new Blob([text], { type: 'text/plain' })
      })]);
      toast('Copied. Paste into a blank Google Doc.');
      return;
    } catch (e) { /* fall back below */ }
    var box = h('div', { 'aria-hidden': 'true' });
    box.setAttribute('style', 'position:fixed;left:-9999px;top:0;width:800px');
    box.innerHTML = html; // every value inside html went through esc()
    document.body.append(box);
    var range = document.createRange();
    range.selectNodeContents(box);
    var sel = window.getSelection();
    sel.removeAllRanges(); sel.addRange(range);
    var ok = false;
    try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
    sel.removeAllRanges(); box.remove();
    toast(ok ? 'Copied. Paste into a blank Google Doc.' : 'Copy didn\'t work in this browser. Try Chrome.');
  }

  // ---------------------------------------------------------------- flow
  function build() {
    if (!state.names) {
      $('names').classList.add('need');
      $('buildErr').textContent = 'Choose Anonymous or Show names.';
      $('buildErr').hidden = false;
      $('names').scrollIntoView({ behavior: 'smooth', block: 'center' });
      return;
    }
    if (!selected().length) {
      $('buildErr').textContent = 'Tick at least one activity.';
      $('buildErr').hidden = false;
      return;
    }
    $('buildErr').hidden = true;
    // Portrait on any paper size. An empty top box stops the browser printing its own date and title line.
    $('pagebox').textContent =
      '@page{size:portrait;margin:20mm 20mm 22mm 20mm;' +
      '@top-center{content:""}' +
      '@bottom-left{content:"' + copyright() + '";font-family:Montserrat,Arial,sans-serif;font-size:8pt;font-weight:500;color:#586A90}' +
      '@bottom-right{content:counter(page);font-family:Montserrat,Arial,sans-serif;font-size:8pt;font-weight:600;color:#586A90}}' +
      '@page:first{@bottom-right{content:none}}';
    var stage = $('stage');
    stage.textContent = '';
    stage.append(renderReport());
    $('setup').hidden = true;
    $('viewer').hidden = false;
    window.scrollTo(0, 0);
  }

  function backToSetup() {
    $('viewer').hidden = true;
    $('setup').hidden = false;
    document.title = 'WBWAI 201 Report Builder';
    window.scrollTo(0, 0);
  }

  function restart() {
    state.model = null; state.names = null; state.fileName = '';
    $('file').value = ''; $('fOrg').value = ''; $('fDate').value = ''; $('fTitle').value = '';
    $('stage').textContent = '';
    $('pagebox').textContent = '';
    showError('');
    paintSetup();
    backToSetup();
  }

  // Keep a stray drop anywhere on the page from opening the file in the browser.
  ['dragover', 'drop'].forEach(function (ev) {
    window.addEventListener(ev, function (e) { e.preventDefault(); });
  });
  var drop = $('drop');
  ['dragenter', 'dragover'].forEach(function (ev) {
    drop.addEventListener(ev, function (e) { e.preventDefault(); drop.classList.add('over'); });
  });
  ['dragleave', 'drop'].forEach(function (ev) {
    drop.addEventListener(ev, function () { drop.classList.remove('over'); });
  });
  drop.addEventListener('drop', function (e) {
    e.preventDefault();
    var f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
    if (f) loadFile(f);
  });
  window.addEventListener('drop', function (e) {
    if (!$('setup').hidden) {
      var f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
      if (f && !drop.contains(e.target)) loadFile(f);
    }
  });
  $('pick').addEventListener('click', function () { $('file').click(); });
  $('repick').addEventListener('click', function () { $('file').value = ''; $('file').click(); });
  $('file').addEventListener('change', function () { loadFile(this.files[0]); });
  Array.prototype.forEach.call($('names').children, function (b) {
    b.addEventListener('click', function () {
      state.names = b.getAttribute('data-v');
      $('names').classList.remove('need');
      $('buildErr').hidden = true;
      Array.prototype.forEach.call($('names').children, function (x) { x.setAttribute('aria-pressed', String(x === b)); });
    });
  });
  Array.prototype.forEach.call($('layout').children, function (b) {
    b.addEventListener('click', function () {
      state.compact = b.getAttribute('data-v') === 'compact';
      Array.prototype.forEach.call($('layout').children, function (x) { x.setAttribute('aria-pressed', String(x === b)); });
    });
  });
  $('build').addEventListener('click', build);
  $('edit').addEventListener('click', backToSetup);
  $('restart').addEventListener('click', restart);
  $('copy').addEventListener('click', copyDocs);
  $('print').addEventListener('click', function () {
    var go = function () { window.print(); };
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(go); else go();
  });
  paintSetup();
})();
