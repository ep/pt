<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Show Me</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/svg+xml" href="/pt/assets/favicon/favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="/pt/assets/favicon/favicon-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="/pt/assets/favicon/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Caveat:wght@400;600&display=swap">
<style>
:root{
  --gold:#FFCC00; --wheat:#FFE165; --pollen:#FEF6C9; --sun:#F2C94C;
  --cobalt:#293851; --aegean:#586A90; --pigeon:#D5D9E3; --mist:#EEF0F5;
  --coastal:#68BFBD; --glacier:#B3DFDE; --slush:#E4F4F4; --teal:#3E8E8C;
  --prairie:#D86527; --dust:#EBB293; --blush:#F6E2D5; --clay:#B14E1C;
  --fern:#90B210; --moss:#C7D887; --leaf:#E9F0CF; --fernInk:#5C7500;
  --paper:#FFFFFF; --warm:#FBF8F3; --editorial:#F9F6F6; --line:rgba(41,56,81,.14);
  --sans:'Montserrat','Gotham',Arial,sans-serif; --serif:Georgia,'Gelasio','Times New Roman',serif; --hand:'Caveat',cursive;
  --spring:cubic-bezier(.22,1,.36,1); --ease:cubic-bezier(.33,1,.68,1);
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;}
body{font-family:var(--sans);color:var(--cobalt);background:var(--warm);line-height:1.15;-webkit-font-smoothing:antialiased;}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;}
:focus-visible{outline:3px solid var(--gold);outline-offset:3px;border-radius:6px;}
svg{display:block;}
.blink{animation:blink 1.05s steps(1) infinite;}
@keyframes blink{50%{opacity:0;}}
@media (prefers-reduced-motion: reduce){ *,*::before,*::after{animation:none !important;transition:none !important;} }

body{background:#ECEAE6;min-height:100%;display:flex;flex-direction:column;}
.wrap{flex:1;display:grid;place-items:center;padding:16px 16px 0;}
.stage{container-type:inline-size;width:min(100%, calc((100dvh - 92px) * 16 / 9));aspect-ratio:16/9;background:var(--paper);border-radius:10px;box-shadow:0 12px 40px rgba(41,56,81,.10);position:relative;overflow:hidden;}
.slide{position:absolute;inset:0;padding:3.4cqw 5cqw 3.4cqw;display:flex;flex-direction:column;}
.top{display:flex;align-items:center;justify-content:space-between;gap:2cqw;}
.tabs{display:flex;gap:.4cqw;flex-wrap:wrap;}
.tabs button{font-size:1.15cqw;font-weight:600;color:var(--aegean);padding:.75cqw 1.2cqw;border-radius:999px;}
.tabs button[aria-pressed="true"]{background:var(--mist);color:var(--cobalt);}
.clockbox{display:flex;align-items:center;gap:1cqw;opacity:0;transition:opacity .3s;}
.clockbox.on{opacity:1;}
.clockbox svg{width:3.4cqw;height:3.4cqw;}
.clockbox b{font-family:var(--serif);font-weight:400;font-size:2.6cqw;font-variant-numeric:tabular-nums;min-width:6cqw;}
.pair{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:3cqw;align-items:center;min-height:0;}
.side{display:flex;flex-direction:column;gap:1.6cqw;}
.panel{position:relative;aspect-ratio:16/10.4;border-radius:1.2cqw;overflow:hidden;}
.panel svg.sc{position:absolute;inset:0;width:100%;height:100%;}
.dont .panel{background:var(--blush);} .do .panel{background:var(--leaf);}
.mark{position:absolute;left:1.4cqw;top:1.4cqw;width:3.4cqw;height:3.4cqw;border-radius:50%;display:grid;place-items:center;z-index:2;}
.mark svg{width:56%;height:56%;}
.dont .mark{background:var(--prairie);} .do .mark{background:var(--fern);}
.cap{font-family:var(--serif);font-style:italic;font-size:2.15cqw;line-height:1.2;text-wrap:balance;}
.dont .cap{color:var(--clay);} .do .cap{color:var(--fernInk);}
.foot{display:flex;justify-content:space-between;align-items:center;margin-top:1.6cqw;}
.foot p{font-size:1.15cqw;font-weight:500;color:var(--aegean);}
.replay{font-size:1.1cqw;font-weight:600;color:var(--cobalt);padding:.7cqw 1.3cqw;border-radius:999px;border:.14cqw solid var(--line);}
.replay:hover{background:var(--mist);}
@media (prefers-reduced-motion: reduce){ .rm-hide{display:none;} }
@media (max-width: 760px){
  .wrap{padding:12px 12px 0;}
  .stage{width:100%;aspect-ratio:auto;container-type:normal;}
  .slide{position:relative;padding:18px;}
  .top{flex-direction:column;align-items:flex-start;gap:10px;}
  .tabs button{font-size:13px;padding:8px 12px;}
  .clockbox svg{width:30px;height:30px;} .clockbox b{font-size:24px;min-width:56px;}
  .pair{grid-template-columns:1fr;gap:22px;margin-top:16px;}
  .side{gap:10px;} .panel{border-radius:12px;} .mark{width:34px;height:34px;left:10px;top:10px;}
  .cap{font-size:19px;} .foot{margin-top:18px;gap:12px;} .foot p{font-size:13px;} .replay{font-size:13px;padding:10px 16px;}
}
</style>
<style id="dyn"></style>
</head>
<body>
<main class="wrap"><section class="stage"><div class="slide">
  <div class="top"><div class="tabs" id="tabs" role="group" aria-label="Behavior"></div>
    <div class="clockbox" id="clockbox" aria-hidden="true"><svg viewBox="0 0 40 40"><circle cx="20" cy="20" r="17" fill="#fff" stroke="#293851" stroke-width="2.6"/><line id="hand" x1="20" y1="20" x2="20" y2="7" stroke="#D86527" stroke-width="2.8" stroke-linecap="round"/><circle cx="20" cy="20" r="2.4" fill="#293851"/></svg><b id="clk">0:00</b></div></div>
  <div class="pair">
    <div class="side dont"><div class="panel"><span class="mark" aria-label="Not this"><svg viewBox="0 0 20 20"><path d="M5 5l10 10M15 5L5 15" stroke="#fff" stroke-width="3" stroke-linecap="round"/></svg></span><div id="L"></div></div><p class="cap" id="cl"></p></div>
    <div class="side do"><div class="panel"><span class="mark" aria-label="This"><svg viewBox="0 0 20 20"><path d="M4.5 10.5l3.6 3.6L15.5 6.5" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg></span><div id="R"></div></div><p class="cap" id="cr"></p></div>
  </div>
  <div class="foot"><p id="where"></p><button class="replay" id="replay">Play again</button></div>
</div></section></main>
<script>
/* ===== EP instruction kit: palette, illustration primitives, scenes, activity data ===== */
const C = {
  gold:'#FFCC00', wheat:'#FFE165', pollen:'#FEF6C9', sun:'#F2C94C',
  cobalt:'#293851', aegean:'#586A90', pigeon:'#D5D9E3', mist:'#EEF0F5',
  coastal:'#68BFBD', glacier:'#B3DFDE', slush:'#E4F4F4', teal:'#3E8E8C',
  prairie:'#D86527', dust:'#EBB293', blush:'#F6E2D5', clay:'#B14E1C',
  fern:'#90B210', moss:'#C7D887', leaf:'#E9F0CF', fernInk:'#5C7500',
  paper:'#FFFFFF', warm:'#FBF8F3', editorial:'#F9F6F6'
};
/* Who is doing it. Color of the people in every picture. */
const WHO = {
  you:  { body:C.coastal, hair:C.teal,  ink:C.teal,  tint:C.slush,  word:'On your own' },
  team: { body:C.prairie, hair:C.clay,  ink:C.clay,  tint:C.blush,  word:'With your team' },
  room: { body:C.aegean,  hair:C.cobalt,ink:C.cobalt,tint:C.mist,   word:'Everyone' }
};
/* where the work happens. Everyone has their own laptop the whole time. */
const WHERE = {
  head: 'On your own',
  talk: 'out loud',
  chart:'on the flip chart',
  ai:   'in your AI tool',
  app:  'in the workshop app'
};
const HAND = "Caveat, 'Segoe Print', cursive";

/* ---------- primitives ---------- */
function hairPath(k, c){
  switch(k){
    case 1: return `<path d="M-15.6-61C-16.5-75-7-81 1-80.5 11-80 17.2-73 15.6-62 11-68.5 4-71-2-70.4-8.5-69.8-12.6-66.4-15.6-61Z" fill="${c}"/>`;
    case 2: return `<circle cx="0" cy="-82.5" r="6.5" fill="${c}"/><path d="M-15.6-61C-16.5-75-7-80.5 0-80.5 8-80.5 16.8-75 15.6-61 11-68 5-70.5 0-70.5-5-70.5-11-68-15.6-61Z" fill="${c}"/>`;
    case 3: return `<path d="M-15.8-59C-17.5-77-7-81.5 0-81.5 8-81.5 17.5-77 15.8-59L17-45C12.5-46.5 10.2-50 10.4-56 9.6-66.5-9.6-66.5-10.4-56-10.2-50-12.5-46.5-17-45Z" fill="${c}"/>`;
    case 4: return [[-13,-69],[-8.5,-76],[0,-79],[8.5,-76],[13,-69]].map(([x,y])=>`<circle cx="${x}" cy="${y}" r="6.8" fill="${c}"/>`).join('');
    case 5: return `<path d="M-15.4-63C-15-73-9-78.6 0-78.6 9-78.6 15-73 15.4-63L12-66.5 6-63.5 0-67.5-6-63.5-12-66.5Z" fill="${c}"/>`;
    default: return '';
  }
}
/* person: x,y = bottom centre of the torso. arms: [[side, hx, hy], ...] hands relative to person */
function person(x, y, o={}){
  const s = o.s || 1, w = WHO[o.who||'you'];
  const body = o.body || w.body, hair = o.hairC || w.hair;
  let g = `<g transform="translate(${x} ${y}) scale(${s})" class="${o.cls||''}">`;
  g += `<path d="M-28 0V-24C-28-38-18-46-5-46H5C18-46 28-38 28-24V0Z" fill="${body}"/>`;
  g += `<circle cx="0" cy="-63" r="15.2" fill="${body}"/>`;
  g += hairPath(o.hair ?? 1, hair);
  (o.arms||[]).forEach(([side,ax,ay,cls])=>{
    const hx = (ax-x)/s, hy = (ay-y)/s;
    const sx = side==='L' ? -20 : 20, sy = -35;
    const bend = side==='L' ? -1 : 1;
    const mx = (sx+hx)/2 + bend*7, my = (sy+hy)/2 + 9;
    const d = `M${sx} ${sy}Q${mx} ${my} ${hx} ${hy}`;
    g += `<g class="${cls||''}"><path d="${d}" stroke="#fff" stroke-width="14.5" fill="none" stroke-linecap="round"/>`;
    g += `<path d="${d}" stroke="${body}" stroke-width="10" fill="none" stroke-linecap="round"/>`;
    g += `<circle cx="${hx}" cy="${hy}" r="6.6" fill="${body}" stroke="#fff" stroke-width="2.2"/></g>`;
  });
  return g + `</g>`;
}
function floor(cx, cy, rx, ry=9){ return `<ellipse cx="${cx}" cy="${cy}" rx="${rx}" ry="${ry}" fill="${C.cobalt}" opacity=".06"/>`; }
function lines(x, y, w, n, gap=6, c=C.pigeon, sw=2.4){
  let g=''; for(let i=0;i<n;i++){ const ww = i===n-1 ? w*0.62 : w; g += `<line x1="${x}" y1="${y+i*gap}" x2="${x+ww}" y2="${y+i*gap}" stroke="${c}" stroke-width="${sw}" stroke-linecap="round"/>`; } return g;
}
function txt(x, y, t, o={}){
  return `<text x="${x}" y="${y}" font-family="${o.f||HAND}" font-size="${o.fs||15}" fill="${o.c||C.cobalt}" text-anchor="${o.a||'middle'}" font-weight="${o.w||400}" ${o.rot?`transform="rotate(${o.rot} ${x} ${y})"`:''} class="${o.cls||''}">${t}</text>`;
}

/* screen contents. x,y,w,h is the inner screen */
const SCREENS = {
  blank(){ return ''; },
  app(x,y,w,h,o={}){
    let g = `<rect x="${x}" y="${y}" width="${w}" height="${h*0.17}" fill="${C.gold}"/>`;
    g += `<circle cx="${x+9}" cy="${y+h*0.085}" r="3" fill="#fff"/>`;
    const rows = o.rows || 3, top = y+h*0.27, rh = h*0.16, gap = h*0.055;
    for(let i=0;i<rows;i++){
      const ry = top + i*(rh+gap);
      g += `<rect x="${x+9}" y="${ry}" width="${w-18}" height="${rh}" rx="3" fill="#fff" stroke="${C.pigeon}" stroke-width="1.6"/>`;
      if(i < (o.filled??1)) g += lines(x+15, ry+rh/2, (w-34)*(i%2?0.7:0.9), 1, 0, C.aegean, 2);
      if(i === (o.filled??1)) g += `<rect class="blink" x="${x+15}" y="${ry+rh*0.22}" width="2.2" height="${rh*0.56}" fill="${C.cobalt}"/>`;
    }
    return g;
  },
  lists(x,y,w,h,o={}){
    let g = `<rect x="${x}" y="${y}" width="${w}" height="${h*0.17}" fill="${C.gold}"/><circle cx="${x+9}" cy="${y+h*0.085}" r="3" fill="#fff"/>`;
    const cw = (w-27)/2;
    [[x+9, o.l||C.slush, o.lk||C.coastal],[x+18+cw, o.r||C.blush, o.rk||C.prairie]].forEach(([cx,fill,k],j)=>{
      g += `<rect x="${cx}" y="${y+h*0.26}" width="${cw*0.55}" height="4" rx="2" fill="${k}"/>`;
      const n = j===0 ? (o.nl??3) : (o.nr??2);
      for(let i=0;i<n;i++) g += `<rect x="${cx}" y="${y+h*0.38+i*h*0.17}" width="${cw}" height="${h*0.12}" rx="2.5" fill="${fill}"/>`;
    });
    return g;
  },
  chooser(x,y,w,h){
    let g = `<rect x="${x}" y="${y}" width="${w}" height="${h*0.17}" fill="${C.gold}"/><circle cx="${x+9}" cy="${y+h*0.085}" r="3" fill="#fff"/>`;
    const tw=(w-18-8)/3, th=h*0.28;
    for(let i=0;i<6;i++){ const cx=x+9+(i%3)*(tw+4), cy=y+h*0.27+Math.floor(i/3)*(th+5);
      const sel = i===1; g += `<rect x="${cx}" y="${cy}" width="${tw}" height="${th}" rx="3" fill="${sel?C.cobalt:'#fff'}" stroke="${sel?C.cobalt:C.pigeon}" stroke-width="1.6"/>`;
      g += `<circle cx="${cx+tw/2}" cy="${cy+th/2}" r="${th*0.17}" fill="${sel?'#fff':C.pigeon}"/>`; }
    return g;
  },
  ai(x,y,w,h,o={}){
    let g = `<rect x="${x}" y="${y}" width="${w}" height="${h*0.12}" fill="${C.mist}"/>`;
    g += `<rect x="${x+w*0.38}" y="${y+h*0.2}" width="${w*0.55}" height="${h*0.2}" rx="6" fill="${C.pigeon}"/>`;
    g += lines(x+w*0.43, y+h*0.27, w*0.42, 2, h*0.07, '#fff', 2);
    const av = o.robot ? robotMini(x+w*0.12, y+h*0.6, h*0.12) : `<circle cx="${x+w*0.12}" cy="${y+h*0.6}" r="${h*0.08}" fill="${C.coastal}"/>`;
    g += av + `<rect x="${x+w*0.22}" y="${y+h*0.48}" width="${w*0.62}" height="${h*0.36}" rx="6" fill="${C.slush}"/>`;
    g += lines(x+w*0.27, y+h*0.57, w*0.5, 3, h*0.085, C.coastal, 2);
    if(o.shot) g += `<rect x="${x+w*0.42}" y="${y+h*0.17}" width="${w*0.2}" height="${h*0.13}" rx="2" fill="${C.aegean}" opacity=".55"/>`;
    return g;
  },
  value(x,y,w,h){
    let g = `<rect x="${x}" y="${y}" width="${w}" height="${h*0.17}" fill="${C.gold}"/><circle cx="${x+9}" cy="${y+h*0.085}" r="3" fill="#fff"/>`;
    g += `<rect x="${x+9}" y="${y+h*0.3}" width="${w-18}" height="${h*0.52}" rx="3" fill="#fff" stroke="${C.pigeon}" stroke-width="1.6"/>`;
    g += txt(x+15, y+h*0.48, 'My role exists to', {fs:h*0.12, a:'start', c:C.aegean});
    g += lines(x+15, y+h*0.6, w*0.55, 1, 0, C.cobalt, 1.6);
    g += txt(x+15, y+h*0.75, 'so that', {fs:h*0.12, a:'start', c:C.aegean});
    g += `<rect class="blink" x="${x+15+h*0.38}" y="${y+h*0.66}" width="2" height="${h*0.12}" fill="${C.cobalt}"/>`;
    return g;
  },
  two(x,y,w,h){
    let g = `<rect x="${x}" y="${y}" width="${w}" height="${h*0.17}" fill="${C.gold}"/><circle cx="${x+9}" cy="${y+h*0.085}" r="3" fill="#fff"/>`;
    const cw=(w-24)/2;
    g += `<rect x="${x+9}" y="${y+h*0.3}" width="${cw}" height="${h*0.5}" rx="4" fill="${C.blush}"/>`;
    g += `<rect x="${x+15+cw}" y="${y+h*0.3}" width="${cw}" height="${h*0.5}" rx="4" fill="${C.slush}"/>`;
    g += lines(x+15, y+h*0.45, cw-14, 2, h*0.11, C.prairie, 2);
    g += `<rect class="blink" x="${x+21+cw}" y="${y+h*0.38}" width="2" height="${h*0.13}" fill="${C.cobalt}"/>`;
    return g;
  },
  storyboard(x,y,w,h){
    let g = `<rect x="${x}" y="${y}" width="${w}" height="${h*0.12}" fill="${C.mist}"/>`;
    const fw=(w-24)/2, fh=(h*0.8-10)/2;
    for(let i=0;i<4;i++){ g += `<rect x="${x+8+(i%2)*(fw+8)}" y="${y+h*0.17+Math.floor(i/2)*(fh+6)}" width="${fw}" height="${fh}" rx="2" fill="${C.glacier}"/>`; }
    return g;
  }
};
function laptop(x, y, o={}){
  const w = o.w||140, h = Math.round(w*0.62), top = y-8-h;
  let g = `<g class="${o.cls||''}">`;
  if(o.glow) g += `<rect x="${x-w/2-7}" y="${top-7}" width="${w+14}" height="${h+14}" rx="12" fill="${C.gold}" opacity=".35"/>`;
  g += `<rect x="${x-w/2}" y="${top}" width="${w}" height="${h}" rx="7" fill="${C.cobalt}"/>`;
  g += `<rect x="${x-w/2+5}" y="${top+5}" width="${w-10}" height="${h-10}" rx="3" fill="#fff"/>`;
  g += `<g clip-path="none">${(SCREENS[o.screen||'blank'])(x-w/2+5, top+5, w-10, h-10, o)}</g>`;
  g += `<path d="M${x-w/2-12} ${y-8}H${x+w/2+12}L${x+w/2+5} ${y}H${x-w/2-5}Z" fill="${C.pigeon}" stroke="${C.cobalt}" stroke-width="2" stroke-linejoin="round"/>`;
  return g + `</g>`;
}
/* laptop seen from behind (lid), for "everyone at their own laptop" */
function lid(x, y, o={}){
  const w=o.w||62, h=w*0.62;
  return `<g class="${o.cls||''}"><rect x="${x-w/2}" y="${y-h}" width="${w}" height="${h}" rx="5" fill="${o.fill||C.pigeon}" stroke="${C.cobalt}" stroke-width="2"/>`+
    (o.icon==='robot' ? robotMini(x, y-h/2, h*0.26) : `<circle cx="${x}" cy="${y-h/2}" r="3.2" fill="#fff"/>`)+
    `<rect x="${x-w/2-5}" y="${y}" width="${w+10}" height="5" rx="2.5" fill="${C.cobalt}"/></g>`;
}
function flipchart(x, y, o={}){
  const w=o.w||118, h=o.h||104, top=y-h-30;
  let g = `<g class="${o.cls||''}">`;
  g += `<line x1="${x-w/2+14}" y1="${top+h-4}" x2="${x-w/2-2}" y2="${y}" stroke="${C.cobalt}" stroke-width="3" stroke-linecap="round"/>`;
  g += `<line x1="${x+w/2-14}" y1="${top+h-4}" x2="${x+w/2+2}" y2="${y}" stroke="${C.cobalt}" stroke-width="3" stroke-linecap="round"/>`;
  g += `<line x1="${x}" y1="${top+h-4}" x2="${x}" y2="${y-4}" stroke="${C.cobalt}" stroke-width="3" stroke-linecap="round"/>`;
  g += `<rect x="${x-w/2}" y="${top}" width="${w}" height="${h}" rx="3" fill="#fff" stroke="${C.cobalt}" stroke-width="2.5"/>`;
  g += `<rect x="${x-w/2-5}" y="${top-6}" width="${w+10}" height="9" rx="4" fill="${C.cobalt}"/>`;
  const p=8, gap=6, fw=(w-2*p-gap)/2, fh=(h-2*p-gap)/2;
  const frames = o.frames ?? 0;
  for(let i=0;i<4;i++){
    const fx = x-w/2+p+(i%2)*(fw+gap), fy = top+p+Math.floor(i/2)*(fh+gap);
    const on = i < frames;
    g += `<g class="fr fr${i}"><rect x="${fx}" y="${fy}" width="${fw}" height="${fh}" rx="2" fill="${on?C.glacier:'none'}" stroke="${on?'none':C.pigeon}" stroke-width="1.5" stroke-dasharray="${on?'':'3 3'}"/>`;
    if(on && o.labels && o.labels[i]) g += txt(fx+fw/2, fy+fh/2+4, o.labels[i], {fs:o.lfs||11});
    else if(on) g += doodle(i, fx, fy, fw, fh);
    g += `</g>`;
    const m = o.marks && o.marks[i];
    if(m==='f') g += `<g class="mk mk${i}">${burst(fx+4, fy+4, 8.5)}</g>`;
    if(m==='j') g += `<g class="mk mk${i}">${gavel(fx+4, fy+4, 8.5)}</g>`;
    if(m==='fj') g += `<g class="mk mk${i}">${burst(fx+4, fy+4, 8.5)}${gavel(fx+fw-4, fy+fh-4, 8.5)}</g>`;

function whereOf(step, setting){ return (setting && setting.delivery==='virtual' && step.vwhere) || step.where; }
function stepLine(step, setting){
  if(step.line) return step.line;
  const w = whereOf(step, setting);
  if(step.who==='you'){
    if(w==='head') return 'On your own';
    if(w==='ai') return 'On your own, in your AI tool';
    if(w==='app') return 'On your own, in the workshop app';
  }
  if(step.who==='team'){
    if(w==='talk') return 'With your team, out loud';
    if(w==='chart') return 'Together, on the flip chart';
    if(w==='ai') return 'Together, in one AI chat';
  }
  return WHO[step.who].word;
}
/* the big switch line, said with a little personality */
function cue(step, prev, setting){
  if(!step) return 'Time! Pens down, eyes up.';
  const w = whereOf(step, setting);
  const fromTeam = prev && prev.who==='team';
  if(w==='app') return fromTeam ? 'Everyone, back to the workshop app.' : 'Workshop app time. Type it in.';
  if(step.who==='team' && w==='talk') return prev ? 'Eyes up. Your team needs you.' : 'Turn to your team.';
  if(step.who==='team' && w==='chart') return 'Grab a marker. Make it messy.';
  if(step.who==='team' && w==='ai') return 'One screen, everyone’s ideas.';
  if(step.who==='you' && w==='ai') return fromTeam ? 'Split up. Over to your AI tool.' : 'Over to your AI tool.';
  return 'Quiet time. Think on your own.';
}

/* ---------- sound: mallets, bells, glass, wood and air, with a little room around them ---------- */
const Sound = (()=>{
  let ctx = null, on = true, bus = null, verb = null, run = 0, runAt = 0;
  const PENTA = [261.63,293.66,329.63,392,440,523.25,587.33,659.25,783.99,880,1046.5,1174.66,1318.51,1567.98];
  function ac(){
    if(!ctx){ try{ ctx = new (window.AudioContext||window.webkitAudioContext)();
      bus = ctx.createGain(); bus.gain.value = .9; bus.connect(ctx.destination);
      verb = ctx.createConvolver(); const n = ctx.sampleRate*1.8, ir = ctx.createBuffer(2, n, ctx.sampleRate);
      for(let c=0;c<2;c++){ const d = ir.getChannelData(c); for(let i=0;i<n;i++) d[i] = (Math.random()*2-1)*Math.pow(1-i/n, 3.2); }
      verb.buffer = ir; const wet = ctx.createGain(); wet.gain.value = .28; verb.connect(wet); wet.connect(bus);
    }catch(e){ ctx = null; } }
    if(ctx && ctx.state === 'suspended') ctx.resume();
    return ctx;
  }
  function out(pan=0){ const g = ctx.createGain(); let node = g;
    if(ctx.createStereoPanner){ const p = ctx.createStereoPanner(); p.pan.value = pan; g.connect(p); node = p; }
    node.connect(bus); node.connect(verb); return g; }
  function env(g, t0, peak, dur, att=.004){ g.gain.setValueAtTime(.0001, t0); g.gain.exponentialRampToValueAtTime(peak, t0+att); g.gain.exponentialRampToValueAtTime(.0001, t0+dur); }
  function partials(f, t, list, {vol=.2, pan=0, type='sine'}={}){
    const c = ac(); if(!c || !on) return; const t0 = c.currentTime + t, o = out(pan);
    list.forEach(([m, a, d])=>{ const os = c.createOscillator(), g = c.createGain(); os.type = type; os.frequency.value = f*m; env(g, t0, vol*a, d); os.connect(g); g.connect(o); os.start(t0); os.stop(t0+d+.05); });
  }
  const mallet = (f, t=0, o={}) => partials(f, t, [[1,1,o.dur||.9],[3.98,.18,.22],[9.9,.05,.08]], o);
  const bell   = (f, t=0, o={}) => partials(f, t, [[1,1,o.dur||1.8],[2.76,.32,.9],[5.4,.14,.5],[8.93,.06,.3]], {vol:.15, ...o});
  const glass  = (f, t=0, o={}) => partials(f, t, [[1,1,.7],[2.32,.5,.45],[4.25,.25,.3],[6.1,.12,.2]], {vol:.09, ...o});
  function noise(t, dur, f1, f2, vol=.12, q=1.2, pan=0){
    const c = ac(); if(!c || !on) return; const t0 = c.currentTime + t;
    const n = Math.floor(c.sampleRate*dur), buf = c.createBuffer(1, n, c.sampleRate), d = buf.getChannelData(0);
    for(let i=0;i<n;i++) d[i] = Math.random()*2-1;
    const src = c.createBufferSource(); src.buffer = buf; const bp = c.createBiquadFilter(); bp.type = 'bandpass'; bp.Q.value = q;
    bp.frequency.setValueAtTime(f1, t0); bp.frequency.exponentialRampToValueAtTime(f2, t0+dur);
    const g = c.createGain(); g.gain.setValueAtTime(.0001, t0); g.gain.exponentialRampToValueAtTime(vol, t0+dur*.35); g.gain.exponentialRampToValueAtTime(.0001, t0+dur);
    src.connect(bp); bp.connect(g); g.connect(out(pan)); src.start(t0); src.stop(t0+dur);
  }
  function wood(t=0, f=1250, vol=.32){
    const c = ac(); if(!c || !on) return; const t0 = c.currentTime + t, o = out((Math.random()-.5)*.3);
    const os = c.createOscillator(), g = c.createGain(); os.type = 'triangle'; os.frequency.setValueAtTime(f, t0); os.frequency.exponentialRampToValueAtTime(f*.62, t0+.07);
    env(g, t0, vol, .11, .002); os.connect(g); g.connect(o); os.start(t0); os.stop(t0+.15);
    noise(t, .03, 2400, 1800, .06, 2);
  }
  function zap(t=0){
    const c = ac(); if(!c || !on) return; const t0 = c.currentTime + t, o = out(0);
    const os = c.createOscillator(), lp = c.createBiquadFilter(), g = c.createGain(); os.type = 'sawtooth';
    os.frequency.setValueAtTime(140, t0); os.frequency.exponentialRampToValueAtTime(1400, t0+.32);
    lp.type = 'lowpass'; lp.Q.value = 9; lp.frequency.setValueAtTime(300, t0); lp.frequency.exponentialRampToValueAtTime(3800, t0+.32);
    env(g, t0, .08, .42, .01); os.connect(lp); lp.connect(g); g.connect(o); os.start(t0); os.stop(t0+.45);
  }
  const pick = arr => arr[Math.floor(Math.random()*arr.length)];
  return {
    get on(){ return on; }, set on(v){ on = v; },
    wake(){ ac(); },
    /* each thing you add climbs one note higher, so a list sounds like it is growing */
    add(){ const now = performance.now(); run = now - runAt > 6000 ? 0 : Math.min(run+1, 9); runAt = now;
      mallet(PENTA[4+run], 0, {vol:.22, pan:(Math.random()-.5)*.6}); if(run>=5) glass(PENTA[4+run]*2, .05); },
    tap(){ mallet(pick(PENTA.slice(5,10)), 0, {vol:.14, pan:(Math.random()-.5)*.5, dur:.5}); },
    tick(n){ wood(0, n===1 ? 1500 : 1180); },
    go(){ [0,2,4,7].forEach((k,i)=>mallet(PENTA[3+k], i*.06, {vol:.2, pan:(i-1.5)*.25})); glass(1567.98, .26); },
    switchTo(mode){
      noise(0, .55, 380, 3200, .09, .9);
      if(mode==='team') [0,2,4].forEach((k,i)=>mallet(PENTA[k]*.5, .12+i*.09, {vol:.26, dur:1.2, pan:(i-1)*.3}));
      else if(mode==='app') { bell(1046.5, .12); bell(1567.98, .26, {vol:.1}); }
      else [7,9].forEach((k,i)=>mallet(PENTA[k], .12+i*.11, {vol:.2, pan:i?.3:-.3}));
    },
    nudge(){ mallet(PENTA[7], 0, {vol:.12, dur:.4}); mallet(PENTA[9], .1, {vol:.1, dur:.4}); },
    timeUp(){ partials(98, 0, [[1,1,3.4],[1.48,.5,2.6],[2.1,.35,2],[2.83,.22,1.4],[4.1,.1,.9]], {vol:.32}); bell(784, .05, {vol:.1, dur:2.4}); },
    badge(kind){
      if(kind==='gold'){ bell(987.77, 0, {vol:.16, dur:.5}); bell(1318.51, .09, {vol:.18, dur:1.6}); [0,1,2,3,4].forEach(i=>glass(pick(PENTA.slice(9))*2, .25+i*.07, {pan:(Math.random()-.5)})); }
      else if(kind==='alive'){ zap(0); [0,2,4,7].forEach((k,i)=>mallet(PENTA[5+k], .36+i*.08, {vol:.2})); }
      else if(kind==='wrap'){ wood(0, 900, .4); noise(0, .06, 1800, 1200, .12, 1); [0,4,7].forEach((k,i)=>mallet(PENTA[2+k], .18+i*.12, {vol:.22, dur:1.3})); }

/* brand confetti: circles, once */
function confetti(host){
  if(matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const cols=[C.sun,C.coastal,C.prairie,C.sun,C.fern];
  const box=(host||document.body).getBoundingClientRect();
  for(let i=0;i<46;i++){ const d=document.createElement('i'); const s=8+Math.random()*22;
    d.style.cssText=`position:fixed;z-index:60;pointer-events:none;border-radius:50%;width:${s}px;height:${s}px;background:${cols[i%cols.length]};left:${box.left+Math.random()*box.width}px;top:${box.bottom-10}px;opacity:.95;transition:transform ${2.6+Math.random()*1.4}s cubic-bezier(.2,.8,.3,1), opacity 1s ease ${2.4+Math.random()}s;`;
    document.body.appendChild(d);
    requestAnimationFrame(()=>requestAnimationFrame(()=>{ d.style.transform=`translate(${(Math.random()-.5)*360}px, ${-box.height*(0.55+Math.random()*0.5)}px)`; d.style.opacity='0'; }));
    setTimeout(()=>d.remove(),4800);
  }
}

function A(tin, tout=95, kind='pop'){
  const n = 'k'+(++uid), a = Math.max(0, tin-0.01), b = Math.min(99, tin+4), c = Math.max(b, tout), d = Math.min(100, c+3);
  const from = kind==='pop' ? 'opacity:0;transform:scale(.55)' : kind==='flash' ? 'opacity:0' : 'opacity:0;transform:translateY(6px)';
  if(kind==='stay') css += `@keyframes ${n}{0%,${tout}%{opacity:1}${Math.min(100,tout+3)}%,100%{opacity:0}}`;
  else if(kind==='flash') css += `@keyframes ${n}{0%,${a}%{opacity:0}${tin+1}%{opacity:.95}${tin+5}%,100%{opacity:0}}`;
  else css += `@keyframes ${n}{0%,${a}%{${from}}${b}%{opacity:1;transform:none}${c}%{opacity:1;transform:none}${d}%,100%{opacity:0;transform:none}}`;
  css += `.${n}{animation:${n} ${LOOP}s linear infinite both;transform-box:fill-box;transform-origin:center;}`;
  return n;
}

function show(i){
  pi = i; css = ''; uid = 0;
  const p = PAIRS[i];
  document.getElementById('L').innerHTML = p.L();
  document.getElementById('R').innerHTML = p.R();
  document.getElementById('cl').textContent = p.dont;
  document.getElementById('cr').textContent = p.do;
  document.getElementById('where').textContent = p.where;
  document.getElementById('dyn').textContent = css;
  document.getElementById('clockbox').classList.toggle('on', !!p.clock);
  document.querySelectorAll('#tabs button').forEach((b,k)=>b.setAttribute('aria-pressed', k===i));
  restart();
}
function restart(){
  const dyn = document.getElementById('dyn'), keep = dyn.textContent; dyn.textContent = ''; void document.body.offsetWidth; dyn.textContent = keep;
  t0 = performance.now();
}
function tick(now){
  const p = PAIRS[pi];
  if(p.clock){
    const f = ((now - t0)/1000 % LOOP) / LOOP, prog = Math.min(1, f/0.92);
    document.getElementById('clk').textContent = fmt(prog * p.clock);
    const ang = prog * p.clock / 60 * 360;
    const h = document.getElementById('hand'); h.setAttribute('transform', `rotate(${ang.toFixed(1)} 20 20)`);
  }
  requestAnimationFrame(tick);
}
document.getElementById('tabs').innerHTML = PAIRS.map((p,i)=>`<button data-i="${i}">${esc(p.tab)}</button>`).join('');

else { document.getElementById('clockbox').classList.remove('on'); document.getElementById('replay').hidden = true; }
