<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Working with AI</title>
<link rel="icon" type="image/svg+xml" href="/pt/assets/favicon/favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="/pt/assets/favicon/favicon-32.png">
<link rel="shortcut icon" href="/pt/assets/favicon/favicon.ico">
<link rel="apple-touch-icon" sizes="180x180" href="/pt/assets/favicon/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Gelasio:wght@400&display=swap" rel="stylesheet">
<style>
:root{--cobalt:#293851;--aegean:#586A90;--pigeon:#D5D9E3;--gold:#FFCC00;--editorial:#F9F6F6;--sans:'Montserrat',Arial,sans-serif;--serif:Georgia,'Gelasio',serif}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--editorial);color:var(--cobalt);font-family:var(--sans);line-height:1.5}
.wrap{max-width:1200px;margin:0 auto;padding:64px 32px 72px}
h1{font-family:var(--serif);font-weight:400;font-size:clamp(44px,6vw,72px);line-height:1;margin:0;letter-spacing:-.01em}
.lede{font-size:clamp(18px,2vw,21px);color:var(--aegean);max-width:640px;margin:18px 0 48px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:28px}
.tile{display:block;text-align:left;border:0;background:#fff;border-radius:20px;overflow:hidden;cursor:pointer;padding:0;color:inherit;font:inherit;
  box-shadow:0 1px 0 rgba(41,56,81,.06),0 18px 34px -26px rgba(41,56,81,.5);transition:transform .25s,box-shadow .25s}
.tile:hover{transform:translateY(-4px);box-shadow:0 1px 0 rgba(41,56,81,.06),0 26px 40px -24px rgba(41,56,81,.55)}
.tile:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.thumb{aspect-ratio:16/10;position:relative;overflow:hidden}
.thumb svg{position:absolute;inset:0;width:100%;height:100%}
.tile .t{padding:20px 22px 24px}
.tile h2{margin:0;font-size:22px;font-weight:700}
.tile p{margin:4px 0 0;color:var(--aegean);font-size:16px}
.note{margin-top:44px;color:var(--aegean);font-size:15px}
.viewer{position:fixed;inset:0;background:#fff;display:none;flex-direction:column;z-index:10}
.viewer.show{display:flex}
.vbar{height:52px;flex:none;display:flex;align-items:center;gap:16px;padding:0 16px;background:var(--cobalt);color:#fff}
.vbar button{border:0;background:none;color:#fff;font:inherit;font-weight:600;cursor:pointer;padding:8px 6px;font-size:15px}
.vbar .name{font-weight:700;font-size:15px;opacity:.85}
.vbar .nav{margin-left:auto;display:flex;gap:4px}
.vbar .nav button{opacity:.85}
iframe{flex:1;border:0;width:100%;background:#fff}
@media (max-width:640px){.wrap{padding:40px 16px 56px}.grid{grid-template-columns:1fr}.vbar .name{display:none}}
</style>
</head>
<body>
<div class="wrap">
  <h1>Working with AI</h1>
  <p class="lede">Five very different ways to make one guide. Each one has a side for participants and a side for facilitators.</p>
  <div class="grid" id="grid"></div>
  <p class="note">Sketches to react to. The words are shared across all five, so any of them can carry the final copy.</p>
</div>
<div class="viewer" id="viewer" role="dialog" aria-modal="true">
  <div class="vbar"><button type="button" id="back">&larr; All five</button><span class="name" id="vname"></span>
    <div class="nav"><button type="button" id="prev" aria-label="Previous sketch">&larr;</button><button type="button" id="next" aria-label="Next sketch">&rarr;</button></div></div>
  <iframe id="frame" title="Sketch"></iframe>
</div>
<script>
const SKETCHES = [{"id": "meet-your-ai", "name": "Meet your AI", "line": "An anatomy chart. Tap a part, learn the word.", "html": "<!doctype html>\n<html lang=\"en\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<meta name=\"robots\" content=\"noindex, nofollow\">\n<title>Meet your AI<\/title>\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link href=\"https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Gelasio:ital,wght@0,400;0,600;1,400&family=Caveat:wght@500&display=swap\" rel=\"stylesheet\">\n<style>\n:root{\n  --cobalt:#293851; --aegean:#586A90; --pigeon:#D5D9E3; --gold:#FFCC00; --pollen:#FEF6C9;\n  --coastal:#68BFBD; --slush:#E4F4F4; --prairie:#D86527; --dust:#EBB293; --blush:#F6E2D5;\n  --fern:#90B210; --leaf:#E9F0CF; --paper:#fff; --editorial:#F9F6F6;\n  --sans:'Montserrat',Arial,sans-serif; --serif:Georgia,'Gelasio','Times New Roman',serif; --hand:'Caveat',cursive;\n}\n*{box-sizing:border-box}\nhtml,body{margin:0}\nbody{background:var(--editorial);color:var(--cobalt);font-family:var(--sans);line-height:1.5;-webkit-font-smoothing:antialiased}\nbutton{font:inherit;color:inherit}\n\n.top{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:24px 40px 0;max-width:1320px;margin:0 auto}\n.top h1{font-family:var(--serif);font-weight:400;font-size:clamp(30px,4vw,46px);margin:0;letter-spacing:-.01em}\n.right{display:flex;align-items:center;gap:10px}\n.snd{width:44px;height:44px;flex:none;border-radius:50%;border:1.5px solid var(--pigeon);background:var(--paper);color:var(--cobalt);display:flex;align-items:center;justify-content:center;cursor:pointer}\n.snd svg{width:20px;height:20px}\n.snd[aria-pressed=\"false\"]{color:var(--aegean)}\n.sides{display:flex;background:var(--paper);border:1.5px solid var(--pigeon);border-radius:999px;padding:4px}\n.sides button{border:0;background:none;padding:9px 18px;border-radius:999px;cursor:pointer;font-weight:600;font-size:14px;color:var(--aegean);transition:background .2s,color .2s}\n.sides button[aria-pressed=\"true\"]{background:var(--cobalt);color:var(--paper)}\n\n.flip{max-width:1320px;margin:0 auto;padding:8px 40px 64px;perspective:2200px}\n.face-side{transition:transform .6s cubic-bezier(.3,.7,.2,1),opacity .3s}\nbody.fac .front{display:none}\nbody:not(.fac) .back{display:none}\n.enter{animation:enter .55s cubic-bezier(.3,.7,.2,1)}\n@keyframes enter{from{transform:rotateY(-14deg) translateX(30px);opacity:0}to{transform:none;opacity:1}}\n\n/* Anatomy */\n.anatomy{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(300px,1fr);gap:32px;align-items:center;margin-top:8px}\nsvg.fig{width:100%;height:auto;display:block;overflow:visible}\n.fig .lbl{font-family:var(--sans);font-size:19px;font-weight:600;fill:var(--aegean);cursor:pointer;transition:fill .2s}\n.fig .lbl:hover{fill:var(--cobalt)}\n.fig .lbl.on{fill:var(--cobalt);font-weight:800}\n.fig .lead{stroke:var(--aegean);stroke-width:1.2;fill:none}\n.fig .dtag{font-family:var(--sans);font-size:16px;font-weight:600;fill:var(--aegean)}\n.fig .dtag.on{fill:var(--cobalt);font-weight:800}\n.fig .lead-dot{fill:var(--aegean)}\n.part{cursor:pointer;transition:filter .25s}\n.part:hover{filter:drop-shadow(0 0 5px rgba(41,56,81,.25))}\n.part.on{filter:drop-shadow(0 0 2px var(--gold)) drop-shadow(0 0 9px rgba(255,204,0,.95))}\n.part.pulse{filter:drop-shadow(0 0 2px var(--gold)) drop-shadow(0 0 12px rgba(255,204,0,1))}\n.ink{stroke:var(--cobalt);stroke-linejoin:round;stroke-linecap:round}\n\n.panel{background:var(--paper);border-radius:22px;padding:34px 34px 30px;min-height:330px;box-shadow:0 1px 0 rgba(41,56,81,.06),0 18px 40px -24px rgba(41,56,81,.35)}\n.panel h2{font-family:var(--serif);font-weight:400;font-size:40px;line-height:1.1;margin:0}\n.panel .aka{font-weight:600;color:var(--aegean);margin:6px 0 18px;font-size:16px}\n.panel p{font-size:18px;line-height:1.6;margin:0}\n.panel .names{font-family:var(--hand);font-size:24px;color:var(--aegean);margin-top:20px;line-height:1.25}\n.panel-in{animation:fade .35s ease}\n@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}\n\n.index{display:none}\n\n/* Mindsets */\n.mind{margin-top:72px}\n.mind h2,.back h2{font-family:var(--serif);font-weight:400;font-size:34px;margin:0 0 26px}\n.grid6{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}\n.m{background:var(--paper);border-radius:20px;padding:26px 26px 28px;position:relative;overflow:hidden}\n.m .n{font-family:var(--serif);font-size:54px;line-height:1;color:var(--pigeon)}\n.m h3{font-size:20px;margin:14px 0 8px;font-weight:700}\n.m p{margin:0;font-size:16px;line-height:1.6;color:var(--cobalt)}\n.m:nth-child(1){background:var(--slush)} .m:nth-child(2){background:var(--pollen)} .m:nth-child(3){background:var(--blush)}\n.m:nth-child(4){background:var(--leaf)} .m:nth-child(5){background:var(--paper)} .m:nth-child(6){background:var(--paper)}\n.m:nth-child(5) .n,.m:nth-child(6) .n{color:var(--coastal)}\n.short{font-family:var(--serif);font-size:clamp(22px,2.6vw,30px);line-height:1.4;margin:56px 0 0;max-width:900px}\n.short::after{content:\"\";display:inline-block;width:12px;height:12px;border-radius:50%;background:var(--gold);margin-left:8px;vertical-align:middle}\n.foot{margin-top:40px;font-family:var(--hand);font-size:22px;color:var(--aegean)}\n\n/* Facilitator side */\n.moves{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px;margin:18px 0 64px}\n.mv{border-top:4px solid var(--cobalt);padding-top:18px}\n.mv h3{font-family:var(--serif);font-weight:400;font-size:30px;margin:0 0 8px}\n.mv p{margin:0;font-size:17px}\n.prep{font-family:var(--hand);font-size:26px;color:var(--prairie);margin:-36px 0 56px}\n.qa{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:40px;align-items:start}\n.qs{list-style:none;margin:0;padding:0}\n.qs button{display:block;width:100%;text-align:left;border:0;background:none;padding:14px 0;border-bottom:1px solid var(--pigeon);font-size:19px;font-weight:500;cursor:pointer;color:var(--aegean);transition:color .2s,padding .2s}\n.qs button:hover{color:var(--cobalt)}\n.qs button[aria-current=\"true\"]{color:var(--cobalt);font-weight:700;padding-left:14px;box-shadow:inset 4px 0 0 var(--gold)}\n.ans{position:sticky;top:24px;background:var(--paper);border-radius:22px;padding:34px;display:grid;grid-template-columns:minmax(0,1fr) 220px;gap:28px;align-items:start}\n.ans .say{font-family:var(--serif);font-size:26px;line-height:1.45;margin:0}\n.ans .then{margin:22px 0 0;font-size:17px;color:var(--aegean)}\n.ans .then b{color:var(--cobalt)}\n.mini svg{width:100%;height:auto}\n.mini .lbl,.mini .lead,.mini .lead-dot,.mini .dtag,.mini .tag{display:none}\n.mini .part{cursor:default}\n.mini .cap{text-align:center;font-weight:600;font-size:14px;margin-top:6px}\n\n@media (max-width:900px){\n  .top{padding:18px 18px 0;flex-wrap:wrap}\n  .flip{padding:8px 16px 48px}\n  .anatomy{grid-template-columns:1fr;gap:12px}\n  .fig .lbl,.fig .lead,.fig .lead-dot,.fig .dtag,.fig .tag{display:none}\n  .index{display:flex;flex-wrap:wrap;gap:4px 16px;justify-content:center;margin:0 0 14px}\n  .index button{border:0;background:none;padding:6px 2px;font-weight:600;font-size:15px;color:var(--aegean);cursor:pointer}\n  .index button[aria-current=\"true\"]{color:var(--cobalt);box-shadow:inset 0 -3px 0 var(--gold)}\n  .panel{padding:26px 22px;min-height:0}\n  .panel h2{font-size:32px}\n  .grid6,.moves{grid-template-columns:1fr}\n  .qa{grid-template-columns:1fr}\n  .ans{position:static;grid-template-columns:1fr}\n  .mini{max-width:200px}\n}\n@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}\n<\/style>\n<\/head>\n<body>\n<header class=\"top\">\n  <h1>Meet your AI<\/h1>\n  <div class=\"right\">\n    <div class=\"sides\" role=\"group\" aria-label=\"Side\">\n      <button type=\"button\" aria-pressed=\"true\" data-side=\"p\">Participants<\/button>\n      <button type=\"button\" aria-pressed=\"false\" data-side=\"f\">Facilitators<\/button>\n    <\/div>\n    <button class=\"snd\" id=\"snd\" type=\"button\"><\/button>\n  <\/div>\n<\/header>\n\n<main class=\"flip\">\n  <section class=\"front face-side\">\n    <div class=\"anatomy\">\n      <div>\n        <svg class=\"fig\" id=\"fig\" viewBox=\"0 0 940 660\" role=\"img\" aria-label=\"A friendly figure whose parts stand for the parts of an AI tool\">\n          <ellipse cx=\"470\" cy=\"640\" rx=\"300\" ry=\"12\" fill=\"rgba(41,56,81,.08)\"/>\n\n          <g class=\"part\" data-part=\"hands\">\n            <path class=\"ink\" d=\"M392 330 C 330 340, 300 360, 286 392\" stroke-width=\"34\" fill=\"none\"/>\n            <path d=\"M392 330 C 330 340, 300 360, 286 392\" stroke=\"#D5D9E3\" stroke-width=\"24\" fill=\"none\" stroke-linecap=\"round\"/>\n            <path class=\"ink\" d=\"M548 330 C 610 336, 640 352, 652 382\" stroke-width=\"34\" fill=\"none\"/>\n            <path d=\"M548 330 C 610 336, 640 352, 652 382\" stroke=\"#D5D9E3\" stroke-width=\"24\" fill=\"none\" stroke-linecap=\"round\"/>\n          <\/g>\n\n          <g class=\"part\" data-part=\"recipe\">\n            <g transform=\"rotate(-9 232 360)\">\n              <rect class=\"ink\" x=\"190\" y=\"300\" width=\"88\" height=\"112\" rx=\"8\" fill=\"#fff\" stroke-width=\"4\"/>\n              <rect x=\"192\" y=\"302\" width=\"84\" height=\"20\" rx=\"6\" fill=\"#D86527\"/>\n              <path class=\"ink\" d=\"M204 340h58M204 356h48M204 372h56M204 388h36\" stroke-width=\"2.4\"/>\n            <\/g>\n          <\/g>\n\n          <g class=\"part\" data-part=\"keys\">\n            <path class=\"ink\" d=\"M664 414 q4 10 2 18\" stroke-width=\"3\" fill=\"none\"/>\n            <circle class=\"ink\" cx=\"666\" cy=\"440\" r=\"10\" fill=\"none\" stroke-width=\"4\"/>\n            <path class=\"ink\" d=\"M660 448 l-6 26 M654 464h8 M653 470h6\" stroke-width=\"4\" fill=\"none\"/>\n            <path class=\"ink\" d=\"M672 448 l10 22 M678 462l6 -3 M681 468l6 -3\" stroke-width=\"4\" fill=\"none\"/>\n          <\/g>\n\n          <g class=\"part\" data-part=\"hands\">\n            <circle class=\"ink\" cx=\"280\" cy=\"398\" r=\"28\" fill=\"#EBB293\" stroke-width=\"5\"/>\n            <path class=\"ink\" d=\"M262 388 q-10 -4 -12 6\" stroke-width=\"3\" fill=\"none\"/>\n            <circle class=\"ink\" cx=\"656\" cy=\"390\" r=\"28\" fill=\"#EBB293\" stroke-width=\"5\"/>\n            <path class=\"ink\" d=\"M674 380 q10 -4 12 6\" stroke-width=\"3\" fill=\"none\"/>\n          <\/g>\n\n          <g class=\"part\" data-part=\"plug\">\n            <path class=\"ink\" d=\"M690 372 C 720 360, 720 320, 748 300\" stroke-width=\"5\" fill=\"none\"/>\n            <path class=\"ink\" d=\"M690 372 C 730 372, 738 360, 760 360\" stroke-width=\"5\" fill=\"none\"/>\n            <path class=\"ink\" d=\"M690 372 C 720 392, 724 420, 750 424\" stroke-width=\"5\" fill=\"none\"/>\n            <rect class=\"ink\" x=\"676\" y=\"360\" width=\"22\" height=\"26\" rx=\"5\" fill=\"#586A90\" stroke-width=\"4\"/>\n            <rect class=\"ink\" x=\"748\" y=\"280\" width=\"40\" height=\"34\" rx=\"9\" fill=\"#E4F4F4\" stroke-width=\"4\"/>\n            <path class=\"ink\" d=\"M754 288 l14 11 l14 -11\" stroke-width=\"3\" fill=\"none\"/>\n            <rect class=\"ink\" x=\"760\" y=\"342\" width=\"40\" height=\"36\" rx=\"9\" fill=\"#E9F0CF\" stroke-width=\"4\"/>\n            <path class=\"ink\" d=\"M760 352h40M770 338v8M790 338v8\" stroke-width=\"3\"/>\n            <rect class=\"ink\" x=\"750\" y=\"406\" width=\"34\" height=\"40\" rx=\"7\" fill=\"#F6E2D5\" stroke-width=\"4\"/>\n            <path class=\"ink\" d=\"M758 418h18M758 428h18M758 438h12\" stroke-width=\"2.6\"/>\n          <\/g>\n\n          <rect class=\"ink\" x=\"380\" y=\"300\" width=\"180\" height=\"200\" rx=\"38\" fill=\"#D5D9E3\" stroke-width=\"5\"/>\n          <rect class=\"ink\" x=\"448\" y=\"282\" width=\"44\" height=\"22\" rx=\"6\" fill=\"#D5D9E3\" str \n            <path class=\"ink\" d=\"M626 56 l2 16 l-16 2\" stroke-width=\"5\" fill=\"none\"/>\n            <circle cx=\"612\" cy=\"106\" r=\"7\" fill=\"#68BFBD\"/><circle cx=\"634\" cy=\"104\" r=\"7\" fill=\"#D86527\"/><circle cx=\"622\" cy=\"86\" r=\"7\" fill=\"#90B210\"/>\n          <\/g>\n\n          <g id=\"labels\"><\/g>\n        <\/svg>\n        <div class=\"index\" id=\"index\"><\/div>\n      <\/div>\n      <article class=\"panel\" id=\"panel\" aria-live=\"polite\"><\/article>\n    <\/div>\n\n    <section class=\"mind\">\n      <h2>Six ways to think about it<\/h2>\n      <div class=\"grid6\" id=\"minds\"><\/div>\n      <p class=\"short\" id=\"short\"><\/p>\n      <p class=\"foot\" id=\"foot\"><\/p>\n    <\/section>\n  <\/section>\n\n  <section class=\"back face-side\">\n    <h2 style=\"font-family:var(--serif);font-weight:400;font-size:clamp(34px,4vw,48px);margin:24px 0 8px\">Three moves answer almost anything<\/h2>\n    <div class=\"moves\" id=\"moves\"><\/div>\n    <p class=\"prep\" id=\"prep\"><\/p>\n    <h2>When they ask<\/h2>\n    <div class=\"qa\">\n      <ul class=\"qs\" id=\"qs\"><\/ul>\n      <article class=\"ans\" id=\"ans\" aria-live=\"polite\"><\/article>\n    <\/div>\n  <\/section>\n<\/main>\n\n<script>\n/* Sound. One quiet engine per page, tuned to C major pentatonic so overlapping notes never clash.\n   Nothing plays until the first tap or key press. Mute is remembered in this browser. */\nconst SND = (() => {\n  const C = window.AudioContext || window.webkitAudioContext;\n  let ctx = null, master = null, verb = null, noiseBuf = null, unlocked = false, on = true;\n  const last = {};\n  try { on = localStorage.getItem('ep-sound') !== 'off'; } catch (e) {}\n  function build() {\n    ctx = new C();\n    master = ctx.createGain(); master.gain.value = .5;\n    const comp = ctx.createDynamicsCompressor(); comp.threshold.value = -20; comp.ratio.value = 4;\n    master.connect(comp); comp.connect(ctx.destination);\n    const len = Math.floor(ctx.sampleRate * 1.8), ir = ctx.createBuffer(2, len, ctx.sampleRate);\n    for (let c = 0; c < 2; c++) { const d = ir.getChannelData(c); for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 3.2); }\n    verb = ctx.createConvolver(); verb.buffer = ir;\n    const wet = ctx.createGain(); wet.gain.value = .2; verb.connect(wet); wet.connect(master);\n    noiseBuf = ctx.createBuffer(1, ctx.sampleRate, ctx.sampleRate);\n    const n = noiseBuf.getChannelData(0); for (let i = 0; i < n.length; i++) n[i] = Math.random() * 2 - 1;\n  }\n  function unlock() { unlocked = true; if (C && !ctx) { try { build(); } catch (e) {} } if (ctx && ctx.state === 'suspended') ctx.resume(); }\n  ['pointerdown', 'keydown', 'touchstart'].forEach(ev => addEventListener(ev, unlock, { capture: true, passive: true }));\n  const ready = () => on && unlocked && ctx;\n  const BASE = [130.81, 146.83, 164.81, 196, 220]; // C D E G A, from C3\n  const note = i => BASE[((i % 5) + 5) % 5] * Math.pow(2, Math.floor(i / 5));\n  function bus(pan, wet) {\n    const g = ctx.createGain(); let head = g;\n    if (ctx.createStereoPanner) { const p = ctx.createStereoPanner(); p.pan.value = Math.max(-1, Math.min(1, pan || 0)); g.connect(p); head = p; }\n    head.connect(master); if (wet !== false) head.connect(verb); return g;\n  }\n  function tone(f, o, partials) {\n    const t = ctx.currentTime + (o.delay || 0), out = bus(o.pan, o.wet), a = o.attack || .004, L = o.len || 1;\n    partials.forEach(([m, v, decay, type]) => {\n      const osc = ctx.createOscillator(), g = ctx.createGain();\n      osc.type = type || 'sine'; osc.frequency.setValueAtTime(f * m, t);\n      if (o.glide) osc.frequency.exponentialRampToValueAtTime(f * m * o.glide, t + decay * L);\n      g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(Math.max(.0002, (o.vel || .3) * v), t + a);\n      g.gain.exponentialRampToValueAtTime(.0001, t + a + decay * L);\n      osc.connect(g); g.connect(out); osc.start(t); osc.stop(t + a + decay * L + .05);\n    });\n  }\n  const api = {\n    note,\n    /* woody mallet, like a marimba bar */\n    mallet(i, o = {}) { if (ready()) tone(note(i), o, [[1, 1, .8], [3.98, .2, .16], [9.8, .05, .05]]); },\n    /* glass bell with a slow shimmer */\n    bell(i, o = {}) { if (!ready()) return; const f = note(i); tone(f, o, [[1, 1, 2.2], [2.76, .3, 1.1], [5.4, .1, .5]]); tone(f * 1.0045, { ...o, vel: (o.vel || .3) * .45 }, [[1, 1, 2.6]]); },\n    /* soft pad chord, for big moments */\n    pad(list, o = {}) { if (!ready()) return; list.forEach((i, k) => tone(note(i), { ...o, attack: .18, delay: (o.delay || 0) + k * (o.roll || 0) }, [[1, .7, 1.8, 'triangle'], [2, .12, 1.2]])); },\n    /* retro computer beep */\n    blip(f, o = {}) { if (ready()) tone(f, { ...o, wet: false }, [[1, .5, .09, 'square']]); },\n    /* filtered noise: paper, whoosh, card snap, pen */\n    noise(o = {}) {\n      if (!ready()) return;\n      const t = ctx.currentTime + (o.delay || 0), src = ctx.createBufferSource(), fl = ctx.createBiquadFilter(), g = ctx.createGain(), d = o.d || .2, a = o.a || .01;\n      src.buffer = noiseBuf; fl.type = o.type || 'bandpass'; fl.Q.value = o.q || 1; fl.frequency.setValueAtTime(o.f || 1000, t);\n      if (o.f2) fl.frequency.exponentialRampToValueAtTime(o.f2, t + a + d);\n      g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(o.vel || .2, t + a); g.gain.exponentialRampToValueAtTime(.0001, t + a + d);\n      src.connect(fl); fl.connect(g); g.connect(bus(o.pan, o.wet)); src.start(t, Math.random() * .5); src.stop(t + a + d + .05);\n    },\n    /* say a word out loud, for the phrasebook */\n    say(text) {\n      if (!on || !('speechSynthesis' in window)) return;\n      speechSynthesis.cancel();\n      const u = new SpeechSynthesisUtterance(text), vs = speechSynthesis.getVoices();\n      u.voice = vs.find(v => /en-(CA|GB|US)/.test(v.lang) && v.localService) || vs.find(v => /^en/.test(v.lang)) || null;\n      u.rate = .92; u.pitch = 1; speechSynthesis.speak(u);\n    },\n    canSay: 'speechSynthesis' in window,\n    /* thin out crowds of events: true at most once per ms per key */\n    thin(key, ms) { const n = performance.now(); if (last[key] && n - last[key] < ms) return false; last[key] = n; return true; },\n    pan(x, w) { return Math.max(-.8, Math.min(.8, (x / (w || innerWidth)) * 1.6 - .8)); },\n    get on() { return on; },\n    button(el) {\n      const ON = '<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M4 9.5h3.5L12 6v12l-4.5-3.5H4z\"/><path d=\"M15.5 9a4.5 4.5 0 0 1 0 6M18 6.5a8 8 0 0 1 0 11\"/><\/svg>';\n      const OFF = '<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M4 9.5h3.5L12 6v12l-4.5-3.5H4z\"/><path d=\"M16 9.5l5 5M21 9.5l-5 5\"/><\/svg>';\n      const paint = () => { el.innerHTML = on ? ON : OFF; el.setAttribute('aria-pressed', on); el.setAttribute('aria-label', on ? 'Sound is on' : 'Sound is off'); el.title = on ? 'Sound on' : 'Sound off'; };\n      paint();\n      el.addEventListener('click', () => { on = !on; try { localStorage.setItem('ep-sound', on ? 'on' : 'off'); } catch (e) {} if (!on && 'speechSynthesis' in window) speechSynthesis.cancel(); paint(); if (on) { unlock(); api.mallet(10, { vel: .22 }); api.mallet(12, { vel: .18, delay: .08 }); } });\n    }\n  };\n  return api;\n})();\n\n<\/script>\n<script>\n/* Shared words for every sketch. Product names live in NAMES only, so a monthly refresh is one edit. */\nconst NAMES = {\n  checked: 'October 2026',\n  models: 'Opus · Fable · Sol · Astra',\n  faces: 'ChatGPT · Claude · Copilot · Gemini · Google AI Mode',\n  packages: 'ChatGPT Work · Codex · Claude Code',\n  agents: \"ChatGPT's Dots · Meta's Muse\",\n  cousins: 'Custom GPTs · Gems · Copilot agents'\n};\n\nconst MINDSETS = [\n  { h: 'Say what you need.', b: 'Open your usual chat, describe the job, and show it what good looks like. It takes care of more of the details every month.' },\n  { h: 'Ask your AI first.', b: 'Skip \"what can it do?\" Say what you want done: \"Make me a skill that...\" It will often just do it, or walk you through it.' },\n  { h: 'Let the jargon go.', b: 'The names and features change every week. Nobody keeps up with all of it, and you don\\'t need to.' },\n  { h: 'Your thinking travels.', b: 'Features change. The logic underneath mostly doesn\\'t. If you\\'ve built a Custom GPT, you already know most of what a skill takes.' },\n  { h: 'Try it, then adjust.', b: 'Nobody learns this once and coasts for ten years, the way we learned Excel 97. AI is brilliant at some things and oddly bad at others, and the edge keeps moving. The only way to find it is to try real work and notice what happens.' },\n  { h: 'Learn out loud, together.', b: 'When one person hits a wall alone, one person learns. When a room shares every wall it hits, everyone learns at once. Ants work this way: each finds a little, and the colony finds the way.' }\n];\n\nconst IN_SHORT = 'Tools change weekly. What you learn travels. Start with your AI. You get good by getting things done.';\n\nconst PARTS = {\n  brain:  { t: 'Brain', aka: 'The model, or LLM', b: 'Does the thinking: reading, reasoning, writing. Some brains are bigger than others, and bigger usually handles harder work. People call that size parameters.', names: NAMES.models },\n  face:   { t: 'Face', aka: 'The interface', b: 'Where you ask, and where you see the answer. The same brain can wear different faces: a chat window, a phone app, a sidebar in your email.', names: NAMES.faces + '  ·  ' + NAMES.packages },\n  hands:  { t: 'Hands', aka: 'Agentic capabilities', b: 'What it can do on its own: open files, search, write, send. The more it can reach, and the more you allow, the more it gets done without you spelling out every step.' },\n  plug:   { t: 'Plug', aka: 'Connections, or MCP', b: 'How your AI reaches your other tools, like email, calendar or files. MCP is the shared plug that lets them talk, and tells your AI what it may do there.' },\n  keys:   { t: 'Keys', aka: 'Permissions', b: 'You decide which doors it can open, and whether it can only look or also change things. Start with a few keys. Add more as trust grows.' },\n  recipe: { t: 'Recipe card', aka: 'A skill', b: 'Instructions and know-how, written once, so you never explain yourself twice. Example: your brand guidelines, plus when and how to use them.', names: 'Cousins: ' + NAMES.cousins },\n  book:   { t: 'Cookbook', aka: 'A plugin', b: 'Several recipes plus the connections they need, in one package. Handy when a whole team shares the same way of working.' },\n  notes:  { t: 'Notebook', aka: 'Instructions and memory', b: 'Long-term memory. Instructions are what you tell it: \"Never use jargon.\" Memory is what it picks up: \"This person likes plain words.\"' },\n  dial:   { t: 'Effort dial', aka: 'Models, effort and limits', b: 'Many tools let you pick a brain and how hard it thinks. Bigger brains and harder thinking use up your allowance faster.' },\n  desk:   { t: 'Desk', aka: 'The context window', b: 'Short-term memory: everything it can keep in view at once. Your chat, your files, its own replies. When the desk is full, older things slide off or get summed up. A new chat clears the desk.' },\n  bites:  { t: 'Bite-size pieces', aka: 'Tokens', b: 'AI reads and writes in small chunks: words and bits of words. Roughly 750 words make 1,000 tokens. Desks and limits are measured in them.' },\n  lookup: { t: 'Look it up first', aka: 'Retrieval, or RAG', b: 'Give it something to check before it answers. Ask for a meal plan and you get a meal plan. Share your allergy list first and you get one you can eat.' },\n  agent:  { t: 'Agent', aka: 'All of it, in a loop', b: 'The brain picks a next step, the hands do it, it checks the result, and it goes again until the job is done. You set the goal, and it works out the steps.', names: NAMES.agents }\n};\n\nconst ASKS = [\n  { q: 'Which AI tool is best?', say: 'The one you\\'re allowed to use and actually open. What you learn on one carries over to the others.', then: 'Ask the room what their tool did well this week. You\\'ll hear four tools in two minutes.', part: 'face' },\n  { q: 'What is an agent, really?', say: 'AI working in a loop. It picks a step, does it, checks, and goes again until the job is done. The more it can reach and the more you allow, the more it does alone.', then: 'Point at the hands, the plug and the keys. Together they set how much it can do alone.', part: 'agent' },\n  { q: 'Can I put company information in?', say: 'Check your organization\\'s AI policy first, and stick to the tools it approves. When in doubt, leave it out.', then: 'Know the room\\'s policy before the day. If nobody knows it, that\\'s a find worth sharing.', part: 'keys' },\n  { q: 'Why did it make that up?', say: 'It writes what sounds likely, and sometimes likely is wrong. Check anything that matters, and give it a source to look up.', then: 'Thank them out loud. It goes on the room\\'s list of finds.', part: 'lookup' },\n  { q: 'Why did it forget what I said?', say: 'Its desk filled up, so older things slid off. Start a fresh chat and give it the key points again.', then: 'Show the new chat button on the big screen.', part: 'desk' },\n  { q: 'Do I need to learn prompting?', say: 'Say what you need and show it an example of good. That covers most of it.', then: 'Ask the AI live: \"What would make my request better?\"', part: 'brain' },\n  { q: 'Skill, Custom GPT, Gem: what\\'s the difference?', say: 'Same idea, different kitchens. Each one packages instructions so you don\\'t repeat yourself, and many are being folded into skills.', then: 'If they\\'ve built one, they already know how to build the others.', part: 'recipe' },\n  { q: 'What is MCP?', say: 'The plug that lets your AI talk to another app, and know what it may do there.', then: 'Most people never type the letters. They just connect an app.', part: 'plug' },\n  { q: 'I\\'m so far behind.', say: 'Everyone feels that. The tools change every week, so nobody stays ahead for long. You catch up by finishing one real task.', then: 'Pair them with someone one step ahead for the next build.', part: 'hands' },\n  { q: 'Will AI take my job?', say: 'Fair question. Some work is getting easy and abundant. What stays hard and scarce is where your value grows. We\\'ll map yours today.', then: 'Don\\'t wave it away. Name it, and come back to it in Assess Value Shifts.', part: 'brain' }\n];\n\nconst MOVES = [\n  { h: 'Ask it, live.', b: 'Put the question to the AI on the big screen. \"Let\\'s ask it\" is a complete answer.' },\n  { h: 'Try it.', b: 'Turn the question into a two-minute experiment.' },\n  { h: 'Share it.', b: 'Every surprise goes on the room\\'s list. That list is how the room learns together.' }\n];\n\nconst PREP = 'Before the day, find out which AI tools your room can use and what their policy allows.';\n\n/* What a facilitator does to bring each mindset to life, same order as MINDSETS. */\nconst MINDSET_MOVES = [\n  'When someone types three words and gets a bland answer: \"Tell it who it\\'s for, and paste an example of good.\"',\n  'When a question stumps you: \"Let\\'s ask it.\" Type it on the big screen.',\n  'When someone apologizes for not knowing a word: \"Nobody does. It changed last week.\"',\n  'When tools differ around a table, mix the table for the next build.',\n  'When a debate starts about what AI could do: \"Let\\'s find out. Two minutes.\"',\n  'When someone finds something, have them say it to the room, then write it on the wall.'\n];\n\n<\/script>\n<script>\nconst $ = s => document.querySelector(s);\nconst fig = $('#fig');\nconst LABELS = [\n  ['dial', 40, 70, 'start', 364, 100],\n  ['brain', 40, 150, 'start', 410, 146],\n  ['face', 40, 230, 'start', 357, 214],\n  ['recipe', 40, 310, 'start', 194, 330],\n  ['hands', 40, 430, 'start', 256, 404],\n  ['desk', 40, 586, 'start', 232, 586],\n  ['agent', 900, 74, 'end', 668, 92],\n  ['plug', 900, 362, 'end', 802, 360],\n  ['notes', 900, 250, 'end', 516, 316],\n  ['keys', 900, 452, 'end', 690, 452]\n];\nconst DESK_TAGS = ['book', 'lookup', 'bites'];\nconst NS = 'http://www.w3.org/2000/svg';\nconst lg = $('#labels');\nLABELS.forEach(([p, x, y, a, ex, ey]) => {\n  const t = document.createElementNS(NS, 'text');\n  t.setAttribute('x', x); t.setAttribute('y', y); t.setAttribute('text-anchor', a);\n  t.setAttribute('class', 'lbl'); t.dataset.part = p; t.textContent = PARTS[p].t;\n  lg.appendChild(t);\n  const w = PARTS[p].t.length * 11.2 + 10;\n  const sx = a === 'start' ? x + w : x - w;\n  const sy = y - 6;\n  const l = document.createElementNS(NS, 'path');\n  const mx = a === 'start' ? Math.min(sx + 30, ex) : Math.max(sx - 30, ex);\n  l.setAttribute('d', `M${sx} ${sy} L${mx} ${sy} L${ex} ${ey}`);\n  l.setAttribute('class', 'lead'); lg.appendChild(l);\n  const d = document.createElementNS(NS, 'circle');\n  d.setAttribute('cx', ex); d.setAttribute('cy', ey); d.setAttribute('r', 3.5); d.setAttribute('class', 'lead-dot');\n  lg.appendChild(d);\n});\nconst idx = $('#index');\n[...LABELS.map(l=>l[0]).slice(0,5), ...DESK_TAGS, ...LABELS.map(l=>l[0]).slice(5)].forEach(p => { const b = document.createElement('button'); b.type = 'button'; b.dataset.part = p; b.textContent = PARTS[p].t; idx.appendChild(b); });\n\n/* each part is a bar on a marimba: high parts ring high, the desk rings low, and the sound sits where the part sits */\nconst PITCH = { dial: 14, agent: 15, brain: 13, face: 11, plug: 12, notes: 10, keys: 9, recipe: 8, hands: 7, book: 6, lookup: 5, bites: 4, desk: 2 };\nconst PAN = { dial: -.35, agent: .45, brain: 0, face: 0, plug: .7, notes: .15, keys: .5, recipe: -.6, hands: 0, book: -.45, lookup: 0, bites: .35, desk: 0 };\nconst ring = (p, o = {}) => SND.mallet(PITCH[p], { pan: PAN[p], vel: .3, ...o });\nlet loopTimer = null;\nfunction select(p, user) {\n  if (user) ring(p);\n  clearInterval(loopTimer);\n  fig.querySelectorAll('.part').forEach(g => g.classList.toggle('on', g.dataset.part === p));\n  fig.querySelectorAll('.lbl').forEach(t => t.classList.toggle('on', t.dataset.part === p));\n  fig.querySelectorAll('.dtag').forEach(t => t.classList.toggle('on', t.closest('.part').dataset.part === p));\n  idx.querySelectorAll('button').forEach(b => b.setAttribute('aria-current', b.dataset.part === p));\n  const d = PARTS[p];\n  const panel = $('#panel');\n  panel.innerHTML = `<div class=\"panel-in\"><h2>${d.t}<\/h2><div class=\"aka\">${d.aka}<\/div><p>${d.b}<\/p>${d.names ? `<div class=\"names\">${d.names}<\/div>` : ''}<\/div>`;\n  if (p === 'agent') runLoop();\n}\nfunction runLoop() {\n  const seq = ['brain', 'hands', 'lookup', 'brain', 'plug', 'hands', 'agent'];\n  let i = 0;\n  loopTimer = setInterval(() => {\n    fig.querySelectorAll('.part').forEach(g => g.classList.toggle('pulse', g.dataset.part === seq[i]));\n    if (seq[i]) seq[i] === 'agent' ? (ring('agent', { vel: .26 }), SND.bell(PITCH.agent - 2, { vel: .14, pan: PAN.agent })) : ring(seq[i], { vel: .22 });\n    i++;\n    if (i > seq.length) { clearInterval(loopTimer); fig.querySelectorAll('.part').forEach(g => g.classList.remove('pulse')); }\n  }, 650);\n}\nfig.addEventListener('click', e => { const g = e.target.closest('[data-part]'); if (g && g.dataset.part && PARTS[g.dataset.part]) select(g.dataset.part, true); });\nidx.addEventListener('click', e => { const b = e.target.closest('button'); if (b) select(b.dataset.part, true); });\nselect('brain');\nSND.button(document.getElementById('snd'));\nconst mq = matchMedia('(max-width:900px)'); const crop = () => fig.setAttribute('viewBox', mq.matches ? '160 36 680 600' : '0 0 940 660'); crop(); mq.addEventListener('change', crop);\n\n$('#minds').innerHTML = MINDSETS.map((m, i) => `<div class=\"m\"><div class=\"n\">${i + 1}<\/div><h3>${m.h}<\/h3><p>${m.b}<\/p><\/div>`).join('');\n$('#short').textContent = IN_SHORT;\n$('#foot').textContent = 'Names in handwriting change often. Checked ' + NAMES.checked + '.';\n\n/* Facilitator side */\n$('#moves').innerHTML = MOVES.map(m => `<div class=\"mv\"><h3>${m.h}<\/h3><p>${m.b}<\/p><\/div>`).join('');\n$('#prep').textContent = PREP;\nconst qs = $('#qs');\nqs.innerHTML = ASKS.map((a, i) => `<li><button type=\"button\" data-i=\"${i}\">&ldquo;${a.q}&rdquo;<\/button><\/li>`).join('');\nlet miniBuilt = false;\nfunction ask(i) {\n  const a = ASKS[i];\n  qs.querySelectorAll('button').forEach(b => b.setAttribute('aria-current', +b.dataset.i === i));\n  const ans = $('#ans');\n  ans.innerHTML = `<div class=\"panel-in\"><p class=\"say\">${a.say}<\/p><p class=\"then\"><b>Then:<\/b> ${a.then}<\/p><\/div><div class=\"mini\"><div id=\"miniHost\"><\/div><div class=\"cap\">${PARTS[a.part].t}<\/div><\/div>`;\n  const clone = fig.cloneNode(true); clone.removeAttribute('id'); clone.setAttribute('viewBox','170 40 660 600');\n  clone.querySelectorAll('.part').forEach(g => { g.classList.remove('on', 'pulse'); if (g.dataset.part === a.part) g.classList.add('on'); });\n  $('#miniHost').appendChild(clone);\n}\nqs.addEventListener('click', e => { const b = e.target.closest('button'); if (b) { ask(+b.dataset.i); ring(ASKS[+b.dataset.i].part, { vel: .24 }); } });\n\ndocument.querySelectorAll('.sides button').forEach(b => b.addEventListener('click', () => {\n  const fac = b.dataset.side === 'f';\n  document.querySelectorAll('.sides button').forEach(x => x.setAttribute('aria-pressed', x === b));\n  document.body.classList.toggle('fac', fac);\n  SND.noise({ type: 'bandpass', f: 500, f2: 2200, q: .7, a: .03, d: .32, vel: .12, pan: fac ? .4 : -.4 }); SND.mallet(fac ? 9 : 7, { vel: .16, delay: .12 });\n  const s = document.querySelector(fac ? '.back' : '.front');\n  s.classList.remove('enter'); void s.offsetWidth; s.classList.add('enter');\n  if (fac) ask(+(qs.querySelector('[aria-current=\"true\"]')?.dataset.i || 0));\n}));\n<\/script>\n<\/body>\n<\/html>\n"}, {"id": "uncharted", "name": "Uncharted", "line": "A map the room charts together, one try at a time.", "html": "<!doctype html>\n<html lang=\"en\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<meta name=\"robots\" content=\"noindex, nofollow\">\n<title>Uncharted<\/title>\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link href=\"https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=IM+Fell+English+SC&family=Spectral:ital,wght@0,400;0,500;0,600;1,400&display=swap\" rel=\"stylesheet\">\n<style>\n:root{--paper:#F2E9D8;--paper2:#EADFC8;--ink:#2B2620;--ink2:#6B5E4C;--land:#E9DBBB;--sea:#D3E0DA;--red:#A8432B;--gold:#FFCC00;\n--title:'IM Fell English SC',Georgia,serif;--fell:'IM Fell English',Georgia,serif;--body:'Spectral',Georgia,serif}\n*{box-sizing:border-box}\nhtml,body{margin:0}\nbody{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.6;\n  background-image:radial-gradient(rgba(107,94,76,.08) 1px,transparent 1.2px),radial-gradient(rgba(107,94,76,.05) 1px,transparent 1.2px);\n  background-size:7px 7px,13px 13px;background-position:0 0,3px 5px}\nbutton{font:inherit;color:inherit;cursor:pointer}\n.wrap{max-width:1240px;margin:0 auto;padding:28px 40px 72px}\n.top{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;flex-wrap:wrap}\nh1{font-family:var(--title);font-weight:400;font-size:clamp(44px,6vw,76px);line-height:.95;margin:0;letter-spacing:.01em}\n.sub{font-family:var(--fell);font-style:italic;font-size:22px;color:var(--ink2);margin:8px 0 0}\n.acts{display:flex;gap:10px;align-items:center}\n.snd{width:48px;height:48px;border:1.5px solid var(--ink);background:transparent;border-radius:3px;display:flex;align-items:center;justify-content:center;color:var(--ink)}\n.snd svg{width:22px;height:22px}\n.snd[aria-pressed=\"false\"]{color:var(--ink2)}\n.turn{border:1.5px solid var(--ink);background:transparent;border-radius:3px;padding:10px 18px;font-family:var(--title);font-size:19px;letter-spacing:.04em;transition:background .2s,color .2s}\n.turn:hover{background:var(--ink);color:var(--paper)}\n\n.sheet{position:relative;transform-style:preserve-3d;transition:transform 1s cubic-bezier(.4,.1,.2,1);margin-top:28px}\n.sheet.over{transform:rotateY(180deg)}\n.face{backface-visibility:hidden;-webkit-backface-visibility:hidden;position:absolute;inset:0 0 auto 0}\n.face.back{transform:rotateY(180deg)}\n.sheet.over .front,.sheet:not(.over) .back{visibility:hidden;transition:visibility 0s .5s}\n\n/* Map */\n.frame{border:2px solid var(--ink);padding:6px;background:var(--paper2)}\n.frame-in{border:1px solid var(--ink);position:relative}\ncanvas{display:block;width:100%;height:auto}\n.bar{display:flex;align-items:center;justify-content:space-between;gap:16px;margin:16px 0 0;flex-wrap:wrap}\n.views{display:flex;gap:4px;border:1.5px solid var(--ink);border-radius:3px;padding:3px}\n.views button{border:0;background:none;padding:7px 14px;font-family:var(--fell);font-size:18px;border-radius:2px}\n.views button[aria-pressed=\"true\"]{background:var(--ink);color:var(--paper)}\n.charted{font-family:var(--fell);font-size:24px}\n.charted b{font-family:var(--title);font-weight:400;font-size:34px;color:var(--red)}\n.go{border:0;background:var(--red);color:var(--paper);padding:10px 22px;border-radius:3px;font-family:var(--title);font-size:19px;letter-spacing:.04em}\n\n.cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:56px;margin-top:56px}\nh2{font-family:var(--title);font-weight:400;font-size:36px;margin:0 0 6px;letter-spacing:.02em}\n.rule{border-top:1px solid var(--ink);padding:16px 0 18px;display:grid;grid-template-columns:54px 1fr;gap:6px}\n.rule .rn{font-family:var(--title);font-size:26px;color:var(--red);line-height:1.1}\n.rule h3{font-family:var(--fell);font-style:italic;font-weight:400;font-size:25px;margin:0 0 4px;line-height:1.2}\n.rule p{margin:0}\n.leg{display:grid;grid-template-columns:44px 1fr;gap:4px 12px;border-top:1px solid var(--ink);padding:14px 0}\n.leg svg{width:36px;height:36px;stroke:var(--ink);fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}\n.leg h3{margin:0;font-family:var(--fell);font-weight:400;font-size:21px;line-height:1.2}\n.leg h3 span{font-family:var(--body);font-size:15px;color:var(--ink2);font-style:italic}\n.leg p{margin:2px 0 0;font-size:16px}\n.names{font-family:var(--fell);font-style:italic;color:var(--ink2)}\n.short{font-family:var(--fell);font-style:italic;font-size:28px;line-height:1.35;text-align:center;max-width:820px;margin:64px auto 0}\n.checked{text-align:center;color:var(--ink2);font-style:italic;font-size:15px;margin-top:12px}\n\n/* Back */\n.back .notes{background:#FBF7EE;border:2px solid var(--ink);padding:44px 48px 56px;\n  background-image:repeating-linear-gradient(transparent 0 33px,rgba(43,38,32,.12) 33px 34px)}\n.back h2{font-size:48px}\n.ritual{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:40px;align-items:center;margin:20px 0 48px}\n.ritual p{font-size:20px;margin:0}\n.ritual svg{width:100%;height:auto}\n.moves3{display:grid;grid-template-columns:repeat(3,1fr);gap:28px;margin:12px 0 18px}\n.moves3 h3{font-family:var(--fell);font-style:italic;font-weight:400;font-size:28px;margin:0 0 4px;color:var(--red)}\n.moves3 p{margin:0}\n.prep{font-family:var(--fell);font-style:italic;font-size:21px;margin:0 0 44px}\n.asks{columns:2;column-gap:48px}\n.ask{break-inside:avoid;margin:0 0 26px}\n.ask h3{font-family:var(--fell);font-weight:400;font-size:23px;margin:0 0 4px;line-height:1.25}\n.ask p{margin:0}\n.ask .then{color:var(--ink2);font-style:italic;margin-top:4px}\n\n@media (max-width:860px){\n  .wrap{padding:18px 16px 56px}\n  .cols{grid-template-columns:1fr;gap:36px}\n  .back .notes{padding:28px 20px 36px}\n  .ritual,.moves3{grid-template-columns:1fr}\n  .asks{columns:1}\n}\n@media (prefers-reduced-motion:reduce){.sheet{transition:none}}\n<\/style>\n<\/head>\n<body>\n<div class=\"wrap\">\n  <div class=\"top\">\n    <div>\n      <h1>Uncharted<\/h1>\n      <p class=\"sub\">The jagged coast of what AI does well, charted by everyone.<\/p>\n    <\/div>\n    <div class=\"acts\"><button class=\"snd\" id=\"snd\" type=\"button\"><\/button><button class=\"turn\" id=\"turn\" type=\"button\">Turn the map over<\/button><\/div>\n  <\/div>\n\n  <div class=\"sheet\" id=\"sheet\">\n    <section class=\"face front\">\n      <div class=\"frame\"><div class=\"frame-in\"><canvas id=\"map\" width=\"1920\" height=\"1140\" aria-label=\"A map that fills in as explorers walk it\"><\/canvas><\/div><\/div>\n      <div class=\"bar\">\n        <div class=\"views\" role=\"group\" aria-label=\"Whose map\">\n          <button type=\"button\" data-v=\"you\" aria-pressed=\"false\">Your map<\/button>\n          <button type=\"button\" data-v=\"room\" aria-pressed=\"true\">The room's map<\/button>\n        <\/div>\n        <div class=\"charted\"><b id=\"pct\">0%<\/b> of the map charted<\/div>\n        <button class=\"go\" id=\"go\" type=\"button\">Set out again<\/button>\n      <\/div>\n\n      <div class=\"cols\">\n        <div>\n          <h2>Rules of the road<\/h2>\n          <div id=\"rules\"><\/div>\n        <\/div>\n        <div>\n          <h2>Legend<\/h2>\n          <div id=\"legend\"><\/div>\n        <\/div>\n      <\/div>\n      <p class=\"short\" id=\"short\"><\/p>\n      <p class=\"checked\" id=\"checked\"><\/p>\n    <\/section>\n\n    <section class=\"face back\">\n      <div class=\"notes\">\n        <h2>Guide's notes<\/h2>\n        <div class=\"ritual\">\n          <p>At the start, draw one long jagged line across a flipchart. Land on one side, sea on the other. Every time someone finds something, pin it: on land if it worked, at sea if it didn't. By the end of the day the room has charted its own coast, and nobody had to chart it alone.<\/p>\n          <svg viewBox=\"0 0 420 240\" aria-hidden=\"true\">\n            <rect x=\"10\" y=\"10\" width=\"400\" height=\"220\" fill=\"#fff\" stroke=\"#2B2620\" stroke-width=\"2\"/>\n            <path d=\"M40 30 L80 70 L66 96 L120 118 L104 150 L160 170 L150 210\" fill=\"none\" stroke=\"#2B2620\" stroke-width=\"3\" stroke-linejoin=\"round\"/>\n            <text x=\"58\" y=\"190\" font-family=\"IM Fell English\" font-style=\"italic\" font-size=\"18\" fill=\"#6B5E4C\">land<\/text>\n            <text x=\"180\" y=\"60\" font-family=\"IM Fell English\" font-style=\"italic\" font-size=\"18\" fill=\"#6B5E4C\">sea<\/text>\n            <g fill=\"#A8432B\"><circle cx=\"54\" cy=\"120\" r=\"7\"/><circle cx=\"84\" cy=\"150\" r=\"7\"/><circle cx=\"40\" cy=\"80\" r=\"7\"/><circle cx=\"110\" cy=\"200\" r=\"7\"/><\/g>\n            <g fill=\"none\" stroke=\"#A8432B\" stroke-width=\"3\"><circle cx=\"140\" cy=\"96\" r=\"7\"/><circle cx=\"196\" cy=\"150\" r=\"7\"/><circle cx=\"120\" cy=\"40\" r=\"7\"/><\/g>\n            <g fill=\"#2B2620\" font-family=\"IM Fell English\" font-size=\"15\"><text x=\"232\" y=\"96\">first drafts<\/text><text x=\"232\" y=\"122\">long summaries<\/text><text x=\"232\" y=\"148\">quotes it never read<\/text><\/g>\n            <path d=\"M226 92 L62 118 M226 118 L92 148 M226 144 L204 150\" stroke=\"#2B2620\" stroke-width=\"1\" stroke-dasharray=\"3 3\"/>\n          <\/svg>\n        <\/div>\n        <h2 style=\"font-size:34px\">Three moves<\/h2>\n        <div class=\"moves3\" id=\"moves\"><\/div>\n        <p class=\"prep\" id=\"prep\"><\/p>\n        <h2 style=\"font-size:34px;margin-bottom:18px\">When the crew asks<\/h2>\n        <div class=\"asks\" id=\"asks\"><\/div>\n      <\/div>\n    <\/section>\n  <\/div>\n<\/div>\n\n<script>\n/* Sound. One quiet engine per page, tuned to C major pentatonic so overlapping notes never clash.\n   Nothing plays until the first tap or key press. Mute is remembered in this browser. */\nconst SND = (() => {\n  const C = window.AudioContext || window.webkitAudioContext;\n  let ctx = null, master = null, verb = null, noiseBuf = null, unlocked = false, on = true;\n  const last = {};\n  try { on = localStorage.getItem('ep-sound') !== 'off'; } catch (e) {}\n  function build() {\n    ctx = new C();\n    master = ctx.createGain(); master.gain.value = .5;\n    const comp = ctx.createDynamicsCompressor(); comp.threshold.value = -20; comp.ratio.value = 4;\n    master.connect(comp); comp.connect(ctx.destination);\n    const len = Math.floor(ctx.sampleRate * 1.8), ir = ctx.createBuffer(2, len, ctx.sampleRate);\n    for (let c = 0; c < 2; c++) { const d = ir.getChannelData(c); for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 3.2); }\n    verb = ctx.createConvolver(); verb.buffer = ir;\n    const wet = ctx.createGain(); wet.gain.value = .2; verb.connect(wet); wet.connect(master);\n    noiseBuf = ctx.createBuffer(1, ctx.sampleRate, ctx.sampleRate);\n    const n = noiseBuf.getChannelData(0); for (let i = 0; i < n.length; i++) n[i] = Math.random() * 2 - 1;\n  }\n  function unlock() { unlocked = true; if (C && !ctx) { try { build(); } catch (e) {} } if (ctx && ctx.state === 'suspended') ctx.resume(); }\n  ['pointerdown', 'keydown', 'touchstart'].forEach(ev => addEventListener(ev, unlock, { capture: true, passive: true }));\n  const ready = () => on && unlocked && ctx;\n  const BASE = [130.81, 146.83, 164.81, 196, 220]; // C D E G A, from C3\n  const note = i => BASE[((i % 5) + 5) % 5] * Math.pow(2, Math.floor(i / 5));\n  function bus(pan, wet) {\n    const g = ctx.createGain(); let head = g;\n    if (ctx.createStereoPanner) { const p = ctx.createStereoPanner(); p.pan.value = Math.max(-1, Math.min(1, pan || 0)); g.connect(p); head = p; }\n    head.connect(master); if (wet !== false) head.connect(verb); return g;\n  }\n  function tone(f, o, partials) {\n    const t = ctx.currentTime + (o.delay || 0), out = bus(o.pan, o.wet), a = o.attack || .004, L = o.len || 1;\n    partials.forEach(([m, v, decay, type]) => {\n      const osc = ctx.createOscillator(), g = ctx.createGain();\n      osc.type = type || 'sine'; osc.frequency.setValueAtTime(f * m, t);\n      if (o.glide) osc.frequency.exponentialRampToValueAtTime(f * m * o.glide, t + decay * L);\n      g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(Math.max(.0002, (o.vel || .3) * v), t + a);\n      g.gain.exponentialRampToValueAtTime(.0001, t + a + decay * L);\n      osc.connect(g); g.connect(out); osc.start(t); osc.stop(t + a + decay * L + .05);\n    });\n  }\n  const api = {\n    note,\n    /* woody mallet, like a marimba bar */\n    mallet(i, o = {}) { if (ready()) tone(note(i), o, [[1, 1, .8], [3.98, .2, .16], [9.8, .05, .05]]); },\n    /* glass bell with a slow shimmer */\n    bell(i, o = {}) { if (!ready()) return; const f = note(i); tone(f, o, [[1, 1, 2.2], [2.76, .3, 1.1], [5.4, .1, .5]]); tone(f * 1.0045, { ...o, vel: (o.vel || .3) * .45 }, [[1, 1, 2.6]]); },\n    /* soft pad chord, for big moments */\n    pad(list, o = {}) { if (!ready()) return; list.forEach((i, k) => tone(note(i), { ...o, attack: .18, delay: (o.delay || 0) + k * (o.roll || 0) }, [[1, .7, 1.8, 'triangle'], [2, .12, 1.2]])); },\n    /* retro computer beep */\n    blip(f, o = {}) { if (ready()) tone(f, { ...o, wet: false }, [[1, .5, .09, 'square']]); },\n    /* filtered noise: paper, whoosh, card snap, pen */\n    noise(o = {}) {\n      if (!ready()) return;\n      const t = ctx.currentTime + (o.delay || 0), src = ctx.createBufferSource(), fl = ctx.createBiquadFilter(), g = ctx.createGain(), d = o.d || .2, a = o.a || .01;\n      src.buffer = noiseBuf; fl.type = o.type || 'bandpass'; fl.Q.value = o.q || 1; fl.frequency.setValueAtTime(o.f || 1000, t);\n      if (o.f2) fl.frequency.exponentialRampToValueAtTime(o.f2, t + a + d);\n      g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(o.vel || .2, t + a); g.gain.exponentialRampToValueAtTime(.0001, t + a + d);\n      src.connect(fl); fl.co ens', b: 'AI reads and writes in small chunks: words and bits of words. Roughly 750 words make 1,000 tokens. Desks and limits are measured in them.' },\n  lookup: { t: 'Look it up first', aka: 'Retrieval, or RAG', b: 'Give it something to check before it answers. Ask for a meal plan and you get a meal plan. Share your allergy list first and you get one you can eat.' },\n  agent:  { t: 'Agent', aka: 'All of it, in a loop', b: 'The brain picks a next step, the hands do it, it checks the result, and it goes again until the job is done. You set the goal, and it works out the steps.', names: NAMES.agents }\n};\n\nconst ASKS = [\n  { q: 'Which AI tool is best?', say: 'The one you\\'re allowed to use and actually open. What you learn on one carries over to the others.', then: 'Ask the room what their tool did well this week. You\\'ll hear four tools in two minutes.', part: 'face' },\n  { q: 'What is an agent, really?', say: 'AI working in a loop. It picks a step, does it, checks, and goes again until the job is done. The more it can reach and the more you allow, the more it does alone.', then: 'Point at the hands, the plug and the keys. Together they set how much it can do alone.', part: 'agent' },\n  { q: 'Can I put company information in?', say: 'Check your organization\\'s AI policy first, and stick to the tools it approves. When in doubt, leave it out.', then: 'Know the room\\'s policy before the day. If nobody knows it, that\\'s a find worth sharing.', part: 'keys' },\n  { q: 'Why did it make that up?', say: 'It writes what sounds likely, and sometimes likely is wrong. Check anything that matters, and give it a source to look up.', then: 'Thank them out loud. It goes on the room\\'s list of finds.', part: 'lookup' },\n  { q: 'Why did it forget what I said?', say: 'Its desk filled up, so older things slid off. Start a fresh chat and give it the key points again.', then: 'Show the new chat button on the big screen.', part: 'desk' },\n  { q: 'Do I need to learn prompting
