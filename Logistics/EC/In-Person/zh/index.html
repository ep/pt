<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Workshop prep hub | ExperiencePoint</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Gelasio:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
  /* ExperiencePoint brand palette */
  :root{
    --ep-gold:#FFCC00;
    --ep-cobalt:#293851;
    --ep-aegean:#586A90;
    --ep-pigeon:#D5D9E3;
    --ep-coastal:#68BFBD;
    --ep-slush:#E4F4F4;
    --ep-prairie:#D86527;
    --ep-dust:#EBB293;
    --ec-blue:#06A6D0;
    --ec-blue-deep:#007C9E;
    --ec-blue-light:#4FC4E6;
    --ep-blush:#F6E2D5;
    --ep-fern:#90B210;
    --ep-leaf:#E9F0CF;
    --ep-paper:#FFFFFF;
    --ep-editorial:#F9F6F6;

    --bg:var(--ep-editorial);
    --surface:var(--ep-paper);
    --surface-hover:#F3F4F7;
    --border:var(--ep-pigeon);
    --text:var(--ep-cobalt);
    --text-2:var(--ep-aegean);
    --link:var(--ec-blue-deep);
    --note-bg:var(--ep-slush);
    --note-rule:var(--ep-coastal);
    --check:var(--ep-cobalt);
    --track:var(--ep-pigeon);

    --sans:'Montserrat','Gotham',Arial,sans-serif;
    --serif:Georgia,'Gelasio','Times New Roman',serif;

    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
    color-scheme:light;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#1E2A3D;
      --surface:var(--ep-cobalt);
      --surface-hover:#33445F;
      --border:#3B4C69;
      --text:#FFFFFF;
      --text-2:var(--ep-pigeon);
      --link:var(--ec-blue-light);
      --note-bg:#24485A;
      --note-rule:var(--ep-coastal);
      --check:var(--ep-coastal);
      --track:#3B4C69;
      color-scheme:dark;
    }
    :root:not([data-theme="light"]) .logo-chip{background:var(--ep-paper);padding:10px 14px;}
  }
  :root[data-theme="dark"]{
    --bg:#1E2A3D;
    --surface:var(--ep-cobalt);
    --surface-hover:#33445F;
    --border:#3B4C69;
    --text:#FFFFFF;
    --text-2:var(--ep-pigeon);
    --link:var(--ec-blue-light);
    --note-bg:#24485A;
    --note-rule:var(--ep-coastal);
    --check:var(--ep-coastal);
    --track:#3B4C69;
    color-scheme:dark;
  }
  :root[data-theme="dark"] .logo-chip{background:var(--ep-paper);padding:10px 14px;}

  html{scroll-padding-top:env(safe-area-inset-top,0px);}
  *,*::before,*::after{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:var(--sans);
    font-size:15px;
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:660px;margin:0 auto;padding:36px 24px 56px;}

  /* Logo: top-left, clear space ≈ width of the "E" */
  .brand{margin:0 0 44px;}
  .brand img{height:34px;width:auto;max-width:100%;}
  .logo-chip{display:inline-block;line-height:0;border-radius:6px;}

  .product-unused{
    font-family:var(--sans);
    font-weight:500;
    font-size:14px;
    color:var(--text-2);
    margin:0 0 6px;
  }
  h1{
    font-family:var(--sans);
    font-weight:700;
    font-size:clamp(26px,5vw,32px);
    line-height:1.2;
    letter-spacing:-0.01em;
    margin:0 0 10px;
  }
  .subline{
    font-family:var(--serif);
    font-size:18px;
    line-height:1.55;
    color:var(--text-2);
    margin:0 0 28px;
  }

  .note{
    background:var(--note-bg);
    border-left:4px solid var(--note-rule);
    border-radius:4px;
    padding:14px 18px;
    font-size:14px;
    line-height:1.55;
    margin:0 0 28px;
  }

  .progress{
    display:flex;
    align-items:center;
    gap:16px;
    margin:0 0 20px;
  }
  .progress-track{flex:1;height:8px;background:var(--track);border-radius:8px;overflow:hidden;}
  /* The page's one Gold accent */
  .progress-fill{height:100%;width:0%;background:var(--ep-gold);border-radius:8px;transition:width .3s ease;}
  .progress-label{font-size:13px;font-weight:500;color:var(--text-2);white-space:nowrap;font-variant-numeric:tabular-nums;}

  .section{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:8px;
    margin-bottom:10px;
    overflow:hidden;
  }
  .section-header{
    width:100%;
    display:flex;
    align-items:center;
    gap:14px;
    padding:16px 20px;
    background:none;
    border:none;
    cursor:pointer;
    text-align:left;
    color:var(--text);
    font:inherit;
  }
  .section-header:hover{background:var(--surface-hover);}
  .section-header:focus-visible{outline:3px solid var(--ep-coastal);outline-offset:-3px;}
  .section-icon{
    width:34px;height:34px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    font-size:15px;flex-shrink:0;
    color:var(--ep-cobalt);
  }
  .tone-0{background:var(--ep-slush);}
  .tone-1{background:var(--ep-blush);}
  .tone-2{background:var(--ep-leaf);}
  .tone-3{background:var(--ep-pigeon);}
  .section-title{
    flex:1;
    font-family:var(--serif);
    font-size:18px;
    font-weight:400;
    line-height:1.3;
  }
  .section-count{font-size:12px;font-weight:500;color:var(--text-2);font-variant-numeric:tabular-nums;}
  .chevron{
    width:10px;height:10px;flex-shrink:0;
    border-right:2px solid var(--text-2);
    border-bottom:2px solid var(--text-2);
    transform:rotate(45deg);
    margin:0 4px 4px 2px;
    transition:transform .15s ease;
  }
  .section-header[aria-expanded="false"] .chevron{transform:rotate(-45deg);margin-bottom:0;}

  .section-body{padding:2px 20px 16px 68px;}
  .section-body[hidden]{display:none;}

  .item{
    display:flex;
    align-items:flex-start;
    gap:12px;
    padding:9px 0;
    font-size:14px;
    line-height:1.5;
    cursor:pointer;
    border-top:1px solid var(--border);
  }
  .item:first-of-type{border-top:none;}
  .setup-diagram + .item{border-top:none;}
  .setup-diagram{margin:6px 0 10px;overflow-x:auto;}
  .setup-diagram svg{display:block;width:100%;min-width:420px;height:auto;}
  .item input{
    width:18px;height:18px;flex-shrink:0;margin:1px 0 0;
    accent-color:var(--check);
    cursor:pointer;
  }
  .item input:focus-visible{outline:3px solid var(--ep-coastal);outline-offset:2px;}
  .item-text a{color:var(--link);font-weight:600;text-decoration:underline;text-decoration-color:currentColor;text-underline-offset:3px;text-decoration-thickness:1.5px;}
  .item-text a:hover{text-decoration-thickness:2.5px;}
  .item-sub{display:block;font-size:12px;color:var(--text-2);margin-top:3px;}
  .item-sub a{color:inherit;font-weight:400;text-decoration:underline;text-underline-offset:2px;}
  .item.checked .item-text, .item.checked .item-text a{color:var(--text-2);text-decoration:line-through;text-decoration-color:var(--text-2);}

  .section-image{
    width:100%;max-width:100%;height:auto;
    border-radius:6px;
    border:1px solid var(--border);
    margin:6px 0 10px;
    display:block;
    background:#fff;
  }

  .help{
    margin-top:32px;
    font-family:var(--serif);
    font-size:16px;
    line-height:1.6;
    color:var(--text);
  }
  .legal{
    margin-top:28px;
    padding-top:16px;
    border-top:1px solid var(--border);
    font-size:11px;
    line-height:1.5;
    color:var(--text-2);
  }

  @media (max-width:480px){
    .wrap{padding:28px 18px 48px;}
    .brand{margin-bottom:32px;}
    .brand img{height:28px;}
    .section-body{padding-left:20px;}
  }
  @media (prefers-reduced-motion: reduce){
    .progress-fill,.chevron{transition:none;}
  }
</style>
</head>

-cobalt)"/><rect x="389" y="74" width="6" height="1.5" rx="0.75" fill="var(--ep-aegean)"/><rect x="464" y="36" width="116" height="68" rx="4" fill="none" stroke="var(--border)" stroke-dasharray="4 3"/><circle cx="522" cy="70" r="20" fill="#EBB293"/><circle cx="522.0" cy="41.0" r="5" fill="var(--ep-pigeon)" stroke="var(--ep-aegean)" stroke-width="1"/><circle cx="549.6" cy="61.0" r="5" fill="var(--ep-pigeon)" stroke="var(--ep-aegean)" stroke-width="1"/><circle cx="539.0" cy="93.5" r="5" fill="var(--ep-pigeon)" stroke="var(--ep-aegean)" stroke-width="1"/><circle cx="505.0" cy="93.5" r="5" fill="var(--ep-pigeon)" stroke="var(--ep-aegean)" stroke-width="1"/><circle cx="494.4" cy="61.0" r="5" fill="var(--ep-pigeon)" stroke="var(--ep-aegean)" stroke-width="1"/><rect x="512" y="61" width="20" height="13" rx="2" fill="var(--ep-cobalt)"/><rect x="514" y="63" width="16" height="9" rx="1" fill="#E4F4F4"/><rect x="508" y="74" width="28" height="4" rx="1.5" fill="var(--ep-cobalt)"/><rect x="519" y="74" width="6" height="1.5" rx="0.75" fill="var(--ep-aegean)"/><rect x="334" y="116" width="116" height="68" rx="4" fill="none" stroke="var(--border)" stroke-dasharray="4 3"/><circle cx="392" cy="150" r="20" fill="#C7D887"/><circle cx="392.0" cy="121.0" r="5" fill="var(--ep-pigeon)" stroke="var(--ep-aegean)" stroke-width="1"/><circle cx="419.6" cy="141.0" r="5" fill="var(--ep-pigeon)" stroke="var(--ep-aegean)" stroke-width="1"/><circle cx="409.0" cy="173.5" r="5" fill="var(--ep-pigeon)" stroke="var(--ep-aegean)" stroke-width="1"/><circle cx="375.0" cy="173.5" r="5" fill="var(--ep-pigeon)" stroke="var(--ep-aegean)" stroke-width="1"/><circle cx="364.4" cy="141.0" r="5" fill="var(--ep-pigeon)" stroke="var(--ep-aegean)" stroke-width="1"/><rect x="382" y="141" width="20" height="13" rx="2" fill="var(--ep-cobalt)"/><rect x="384" y="143" width="16" height="9" rx="1" fill="#E4F4F4"/><rect x="378" y="154" width="28" height="4" rx="1.5" fill="var(--ep-cobalt)"/><rect x="389" y="154" width="6" height="1.5" rx="0.75" fill="var(--ep-aegean)"/><rect x="464" y="116" width="116" height="68" rx="4" fill="none" stroke="var(--border)" stroke-dasharray="4 3"/><circle cx="522" cy="150" r="20" fill="#D5D9E3"/><circle cx="522.0" cy="121.0" r="5" fill="var(--ep-pigeon)" stroke="var(--ep-aegean)" stroke-width="1"/><circle cx="549.6" cy="141.0" r="5" fill="var(--ep-pigeon)" stroke="var(--ep-aegean)" stroke-width="1"/><circle cx="539.0" cy="173.5" r="5" fill="var(--ep-pigeon)" stroke="var(--ep-aegean)" stroke-width="1"/><circle cx="505.0" cy="173.5" r="5" fill="var(--ep-pigeon)" stroke="var(--ep-aegean)" stroke-width="1"/><circle cx="494.4" cy="141.0" r="5" fill="var(--ep-pigeon)" stroke="var(--ep-aegean)" stroke-width="1"/><rect x="512" y="141" width="20" height="13" rx="2" fill="var(--ep-cobalt)"/><rect x="514" y="143" width="16" height="9" rx="1" fill="#E4F4F4"/><rect x="508" y="154" width="28" height="4" rx="1.5" fill="var(--ep-cobalt)"/><rect x="519" y="154" width="6" height="1.5" rx="0.75" fill="var(--ep-aegean)"/><text x="457" y="218" text-anchor="middle" font-size="12" font-weight="600" fill="var(--text)">Break-outs: 1 laptop per team</text></g></svg></figure>',
    items: [
      { text: "High speed internet access, plus a projector, screen, and audio system or speakers" },
      { text: '1 tested laptop per team, run the <a href="' + config.technologyTestUrl + '" target="_blank" rel="noopener">technology test</a> on each before the workshop' },
      { text: "1 table per team" },
      { text: "1 flip chart or whiteboard with markers per team" },
      { text: "Optional: a large monitor and external speakers for team laptops" }
    ]
  });
}

if (isVirtual) {
  const virtualItems = [
    { text: 'Bookmark the <a href="' + config.activityGuideUrl + '" target="_blank" rel="noopener">activity guide</a>, it covers team simulation access and ' + config.externalPlanningTool }
  ];
  if (isCorporate) {
    virtualItems.push({ text: 'Share the <a href="' + config.postSessionSignUpUrl + '" target="_blank" rel="noopener">individual post-session sign-up link</a> with participants ahead of time if you are running stakeholder interviews as pre-work' });
    virtualItems.push({ text: "This link switches to full sim access on " + config.accessStartsOn + ", participants have until " + config.accessEndsOn + " to create a personal account" });
  }
  sections.push({ icon: "&#9737;", title: "Virtual workshop access", items: virtualItems });
}

if (isMBAOrUndergrad) {
  sections.push({
    icon: "&#9673;",
    title: "Access codes and materials",
    items: [
      { text: "If results are used for evaluation, enable team access codes under Facilitator Tools, VIRTUAL header, to keep team logins discreet" },
      { text: "Choose the email communication template that fits your workshop, technology instructions are included for participants" },
      { text: "Use the ExperienceChange play by play for your preparation checklist and in-session instructions" }
    ]
  });
}

const postItems = [
  { text: 'Bookmark the <a href="' + config.toolkitUrl + '" target="_blank" rel="noopener">ExperienceChange toolkit</a> for tools to extend the change impact of their projects' }
];
if (isPartner) {
  postItems.unshift({ text: "Participants can access the simulation again until " + config.accessEndsOn + " to create a personal account" });
}
if (isMBAOrUndergrad) {
  postItems.unshift({ text: "The stakeholder interview link switches to full sim access on " + config.accessStartsOn + ", participants have until " + config.accessEndsOn + " to create a personal account" });
}
sections.push({ icon: "&#9733;", title: "After the workshop", items: postItems });

/* Remember ticked items in this browser so the checklist survives a refresh */
const storeKey = "ep-prep:" + config.workshopName + ":" + config.sessionDate;
let saved = {};
try { saved = JSON.parse(localStorage.getItem(storeKey) || "{}") || {}; } catch (e) { saved = {}; }
function persist() { try { localStorage.setItem(storeKey, JSON.stringify(saved)); } catch (e) {} }

const container = document.getElementById("sections");
const fillEl = document.getElementById("progress-fill");
const labelEl = document.getElementById("progress-label");
let total = 0;
let done = 0;

function updateProgress() {
  fillEl.style.width = total ? Math.round((done / total) * 100) + "%" : "0%";
  labelEl.textContent = done + " of " + total + " done";
}

sections.forEach((section, idx) => {
  const box = document.createElement("div");
  box.className = "section";

  const bodyId = "section-body-" + idx;
  const header = document.createElement("button");
  header.className = "section-header";
  header.setAttribute("aria-controls", bodyId);
  header.innerHTML =
    '<span class="section-icon tone-' + (idx % 4) + '" aria-hidden="true">' + section.icon + '</span>' +
    '<span class="section-title">' + section.title + '</span>' +
    '<span class="section-count" data-count></span>' +
    '<span class="chevron" aria-hidden="true"></span>';

  const body = document.createElement("div");
  body.className = "section-body";
  body.id = bodyId;
  const startOpen = idx === 0;
  body.hidden = !startOpen;
  header.setAttribute("aria-expanded", String(startOpen));

  let sectionTotal = 0;
  let sectionDone = 0;
  const countEl = header.querySelector("[data-count]");

  if (section.diagram) {
    const wrap = document.createElement("div");
    wrap.innerHTML = section.diagram;
    body.appendChild(wrap.firstChild);
  }

  section.items.forEach((item, i) => {
    total++;
    sectionTotal++;
    const id = idx + "-" + i;
    const row = document.createElement("label");
    row.className = "item";
    const cb = document.createElement("input");
    cb.type = "checkbox";
    const span = document.createElement("span");
    span.className = "item-text";
    span.innerHTML = item.text + (item.sub ? '<span class="item-sub">' + item.sub + '</span>' : '');

    if (saved[id]) {
      cb.checked = true;
      row.classList.add("checked");
      done++;
      sectionDone++;
    }

    cb.addEventListener("change", () => {
      row.classList.toggle("checked", cb.checked);
      done += cb.checked ? 1 : -1;
      sectionDone += cb.checked ? 1 : -1;
      countEl.textContent = sectionDone + "/" + sectionTotal;
      if (cb.checked) { saved[id] = 1; } else { delete saved[id]; }
      persist();
      updateProgress();
    });
    row.appendChild(cb);
    row.appendChild(span);
    body.appendChild(row);
  });

  countEl.textContent = sectionDone + "/" + sectionTotal;

  header.addEventListener("click", () => {
    const open = header.getAttribute("aria-expanded") === "true";
    header.setAttribute("aria-expanded", String(!open));
    body.hidden = open;
  });

  box.appendChild(header);
  box.appendChild(body);
  container.appendChild(box);
});

updateProgress();
</script>
