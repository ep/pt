<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Workshop prep hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Georgia&display=swap" rel="stylesheet">
<style>
  :root{
    --ep-gold:#FFCC00;
    --ep-cobalt:#293851;
    --ep-aegean:#586A90;
    --ep-pigeon:#D5D9E3;
    --ep-paper:#FFFFFF;
    --ep-editorial:#F9F6F6;
    --ep-inked:#000000;
    --ep-slush:#E4F4F4;

    --bg:var(--ep-editorial);
    --surface:var(--ep-paper);
    --surface-muted:var(--ep-slush);
    --border:var(--ep-pigeon);
    --text-primary:var(--ep-cobalt);
    --text-secondary:var(--ep-aegean);
    --text-muted:#93998F;
    --accent:var(--ep-cobalt);
    --accent-light:var(--ep-slush);
    --accent-dark:var(--ep-cobalt);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text-primary);
    font-family:'Montserrat',-apple-system,BlinkMacSystemFont,sans-serif;
    line-height:1.15;
  }
  .wrap{max-width:640px;margin:0 auto;padding:40px 24px 64px;}
  .eyebrow-logo{margin:0 0 28px;}
  .eyebrow-logo img{display:block;height:22px;width:auto;}
  h1{
    font-family:'Georgia',serif;
    font-weight:400;
    font-size:32px;
    line-height:1.2;
    margin:0 0 8px;
    color:var(--ep-cobalt);
  }
  .subline{color:var(--text-secondary);font-size:15px;line-height:1.5;margin:0 0 28px;}
  .progress-card{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:10px;
    padding:16px 20px;
    display:flex;
    align-items:center;
    gap:16px;
    margin-bottom:28px;
  }
  .progress-track{flex:1;height:6px;background:var(--surface-muted);border-radius:4px;overflow:hidden;}
  .progress-fill{height:100%;width:0%;background:var(--ep-gold);border-radius:4px;transition:width .25s ease;}
  .progress-label{font-size:13px;color:var(--text-secondary);white-space:nowrap;font-weight:500;}
  .section{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:10px;
    margin-bottom:12px;
    overflow:hidden;
  }
  .section-header{
    width:100%;
    display:flex;
    align-items:center;
    gap:12px;
    padding:16px 20px;
    background:none;
    border:none;
    cursor:pointer;
    text-align:left;
    font-family:inherit;
    font-size:15px;
    font-weight:600;
    color:var(--text-primary);
  }
  .section-header:hover{background:var(--surface-muted);}
  .section-icon{
    width:32px;height:32px;border-radius:8px;
    background:var(--ep-cobalt);color:var(--ep-paper);
    display:flex;align-items:center;justify-content:center;
    font-size:16px;flex-shrink:0;
  }
  .section-title{flex:1;}
  .section-count{font-size:12px;color:var(--text-muted);font-weight:500;margin-right:4px;}
  .chevron{
    color:var(--text-muted);
    transition:transform .15s ease;
    font-size:14px;
  }
  .section-body{padding:0 20px 18px 68px;}
  .item{
    display:flex;
    align-items:flex-start;
    gap:10px;
    padding:8px 0;
    font-size:14px;
    line-height:1.5;
    cursor:pointer;
  }
  .item input{
    width:17px;height:17px;flex-shrink:0;margin-top:2px;
    accent-color:var(--ep-cobalt);
  }
  .item-text a{color:var(--ep-cobalt);text-decoration:underline;}
  .item-text{color:var(--text-primary);}
  .item.checked .item-text{color:var(--text-muted);text-decoration:line-through;}
  .section-image{
    width:100%;
    border-radius:8px;
    border:1px solid var(--border);
    margin:2px 0 12px;
    display:block;
  }
  .note{
    background:var(--ep-slush);
    border-left:3px solid var(--ep-gold);
    border-radius:6px;
    padding:12px 16px;
    font-size:13px;
    line-height:1.5;
    color:var(--ep-cobalt);
    margin:0 0 24px;
  }
  .footer{
    margin-top:32px;
    padding-top:20px;
    border-top:1px solid var(--border);
    font-size:14px;
    color:var(--text-secondary);
  }
  .footer a{color:var(--ep-cobalt);}
  .copyright{
    margin-top:16px;
    font-size:11px;
    color:var(--text-muted);
  }
  .terminal-dot{
    display:inline-block;
    width:6px;height:6px;
    border-radius:50%;
    background:var(--ep-gold);
    margin-left:6px;
  }
  @media (max-width:480px){
    .section-body{padding-left:20px;}
  }
</style>
</head>

      { text: "1 table per team" },

if (isVirtual) {
  const virtualItems = [
    { text: 'Bookmark the <a href="' + config.activityGuideUrl + '" target="_blank" rel="noopener">activity guide</a>, it covers team simulation access and ' + config.externalPlanningTool }
  ];
  if (isCorporate) {
    virtualItems.push({ text: 'Share the <a href="' + config.postSessionSignUpUrl + '" target="_blank" rel="noopener">individual post-session sign-up link</a> with participants ahead of time if you are running stakeholder interviews as pre-work' });
    virtualItems.push({ text: "This link switches to full sim access on " + config.accessStartsOn + ", participants have until " + config.accessEndsOn + " to create a personal account" });
  }
  sections.push({ icon: "&#9737;", title: "Virtual workshop access", items: virtualItems });
}

if (isMBAOrUndergrad) {
  sections.push({
    icon: "&#9673;",
    title: "Access codes and materials",
    items: [
      { text: "If results are used for evaluation, enable team access codes under Facilitator Tools, VIRTUAL header, to keep team logins discreet" },
      { text: "Choose the email communication template that fits your workshop, technology instructions are included for participants" },
      { text: "Use the ExperienceChange play by play for your preparation checklist and in-session instructions" }
    ]
  });
}

const postItems = [
  { text: 'Bookmark the <a href="' + config.toolkitUrl + '" target="_blank" rel="noopener">ExperienceChange toolkit</a> for tools to extend the change impact of their projects' }
];
if (isPartner) {
  postItems.unshift({ text: "Participants can access the simulation again until " + config.accessEndsOn + " to create a personal account" });
}
if (isMBAOrUndergrad) {
  postItems.unshift({ text: "The stakeholder interview link switches to full sim access on " + config.accessStartsOn + ", participants have until " + config.accessEndsOn + " to create a personal account" });
}
sections.push({ icon: "&#9733;", title: "After the workshop", items: postItems });

const container = document.getElementById("sections");
let total = 0;
let done = 0;

sections.forEach((section, idx) => {
  const box = document.createElement("div");
  box.className = "section";

  const header = document.createElement("button");
  header.className = "section-header";
  header.innerHTML =
    '<span class="section-icon">' + section.icon + '</span>' +
    '<span class="section-title">' + section.title + '</span>' +
    '<span class="section-count" data-count></span>' +
    '<span class="chevron">&#9660;</span>';

  const body = document.createElement("div");
  body.className = "section-body";
  body.style.display = idx === 0 ? "block" : "none";
  header.querySelector(".chevron").style.transform = idx === 0 ? "rotate(0deg)" : "rotate(-90deg)";

  let sectionTotal = 0;
  let sectionDone = 0;
  const countEl = header.querySelector("[data-count]");

  if (section.image) {
    const img = document.createElement("img");
    img.className = "section-image";
    img.src = section.image.src;
    img.alt = section.image.alt;
    body.appendChild(img);
  }

  section.items.forEach((item) => {
    total++;
    sectionTotal++;
    const row = document.createElement("label");
    row.className = "item";
    const cb = document.createElement("input");
    cb.type = "checkbox";
    const span = document.createElement("span");
    span.className = "item-text";
    span.innerHTML = item.text;
    cb.addEventListener("change", () => {
      row.classList.toggle("checked", cb.checked);
      done += cb.checked ? 1 : -1;
      sectionDone += cb.checked ? 1 : -1;
      countEl.textContent = sectionDone + "/" + sectionTotal;
      document.getElementById("progress-fill").style.width = Math.round((done / total) * 100) + "%";
      document.getElementById("progress-label").textContent = done + " of " + total + " done";
    });
    row.appendChild(cb);
    row.appendChild(span);
    body.appendChild(row);
  });

  countEl.textContent = sectionDone + "/" + sectionTotal;

  header.addEventListener("click", () => {
    const isOpen = body.style.display === "block";
    body.style.display = isOpen ? "none" : "block";
    header.querySelector(".chevron").style.transform = isOpen ? "rotate(-90deg)" : "rotate(0deg)";
  });

  box.appendChild(header);
  box.appendChild(body);
  container.appendChild(box);
});

document.getElementById("progress-label").textContent = "0 of " + total + " done";
</script>
</body>
